<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BSconta + Marketing</title>
  <link rel="icon" type="image/png" href="../assets/bsconta-icon.png" />
  <link rel="stylesheet" href="../css/styles.css?v=20261009" />
  <style>
    /* Campanhas mais vendidas (05/10/2026) — mesmo visual de "Motivos de perda" (tela Leads) */
    .camp-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem}
    .camp-head h2{margin:0}
    .camp-head p{font-size:.78rem;color:var(--text-faint);margin:.2rem 0 0}
    .camp-lista{display:flex;flex-direction:column;gap:.45rem;margin-top:.9rem}
    .camp-item{display:flex;flex-direction:column;gap:.35rem}
    .camp-row{all:unset;cursor:pointer;transition:border-color .12s,background .12s;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:.3rem .8rem;align-items:center;padding:.55rem .7rem;border:1px solid var(--border);border-radius:11px;background:var(--surface)}
    .camp-row:hover{background:var(--surface-2)}
    .camp-row:focus-visible{outline:2px solid var(--indigo-500);outline-offset:2px}
    .camp-row.ativo{border-color:var(--emerald-500);background:var(--emerald-50)}
    .camp-row.vazio{cursor:default;opacity:.65}
    .camp-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:.45rem;vertical-align:middle}
    .camp-seta{font-size:.7rem;color:var(--text-faint);margin-left:.35rem}
    .camp-pessoas{border:1px solid var(--border);border-radius:11px;overflow:auto;margin:0 0 .3rem}
    .camp-pessoas table{width:100%;font-size:.76rem}
    .camp-pessoas td small{display:block;color:var(--text-faint);font-size:.68rem}
    .camp-nome{font-size:.8rem;font-weight:750;color:var(--text)}
    .camp-nome small{font-weight:600;color:var(--text-faint);margin-left:.35rem}
    .camp-num{font-size:.74rem;color:var(--text-soft);text-align:right;white-space:nowrap}
    .camp-num strong{color:var(--text)}
    .camp-track{grid-column:1/-1;height:7px;border-radius:999px;background:var(--surface-2);overflow:hidden}
    .camp-track span{display:block;height:100%;border-radius:999px}
    @media (max-width:760px){.camp-head{flex-direction:column}.camp-row{grid-template-columns:1fr}.camp-num{text-align:left;white-space:normal}}
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="app-header"></div>
    <div class="app-content">
      <main class="main">
        <div id="content"><div class="loading-wrap"><div class="spinner"></div></div></div>
      </main>
    </div>
  </div>

  <!-- VELOCIDADE: estas bibliotecas ficavam no <head>, onde travam a
       pintura da tela até terminarem de baixar. Aqui embaixo o HTML
       aparece primeiro e elas carregam em seguida, antes dos nossos
       scripts — que é a única ordem que importa. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="../js/config.js?v=20260914"></script>
  <script src="../js/supabaseClient.js?v=20260914"></script>
  <script src="../js/auth.js?v=20260914"></script>
  <script src="../js/data.js?v=20261009"></script>
  <script src="../js/calc.js?v=20261009"></script>
  <script src="../js/ui.js?v=20260926"></script>
  <script src="../js/charts.js?v=20260914"></script>
  <script src="../js/sync.js?v=20260914"></script>
  <script src="../js/origens.js?v=20260928"></script>
  <script>
    let store = null;
    let canalAberto = ""; // canal clicado em "Campanhas mais vendidas" (mostra as pessoas)

    function render() {
      const { period } = currentPeriodFromUrl("this_month");
      const range = resolvePeriod(period);

      const sellerById = new Map(store.sellers.map((s) => [s.id, s]));
      const dealById = new Map(store.deals.map((d) => [d.id, d]));

      const saleRows = store.sales
        .filter((s) => inRange(s.closed_at, range))
        .map((s) => {
          const deal = dealById.get(s.deal_id);
          const seller = sellerById.get(s.seller_id);
          return { ...s, clientName: deal?.client_name, companyName: deal?.company_name, sellerName: seller?.name };
        })
        .sort((a, b) => a.closed_at - b.closed_at);

      const totalValue = saleRows.reduce((a, s) => a + Number(s.value), 0);

      // Uma linha por PRODUTO na tabela "Vendas do período" (09/10/2026): um
      // cliente com produto mensal + único aparece em 2 linhas, cada uma com
      // o seu tipo de cobrança. Contagens e totais continuam por venda.
      const produtosDoCard = produtosPorNegociacao(store);
      const linhasTabela = saleRows.flatMap((s) => linhasDaVenda(s, produtosDoCard.get(s.deal_id)).map((l) => ({ ...s, ...l })));
      const tipoHtml = (l) => l.tipo === "RECORRENTE"
        ? `<span class="tipo-venda tipo-venda-recorrente">Recorrente${l.recorrencia && l.recorrencia !== "Recorrente" ? ` · ${esc(l.recorrencia)}` : ""}</span>`
        : `<span class="tipo-venda tipo-venda-unico">Único</span>`;

      const proposalStage = store.stages.find((s) => s.name === "Enviar Proposta");
      const probableStage = store.stages.find((s) => s.name === "Provável Fechamento");
      const countOpenByStage = (stageId) => (stageId ? store.deals.filter((d) => d.stage_id === stageId && d.status === "OPEN").length : 0);

      const wonInPeriod = saleRows.length;

      // Campanhas mais vendidas (pedido do usuário, 05/10/2026): vendas do
      // período agrupadas pelos mesmos canais de "Origem dos leads" (aba
      // Marketing, js/origens.js), na ordem fixa dos canais. Clicar num canal
      // mostra quem comprou e por qual campanha do RD Station.
      const canaisVenda = [...CANAIS_LEAD, CANAL_OUTROS].map((c) => ({ id: c.id, nome: c.nome, cor: c.cor, n: 0, valor: 0, pessoas: [] }));
      const canalPorId = new Map(canaisVenda.map((c) => [c.id, c]));
      for (const s of saleRows) {
        const deal = dealById.get(s.deal_id) || {};
        const rd = (deal.campaign || "").trim();
        const campanha = !rd || /^sem campanha$/i.test(rd) ? "Sem campanha" : rd;
        const alvo = canalPorId.get(canalDaFonte(deal.origin).id) || canalPorId.get("outros");
        alvo.n += 1;
        alvo.valor += Number(s.value) || 0;
        alvo.pessoas.push({ ...s, campanha, fonte: deal.origin || "" });
      }
      const totalVendasCanais = saleRows.length || 1;
      const maxCanal = Math.max(1, ...canaisVenda.map((c) => c.n));
      const canalTop = [...canaisVenda].sort((x, y) => y.n - x.n || y.valor - x.valor)[0];

      const perSeller = store.sellers
        .filter((seller) => /uriel/i.test(seller.name))
        .map((seller) => {
          const rows = saleRows.filter((s) => s.sellerName === seller.name);
          return { name: seller.name, count: rows.length, value: rows.reduce((a, s) => a + Number(s.value), 0) };
        })
        .sort((a, b) => b.value - a.value);

      document.getElementById("content").innerHTML = `
        <div class="space-y">
          <div class="row-between">
            <h1 class="page-title">Vendas</h1>
            <div class="header-actions">
              <div id="period-filter"></div>
              <button type="button" class="icon-btn" aria-label="Calendário">${ICONS.meeting}</button>
            </div>
          </div>
          ${(() => { const antes = previousRange(range); const valorAntes = store.sales.filter((s) => inRange(s.closed_at, antes)).reduce((a, s) => a + Number(s.value), 0); const variacao = pctChange(totalValue, valorAntes); return perfBannerHtml({ titulo: "Performance de Vendas do período", nota: saleRows.length === 0 ? NOTAS_PERF.ruim : notaPorVariacao(variacao), desc: `${saleRows.length} venda${saleRows.length === 1 ? "" : "s"} · ${brl(totalValue)} no período · ${variacao == null ? "sem período anterior para comparar" : `${variacao >= 0 ? "↑" : "↓"} ${Math.abs(variacao).toFixed(0)}% vs. período anterior`}` }); })()}
<div id="kpi-grid"></div>

          <div class="card card-p table-scroll">
            <h2>Vendas por vendedor</h2>
            <div style="position:relative;height:${Math.max(64, perSeller.filter((v) => v.value > 0).length * 34 + 22)}px;margin-bottom:0.9rem">
              <canvas id="chart-vendas-vendedor"></canvas>
            </div>
            <table>
              <thead>
                <tr>
                  <th>Vendedor</th>
                  <th class="cell-num">Vendas</th>
                  <th class="cell-num">Valor</th>
                </tr>
              </thead>
              <tbody>
                ${perSeller
                  .map(
                    (s) => `
                  <tr>
                    <td><div class="person-cell"><span class="avatar avatar-sm">${initials(s.name)}</span>${esc(s.name)}</div></td>
                    <td class="cell-num cell-blue">${s.count}</td>
                    <td class="cell-num cell-green">${brl(s.value)}</td>
                  </tr>`
                  )
                  .join("")}
                ${perSeller.length === 0 ? `<tr><td colspan="3" class="text-empty">Nenhum vendedor cadastrado ainda.</td></tr>` : ""}
              </tbody>
            </table>
          </div>

          <div class="card card-p">
            <div class="camp-head">
              <div>
                <h2>Campanhas mais vendidas</h2>
                <p>Vendas fechadas no período por canal — os mesmos canais de "Origem dos leads". Clique num canal para ver quem comprou e por qual campanha.</p>
              </div>
              ${canalTop && canalTop.n ? `<span class="client-count-pill">Mais vendido: ${esc(canalTop.nome)}</span>` : ""}
            </div>
            <div class="camp-lista">
              ${canaisVenda.map((c) => `
                <div class="camp-item">
                  <button type="button" class="camp-row ${c.n ? "" : "vazio"} ${canalAberto === c.id && c.n ? "ativo" : ""}" data-canal="${c.id}" ${c.n ? "" : "disabled"} aria-expanded="${canalAberto === c.id}">
                    <span class="camp-nome"><i class="camp-dot" style="background:${c.cor}"></i>${esc(c.nome)}${c.n ? `<span class="camp-seta">${canalAberto === c.id ? "▲ ocultar pessoas" : "▼ ver pessoas"}</span>` : ""}</span>
                    <span class="camp-num"><strong>${c.n} venda${c.n === 1 ? "" : "s"}</strong> · ${((c.n / totalVendasCanais) * 100).toFixed(0)}% · ${brl(c.valor)}</span>
                    <span class="camp-track"><span style="width:${(c.n / maxCanal) * 100}%;background:${c.cor}"></span></span>
                  </button>
                  ${canalAberto === c.id && c.n ? `
                    <div class="camp-pessoas">
                      <table>
                        <thead><tr><th>Data</th><th>Cliente</th><th>Campanha</th><th>Vendedor</th><th class="cell-num">Valor</th></tr></thead>
                        <tbody>
                          ${c.pessoas.map((p) => `<tr>
                            <td>${p.closed_at.toLocaleDateString("pt-BR")}</td>
                            <td>${esc(p.clientName) || "—"}${p.companyName ? `<small>${esc(p.companyName)}</small>` : ""}</td>
                            <td>${esc(p.campanha)}${p.fonte ? `<small>${esc(p.fonte)}</small>` : ""}</td>
                            <td>${esc(p.sellerName) || "—"}</td>
                            <td class="cell-num cell-green">${brl(p.value)}</td>
                          </tr>`).join("")}
                        </tbody>
                      </table>
                    </div>` : ""}
                </div>`).join("")}
            </div>
          </div>

          <div class="card card-p table-scroll">
            <h2>Vendas do período</h2>
            <table class="vendas-linhas">
              <thead>
                <tr>
                  <th>Data</th>
                  <th>Cliente</th>
                  <th>Empresa</th>
                  <th>Vendedor</th>
                  <th>Produto</th>
                  <th class="cell-num">Valor</th>
                  <th class="cell-num">Tipo</th>
                </tr>
              </thead>
              <tbody>
                ${linhasTabela
                  .map(
                    (s) => `<tr>
                      <td>${s.closed_at.toLocaleDateString("pt-BR")}</td>
                      <td>${esc(s.clientName) || "—"}${s.totalLinhas > 1 ? `<small>Produto ${s.indice} de ${s.totalLinhas}</small>` : ""}</td>
                      <td>${esc(s.companyName) || "—"}</td>
                      <td><div class="person-cell"><span class="avatar avatar-sm">${initials(s.sellerName)}</span>${esc(s.sellerName) || "—"}</div></td>
                      <td>${s.produto ? esc(s.produto) : `<span class="text-empty">Sem produto no RD</span>`}</td>
                      <td class="cell-num cell-green">${brl(s.value)}</td>
                      <td class="cell-num">${tipoHtml(s)}</td>
                    </tr>`
                  )
                  .join("")}
                ${linhasTabela.length === 0 ? `<tr><td colspan="7" class="text-empty">Nenhuma venda no período selecionado.</td></tr>` : ""}
              </tbody>
            </table>
          </div>
        </div>
      `;

      document.querySelectorAll(".camp-row[data-canal]").forEach((btn) => btn.addEventListener("click", () => {
        const id = btn.dataset.canal;
        canalAberto = canalAberto === id ? "" : id;
        render();
      }));

      renderBarrasPorPessoa(
        "chart-vendas-vendedor",
        perSeller.map((v) => ({ nome: v.name, valor: v.value, detalhe: `${v.count} venda${v.count === 1 ? "" : "s"}` })),
        { dinheiro: true, vazio: "Nenhuma venda no período." }
      );

      renderPeriodFilter(document.getElementById("period-filter"), store.sellers, render, { defaultPeriod: "this_month", showSellerFilter: false });
      setupCalendarPicker(render);
      renderKpiGrid(document.getElementById("kpi-grid"), [
        { label: "Quantidade de vendas", value: wonInPeriod, tone: "green", icon: ICONS.sales },
        { label: "Valor total vendido", value: totalValue, format: "currency", tone: "green", icon: ICONS.dollarSign },
        { label: "Em proposta", value: countOpenByStage(proposalStage?.id), tone: "violet", icon: ICONS.send },
        { label: "Provável fechamento", value: countOpenByStage(probableStage?.id), tone: "amber", icon: ICONS.checkCircle },
      ]);
    }

    (async () => {
      try {
        // VELOCIDADE: a busca dos dados COMEÇA JÁ, sem esperar o perfil.
        // Antes era uma fila: perguntava quem é o usuário, esperava a resposta
        // do servidor, e só então começava a carregar os dados — uma ida e
        // volta inteira (~250 ms) parada no caminho. As duas coisas não
        // dependem uma da outra, então agora andam juntas.
        const dados = loadAllInstantaneo((novo) => {
          store = novo;
          render();
        }).catch((e) => e); // guardado para ser relançado depois do login

        const auth = await requireAuth();
        if (!auth) return; // sem sessão: já foi redirecionado para o login
        renderShell(auth.profile);

        const resultado = await dados;
        if (resultado instanceof Error) throw resultado;
        store = resultado;
        render();
        // Sincroniza com RD/Agenda ao abrir a página (não trava a tela: os
        // dados atuais já apareceram acima e a tela se atualiza sozinha
        // quando a sincronização terminar).
        startPageLoadSync(async () => {
          store = await loadAll({ fresh: true });
          render();
        });
      } catch (err) {
        console.error(err);
        showFatalError(err);
      }
    })();
  </script>
</body>
</html>
