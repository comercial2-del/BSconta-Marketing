<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BSconta + Marketing</title>
  <link rel="icon" type="image/png" href="../assets/bsconta-icon.png" />
  <link rel="stylesheet" href="../css/styles.css?v=20261104" />
  <style>
    /* Organização da Visão geral (26/09/2026) */
    .kpi-span-2{grid-column:span 2;min-width:0;display:flex}
    .kpi-span-2 .kpi-wide-card{flex:1;height:100%;margin:0}
    .vendas-duo{display:grid;grid-template-columns:minmax(280px,1fr) 2.2fr;gap:var(--gap);align-items:start}
    .vendas-duo > *{min-width:0;margin:0 !important}
    /* O card do valor total tem altura própria: não estica junto com a lista de clientes. */
    .vendas-duo .sales-highlight-card{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:1.2rem;margin:0}
    /* Coluna da esquerda: valor total + resumo financeiro (únicas x recorrentes), juntos e fixos ao rolar. */
    .vendas-coluna{display:flex;flex-direction:column;gap:var(--gap);align-self:start;position:sticky;top:1rem}
    .vendas-coluna > .card{margin:0}
    @media (max-width:1100px){.vendas-coluna{position:static}}
    .vendas-duo .sales-highlight-main{align-items:flex-start}
    .vendas-duo .sales-highlight-meta{text-align:left;align-items:flex-start;border-top:1px solid var(--border);padding-top:.9rem;width:100%}
    @media (max-width:1100px){.vendas-duo{grid-template-columns:1fr}}
    @media (max-width:640px){.kpi-span-2{grid-column:1 / -1}}
    .client-entries-table th.col-tipo,.client-entries-table td.col-tipo{text-align:center}
    /* Visão geral mais limpa (04/11/2026): valor total + resumo financeiro lado a
       lado no topo e a tabela de clientes na largura toda, com cabeçalho fixo. */
    .vendas-duo{grid-template-columns:1fr}
    .kpi-grid.cols-5 .kpi-card-top .kpi-label{hyphens:none;overflow-wrap:normal;word-break:normal;font-size:.66rem;letter-spacing:.03em}
    /* Cartão "Leads que chegaram": melhor campanha do período. */
    #kpi-grid .kpi-card:last-child .kpi-change:nth-of-type(2){font-size:.62rem;text-transform:uppercase;letter-spacing:.05em;font-weight:800;color:var(--text-faint);margin-top:.15rem}
    #kpi-grid .kpi-card:last-child .kpi-change:nth-of-type(3){color:var(--indigo-700);font-weight:800;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .vendas-coluna{display:block;position:static}
    .vendas-coluna .resumo-financeiro-lista{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:.6rem}
    .vendas-coluna > .card{height:100%}
    @media (max-width:900px){.vendas-coluna{grid-template-columns:1fr}}
    .client-entries-card{border-radius:16px}
    .client-table-wrap{overflow-x:auto;padding:0;margin:0 1.15rem 1rem;border:1px solid var(--border);border-radius:12px;scrollbar-width:none}
    .client-table-wrap::-webkit-scrollbar{display:none}
    .client-entries-table{width:100%;border-collapse:separate;border-spacing:0;font-size:.8rem}
    .client-entries-table thead th{background:var(--surface-2);white-space:normal;line-height:1.25;vertical-align:bottom;font-size:.6rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);font-weight:800;padding:.55rem .45rem;border-bottom:1px solid var(--border);text-align:left}
    .client-entries-table thead tr.grupo th{padding:.45rem .8rem;font-size:.6rem;color:var(--text-soft);border-bottom:none}
    .client-entries-table tbody td{padding:.55rem .45rem;border-bottom:1px solid var(--surface-2);vertical-align:middle;transition:background .15s}
    .client-entries-table tbody tr:last-child td{border-bottom:none}
    .client-entries-table tbody tr:hover td{background:#f7f8ff}
    .client-entries-table td.client-value{text-align:right}
    .client-entries-table th.col-valor{text-align:right}
    .client-cell{display:flex;align-items:center;gap:.5rem;min-width:140px}
    .client-avatar{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--indigo-50),#e0e7ff);color:var(--indigo-700);display:grid;place-items:center;font-size:.66rem;font-weight:850;flex:0 0 auto}
    .client-cell .client-primary{line-height:1.25}
    .client-entries-table td.client-value,.client-entries-table td.col-data,.client-entries-table td .client-status,.client-entries-table td .tipo-venda{white-space:nowrap}
    .client-entries-table .client-time{display:block;font-size:.68rem;color:var(--text-faint)}
    .client-entries-table .sem-produto{color:var(--text-faint);font-style:italic}
    .client-entries-table .col-campanha{max-width:115px;color:var(--text-soft);font-size:.74rem}
    .client-entries-table .produto-venda-nome{font-size:.76rem}
    .client-status-mini{margin-top:.2rem}
    .client-status-mini .client-status{font-size:.62rem;padding:.1rem .45rem}
    .client-entries-table tbody td:first-child,.client-entries-table thead tr.colunas th:first-child,.client-entries-table thead tr.grupo th:first-child{padding-left:.85rem}
    /* Colunas que vêm do RD (Conta Azul, Constituição/Troca, Qualidade): faixa leve para agrupar. */
    .client-entries-table .q-col{background:#f8f9ff;text-align:center}
    .client-entries-table thead th.q-col{background:#eef0fb;white-space:normal;min-width:72px}
    .client-entries-table .q-col.q-first{border-left:1px solid var(--border)}
    .client-entries-table tbody tr:hover td.q-col{background:#eff1ff}
    .q-badge{display:inline-flex;align-items:center;justify-content:center;min-width:28px;border-radius:999px;padding:.22rem .6rem;font-size:.68rem;font-weight:800;white-space:nowrap;animation:qFade .25s ease}
    .q-nivel{min-width:30px;height:30px;padding:0;border-radius:9px;font-size:.8rem;font-weight:900}
    @keyframes qFade{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
    .q-a,.q-sim{background:var(--emerald-100);color:var(--emerald-700)}
    .q-b{background:var(--blue-50);color:#1d4ed8}
    .q-c{background:var(--red-100);color:var(--red-700)}
    .q-vazio{background:transparent;color:var(--text-faint);font-weight:600;animation:none}
    .q-nao,.q-troca{background:var(--amber-100);color:var(--amber-700)}
    .q-const{background:var(--indigo-100);color:var(--indigo-700)}
    .client-mais{display:flex;align-items:center;justify-content:center;gap:.8rem;padding:0 1.15rem 1.1rem;font-size:.72rem;color:var(--text-faint)}
    .client-mais-btn{border:1px solid var(--indigo-100);background:var(--indigo-50);color:var(--indigo-700);border-radius:999px;padding:.5rem 1.1rem;font-size:.78rem;font-weight:800;cursor:pointer;font-family:inherit;transition:background .15s,transform .15s}
    .client-mais-btn:hover{background:#e0e7ff;transform:translateY(-1px)}
    .q-legenda{display:flex;flex-wrap:wrap;gap:.9rem;padding:0 1.15rem 1rem;margin:-.25rem 0 0;font-size:.7rem;color:var(--text-faint)}
    .q-legenda span{display:inline-flex;align-items:center;gap:.35rem}
    .q-legenda .q-badge{min-width:22px;height:22px;font-size:.66rem;animation:none}

    /* Ficha do cliente (17/11/2026): clicar numa linha da tabela abre um card
       no meio da tela com os dados básicos do cliente (RD + Receita Federal). */
    .client-entries-table tbody tr[data-deal]:not([data-deal=""]){cursor:pointer}
    .client-entries-table tbody tr[data-deal]:focus-visible{outline:2px solid var(--indigo-500);outline-offset:-2px}
    dialog.ficha-cliente{border:1px solid var(--border);border-radius:18px;padding:0;width:min(94vw,40rem);max-height:min(90vh,52rem);background:var(--surface);color:var(--text);box-shadow:0 24px 60px rgba(15,23,42,.24);overflow:hidden;animation:confirmacao-entra .16s ease-out}
    dialog.ficha-cliente[open]{display:flex;flex-direction:column}
    dialog.ficha-cliente::backdrop{background:rgba(15,23,42,.45);backdrop-filter:blur(2px)}
    @media (prefers-reduced-motion:reduce){dialog.ficha-cliente{animation:none}}
    .ficha-topo{display:flex;align-items:flex-start;gap:.85rem;padding:1.15rem 1.25rem 1rem;border-bottom:1px solid var(--border);background:linear-gradient(90deg,var(--indigo-50),var(--surface))}
    .ficha-avatar{flex:none;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--indigo-600);color:#fff;font-weight:800;font-size:.95rem}
    .ficha-titulo{flex:1;min-width:0}
    .ficha-titulo h2{margin:0;font-size:1.08rem;line-height:1.25;overflow-wrap:anywhere}
    .ficha-titulo p{margin:.15rem 0 0;font-size:.78rem;color:var(--text-soft)}
    .ficha-selos{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.55rem}
    .ficha-selos .q-badge{animation:none}
    .ficha-fechar{flex:none;border:none;background:transparent;color:var(--text-soft);width:34px;height:34px;border-radius:9px;font-size:1.35rem;line-height:1;cursor:pointer}
    .ficha-fechar:hover{background:var(--surface-2);color:var(--text)}
    .ficha-corpo{padding:1rem 1.25rem 1.1rem;overflow:auto;display:flex;flex-direction:column;gap:1.05rem;scrollbar-width:none;-ms-overflow-style:none}
    /* Sem barra de rolagem visível na ficha (17/11/2026): continua rolando com o mouse, o toque e o teclado. */
    .ficha-corpo::-webkit-scrollbar{display:none;width:0;height:0}
    .ficha-secao h3{margin:0 0 .55rem;font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);font-weight:800;display:flex;justify-content:space-between;gap:.5rem}
    .ficha-secao h3 small{font-size:.62rem;text-transform:none;letter-spacing:0;font-weight:600}
    .ficha-grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.55rem .9rem}
    .ficha-item{min-width:0;padding:.5rem .65rem;border:1px solid var(--surface-2);background:var(--surface-2);border-radius:10px}
    .ficha-item.largo{grid-column:1/-1}
    .ficha-rotulo{font-size:.64rem;color:var(--text-faint);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
    .ficha-valor{font-size:.84rem;font-weight:600;margin-top:.1rem;overflow-wrap:anywhere;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
    .ficha-valor.vazio{color:var(--text-faint);font-weight:500;font-style:italic}
    .ficha-valor a{color:var(--indigo-600);text-decoration:none}
    .ficha-valor a:hover{text-decoration:underline}
    .ficha-copiar{border:1px solid var(--border);background:var(--surface);border-radius:7px;padding:.12rem .45rem;font-size:.66rem;font-weight:700;color:var(--text-soft);cursor:pointer}
    .ficha-copiar:hover{color:var(--indigo-600);border-color:var(--indigo-100)}
    .ficha-aviso{font-size:.76rem;color:var(--text-soft);padding:.6rem .7rem;border-radius:10px;background:var(--surface-2)}
    .ficha-situacao-ativa{color:var(--emerald-700)}
    .ficha-situacao-alerta{color:var(--red-600)}
    .ficha-rodape{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.8rem 1.25rem;border-top:1px solid var(--border);background:var(--surface-2)}
    .ficha-rodape a{font-size:.8rem;font-weight:700;color:var(--indigo-600);text-decoration:none}
    .ficha-rodape a:hover{text-decoration:underline}
    .ficha-rodape button{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:.45rem .95rem;font-weight:700;font-size:.82rem;cursor:pointer;color:var(--text)}
    @media (max-width:560px){.ficha-grade{grid-template-columns:1fr}.ficha-topo,.ficha-corpo,.ficha-rodape{padding-left:1rem;padding-right:1rem}}
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="app-header"></div>
    <div class="app-content">
      <main class="main">
        <div id="content"><div class="loading-wrap"><div class="spinner"></div></div></div>
      </main>
    </div>
  </div>

  <!-- VELOCIDADE: estas bibliotecas ficavam no <head>, onde travam a
       pintura da tela até terminarem de baixar. Aqui embaixo o HTML
       aparece primeiro e elas carregam em seguida, antes dos nossos
       scripts — que é a única ordem que importa. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/config.js?v=20260916"></script>
  <script src="../js/supabaseClient.js?v=20260916"></script>
  <script src="../js/auth.js?v=20260916"></script>
  <script src="../js/data.js?v=20261009"></script>
  <script src="../js/calc.js?v=20261104b"></script>
  <script src="../js/ui.js?v=20260925b"></script>
  <script src="../js/lancamentos.js?v=20260916"></script>
  <script src="../js/sync.js?v=20260916"></script>
  <script src="../js/charts.js?v=20260916.2"></script>
<script src="../js/leads.js?v=20260925b"></script>
<script src="../js/qualificacao.js?v=20261104"></script>
  <script>
    let store = null;
    let lancamentos = []; // lançamento manual de ligações (js/lancamentos.js)
    let dashboardChartTab = null;

    function trendBuckets(range, count = 7) {
      const start = new Date(range.start);
      const end = new Date(range.end);
      const total = Math.max(1, end - start);
      const buckets = [];
      for (let i = 0; i < count; i++) {
        const a = new Date(start.getTime() + total * (i / count));
        const b = i === count - 1 ? new Date(end) : new Date(start.getTime() + total * ((i + 1) / count));
        buckets.push({ start: a, end: b, label: a.toLocaleDateString("pt-BR", { day:"2-digit", month:"2-digit" }) });
      }
      return buckets;
    }

    function valueInBucket(dateValue, bucket) {
      if (!dateValue) return false;
      const d = new Date(dateValue);
      return d >= bucket.start && d <= bucket.end;
    }

    function buildDashboardTrend(tab, range, sellerId) {
      if (tab === "marketing") {
        const rows = MARKETING_SDR_DATA.filter(r => r.period >= `${range.start.getFullYear()}-${String(range.start.getMonth()+1).padStart(2,"0")}` && r.period <= `${range.end.getFullYear()}-${String(range.end.getMonth()+1).padStart(2,"0")}`);
        return {
          labels: rows.map(r => r.label),
          datasets: [
            { label: "Leads", data: rows.map(r => r.leads), color: "#2563eb" },
            { label: "Contratos", data: rows.map(r => r.contratos), color: "#16a34a" },
          ]
        };
      }
      const buckets = trendBuckets(range, 7);
      const activities = (store.activities || []).filter(a => (!sellerId || a.seller_id === sellerId));
      const sales = (store.sales || []).filter(a => (!sellerId || a.seller_id === sellerId));
      const sellerFilter = { sellerId };
      return {
        labels: buckets.map(b => b.label),
        datasets: tab === "sdr"
          ? [
              { label: "Reuniões agendadas", data: buckets.map(b => getKpis({ ...store, activities: activities.filter(a => valueInBucket(a.scheduled_at, b)) }, sellerFilter).meetingsScheduled), color: "#4f46e5" },
              { label: "Reuniões realizadas", data: buckets.map(b => getKpis({ ...store, activities: activities.filter(a => valueInBucket(a.scheduled_at, b)) }, sellerFilter).meetingsDone), color: "#16a34a" },
            ]
          : [
              { label: "Reuniões realizadas", data: buckets.map(b => getKpis({ ...store, activities: activities.filter(a => valueInBucket(a.scheduled_at, b)) }, sellerFilter).meetingsDone), color: "#4f46e5" },
              { label: "Vendas realizadas", data: buckets.map(b => sales.filter(a => valueInBucket(a.closed_at, b)).length), color: "#059669" },
            ]
      };
    }

    function ensureChartJs() {
      if (window.Chart) return Promise.resolve();
      if (window.__chartJsPromise) return window.__chartJsPromise;
      window.__chartJsPromise = new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = "https://cdn.jsdelivr.net/npm/chart.js@4";
        script.onload = resolve;
        script.onerror = () => reject(new Error("Não foi possível carregar o componente de gráficos."));
        document.head.appendChild(script);
      });
      return window.__chartJsPromise;
    }

    function renderDashboardChartsArea(range, sellerId) {
      const host = document.getElementById("dashboard-charts-area");
      if (!host) return;
      const tabs = [
        ["marketing", "Marketing", "Gráficos - Marketing"],
        ["sdr", "SDR", "Gráficos - SDR"],
        ["overview", "Visão geral", "Gráficos - Visão geral"]
      ];
      const tabHtml = tabs.map(([key, label]) => `<button type="button" class="dashboard-tab ${dashboardChartTab === key ? "active" : ""}" data-dashboard-tab="${key}"><span class="dashboard-tab-icon" aria-hidden="true">${key === "marketing" ? ICONS.send : key === "sdr" ? ICONS.user : ICONS.overview}</span><span>${label}</span></button>`).join("");
      if (!dashboardChartTab) {
        host.innerHTML = `<div class="dashboard-tabs-card"><aside class="dashboard-tabs-sidebar" aria-label="Navegação de gráficos"><div class="dashboard-tabs-sidebar-title">Gráficos</div><nav class="dashboard-tabs-nav">${tabHtml}</nav></aside><section class="dashboard-tab-panel"><div class="dashboard-tab-empty"><strong>Nenhuma área selecionada</strong><span>Escolha Marketing, SDR ou Visão geral no menu ao lado para visualizar os gráficos.</span></div></section></div>`;
      } else {
        const active = tabs.find(t => t[0] === dashboardChartTab) || tabs[0];
        const trend = buildDashboardTrend(dashboardChartTab, range, sellerId);
        const legends = trend.datasets.map(d => `<span><i style="background:${d.color}"></i>${esc(d.label)}</span>`).join("");
        host.innerHTML = `<div class="dashboard-tabs-card"><aside class="dashboard-tabs-sidebar" aria-label="Navegação de gráficos"><div class="dashboard-tabs-sidebar-title">Gráficos</div><nav class="dashboard-tabs-nav">${tabHtml}</nav></aside><section class="dashboard-tab-panel"><div class="dashboard-chart-head"><div><h3 class="dashboard-chart-title">${active[2]}</h3><p class="dashboard-chart-sub">Evolução no período selecionado · use os filtros acima para alterar o recorte.</p></div><div class="dashboard-chart-legend">${legends}</div></div><div class="dashboard-chart-wrap" id="dashboard-chart-host"><div class="dashboard-tab-empty" style="min-height:260px"><strong>Carregando gráfico...</strong><span>Preparando a visualização do período.</span></div></div></section></div>`;
        ensureChartJs().then(() => {
          const chartHost = document.getElementById("dashboard-chart-host");
          if (!chartHost) return;
          chartHost.innerHTML = '<canvas id="dashboard-trend-chart"></canvas>';
          renderDashboardLineChart("dashboard-trend-chart", trend.labels, trend.datasets);
        }).catch((err) => {
          const chartHost = document.getElementById("dashboard-chart-host");
          if (chartHost) chartHost.innerHTML = `<div class="dashboard-tab-empty" style="min-height:260px"><strong>Não foi possível carregar o gráfico</strong><span>${esc(err.message)}</span></div>`;
        });
      }
      host.querySelectorAll("[data-dashboard-tab]").forEach(btn => btn.addEventListener("click", () => { dashboardChartTab = btn.dataset.dashboardTab; renderDashboardChartsArea(range, sellerId); }));
    }

    function performanceLabel(kpis) {
      const rate = kpis.meetingRealizationRate ?? 0;
      if (kpis.salesCount >= 3 && rate >= 70) return { label: "Excelente", tone: "green" };
      if (kpis.salesCount >= 1 && rate >= 50) return { label: "Boa", tone: "blue" };
      if (rate >= 30) return { label: "Atenção", tone: "amber" };
      return { label: "Ruim", tone: "red" };
    }

    function clientStatusBadge(status) {
      const map = { WON: ["Ganho", "client-status-won"], OPEN: ["Em andamento", "client-status-open"], LOST: ["Perdido", "client-status-lost"] };
      const [label, cls] = map[status] || [status || "—", "client-status-neutral"];
      return `<span class="client-status ${cls}">${esc(label)}</span>`;
    }

    function formatDateTimePt(d) {
      if (!d) return "—";
      const date = new Date(d);
      if (Number.isNaN(date.getTime())) return "—";
      return `${date.toLocaleDateString("pt-BR")} <span class="client-time">${date.toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"})}</span>`;
    }

    /** Selo do tipo de cobrança: "Recorrente · Mensal" ou "Único". */
    function tipoVendaHtml(r) {
      return r.tipo === "RECORRENTE"
        ? `<span class="tipo-venda tipo-venda-recorrente">Recorrente${r.recorrencia && r.recorrencia !== "Recorrente" ? ` · ${esc(r.recorrencia)}` : ""}</span>`
        : `<span class="tipo-venda tipo-venda-unico">Único</span>`;
    }

    function produtoVendaHtml(r) {
      const nome = r.produto
        ? `<span class="produto-venda-nome">${esc(r.produto)}${r.quantidade > 1 ? ` × ${r.quantidade}` : ""}</span>`
        : `<span class="produto-venda-nome sem-produto">Sem produto no RD</span>`;
      return `<div class="produto-venda">${nome}</div>`;
    }

    /** Card "Resumo financeiro": vendas únicas, recorrentes e total (mesma base do valor total). */
    function resumoFinanceiroHtml(split) {
      const qtd = (n) => `${n} venda${n === 1 ? "" : "s"}`;
      return `
        <h2>Resumo financeiro das vendas</h2>
        <p class="resumo-financeiro-sub">Vendas fechadas no período, separadas pelo tipo de cobrança dos produtos no RD Station.</p>
        <ul class="resumo-financeiro-lista">
          <li class="resumo-financeiro-item unico"><i aria-hidden="true"></i><span class="resumo-financeiro-rotulo">Vendas únicas<small>Pagamento único · ${qtd(split.countUnique)}</small></span><span class="resumo-financeiro-valor" data-resumo="unico">${brl(split.unique)}</span></li>
          <li class="resumo-financeiro-item recorrente"><i aria-hidden="true"></i><span class="resumo-financeiro-rotulo">Vendas recorrentes<small>Mensalidades · ${qtd(split.countRecurring)}</small></span><span class="resumo-financeiro-valor" data-resumo="recorrente">${brl(split.recurring)}</span></li>
        </ul>
      `;
    }

    // Campos do RD preenchidos pelo vendedor (04/11/2026): Conta Azul,
    // Constituição ou Troca e Qualidade do Cliente (A/B/C). Vêm de
    // deals.rd_details.campos, buscados só para as vendas da tabela.
    const camposRd = new Map();
    const detalhesRd = new Map(); // dealId → rd_details completo + rd_deal_id
    let camposRdBusca = null;
    async function carregarCamposRd(ids) {
      if (camposRdBusca) await camposRdBusca.catch(() => {}); // uma busca por vez
      const faltam = [...new Set(ids)].filter((id) => id && !camposRd.has(id));
      if (!faltam.length) return true;
      camposRdBusca = (async () => {
        const lotes = [];
        for (let i = 0; i < faltam.length; i += 100) lotes.push(faltam.slice(i, i + 100));
        // Lotes em paralelo: uma espera só, em vez de uma por lote.
        const respostas = await Promise.all(lotes.map((lote) => sb.from("deals").select("id, rd_deal_id, rd_details").in("id", lote)));
        respostas.forEach(({ data, error }, i) => {
          if (error) { console.warn("Campos do RD indisponíveis:", error.message); return; }
          for (const id of lotes[i]) camposRd.set(id, []);
          for (const r of data || []) {
            camposRd.set(r.id, (r.rd_details && r.rd_details.campos) || []);
            // Quadro inteiro (contatos, CNPJ, fonte...) para a ficha do cliente.
            detalhesRd.set(r.id, { ...(r.rd_details || {}), rd_deal_id: r.rd_deal_id });
          }
        });
      })();
      try { await camposRdBusca; } finally { camposRdBusca = null; }
      return true;
    }
    function qualifBadge(v, cls) {
      return v ? `<span class="q-badge ${cls}">${esc(v)}</span>` : `<span class="q-badge q-vazio">—</span>`;
    }
    function qualifCelulas(dealId) {
      const q = qualifDoDeal(camposRd.get(dealId));
      const nivel = q.qualidade ? `<span class="q-badge q-nivel ${QUALIF_NIVEIS[q.qualidade].classe}" title="${esc(QUALIF_NIVEIS[q.qualidade].desc)}">${q.qualidade}</span>` : qualifBadge("", "");
      return `<td class="q-col q-first" data-q="ca">${qualifBadge(q.contaAzul, q.contaAzul === "Sim" ? "q-sim" : "q-nao")}</td><td class="q-col" data-q="en">${qualifBadge(q.entrada, q.entrada === "Constituição" ? "q-const" : "q-troca")}</td><td class="q-col" data-q="ql">${nivel}</td>`;
    }
    // Quando os campos do RD chegam, troca só as 3 células de cada linha — a
    // tabela não pisca e a rolagem não volta para o topo.
    function preencherQualif(wrap) {
      wrap.querySelectorAll("tr[data-deal]").forEach((tr) => {
        const id = tr.dataset.deal;
        if (!camposRd.has(id)) return;
        tr.querySelectorAll("td.q-col").forEach((td) => td.remove());
        tr.insertAdjacentHTML("beforeend", qualifCelulas(id));
      });
    }

    // Mostra 20 linhas e libera mais aos poucos: a página fica curta, sem barra
    // de rolagem dentro da tabela, e desenha mais rápido.
    let clientLimite = 20;
    let clientChave = "";
    let clientLinhasAtuais = [];

    // -----------------------------------------------------------------------
    // Ficha do cliente (17/11/2026): clicar numa linha da tabela "Clientes das
    // vendas realizadas" abre um card no meio da tela com os dados básicos:
    // empresa, CNPJ, contato (telefone/e-mail), a venda e, quando há CNPJ, a
    // situação na Receita Federal. Tudo vem de deals.rd_details (o mesmo quadro
    // "Negociação" do RD que a tela Onboarding usa) — nada novo no banco.
    // -----------------------------------------------------------------------
    const soDigitosFicha = (v) => String(v || "").replace(/\D/g, "");
    function formatarCnpjFicha(v) {
      const d = soDigitosFicha(v);
      return d.length === 14 ? d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, "$1.$2.$3/$4-$5") : String(v || "");
    }
    function formatarTelefoneFicha(v) {
      let d = soDigitosFicha(v);
      if (d.length > 11 && d.startsWith("55")) d = d.slice(2);
      if (d.length === 11) return d.replace(/^(\d{2})(\d{5})(\d{4})$/, "($1) $2-$3");
      if (d.length === 10) return d.replace(/^(\d{2})(\d{4})(\d{4})$/, "($1) $2-$3");
      return String(v || "").trim();
    }
    function campoRdFicha(det, ...rotulos) {
      for (const rotulo of rotulos) {
        const v = qualifCampo(det && det.campos, rotulo);
        if (v) return v;
      }
      return "";
    }
    const dataIsoBrFicha = (v) => { const m = String(v || "").match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1]}` : (v || ""); };

    // Consulta pública do CNPJ (BrasilAPI — a mesma da tela Onboarding). Uma por
    // CNPJ por sessão; erro não fica guardado, para tentar de novo depois.
    const cnpjFichaCache = new Map();
    function consultarCnpjFicha(d) {
      if (cnpjFichaCache.has(d)) return cnpjFichaCache.get(d);
      const p = fetch(`https://brasilapi.com.br/api/cnpj/v1/${d}`)
        .then(async (r) => {
          if (r.status === 404) return { erro: "CNPJ não encontrado na Receita Federal. Confira o número no RD." };
          if (!r.ok) throw new Error(`HTTP ${r.status}`);
          const j = await r.json();
          return {
            razao: j.razao_social || "",
            fantasia: j.nome_fantasia || "",
            situacao: j.descricao_situacao_cadastral || "",
            abertura: dataIsoBrFicha(j.data_inicio_atividade),
            porte: j.porte || "",
            natureza: j.natureza_juridica || "",
            cnae: [j.cnae_fiscal, j.cnae_fiscal_descricao].filter(Boolean).join(" — "),
            cidadeUf: [j.municipio, j.uf].filter(Boolean).join("/"),
            regime: j.opcao_pelo_mei ? "MEI" : j.opcao_pelo_simples ? "Simples Nacional" : j.opcao_pelo_simples === false ? "Não optante pelo Simples" : "",
            socios: (j.qsa || []).length,
          };
        })
        .catch(() => { cnpjFichaCache.delete(d); return { erro: "Não foi possível consultar a Receita agora. Tente abrir a ficha de novo em instantes." }; });
      cnpjFichaCache.set(d, p);
      return p;
    }

    function fichaItem(rotulo, valorHtml, { largo = false } = {}) {
      const vazio = valorHtml == null || valorHtml === "";
      return `<div class="ficha-item${largo ? " largo" : ""}"><div class="ficha-rotulo">${esc(rotulo)}</div><div class="ficha-valor${vazio ? " vazio" : ""}">${vazio ? "Não informado" : valorHtml}</div></div>`;
    }

    function fichaDialog() {
      let dlg = document.getElementById("ficha-cliente");
      if (dlg) return dlg;
      dlg = document.createElement("dialog");
      dlg.id = "ficha-cliente";
      dlg.className = "ficha-cliente";
      dlg.setAttribute("aria-labelledby", "ficha-cliente-titulo");
      document.body.appendChild(dlg);
      // Fecha clicando fora do card (no fundo escurecido) ou no "×"/"Fechar".
      dlg.addEventListener("click", (e) => {
        if (e.target === dlg || e.target.closest("[data-ficha-fechar]")) { dlg.close(); return; }
        const copiar = e.target.closest("[data-copiar]");
        if (copiar) {
          navigator.clipboard?.writeText(copiar.dataset.copiar).then(() => {
            copiar.textContent = "Copiado!";
            setTimeout(() => { copiar.textContent = "Copiar"; }, 1500);
          }).catch(() => {});
        }
      });
      return dlg;
    }

    async function abrirFichaCliente(dealId) {
      const linhas = clientLinhasAtuais.filter((r) => r.dealId === dealId);
      if (!linhas.length) return;
      const dlg = fichaDialog();
      dlg.dataset.deal = dealId;
      // Os campos do RD já vêm junto com a tabela; se ainda não chegaram, busca agora.
      if (!detalhesRd.has(dealId)) {
        desenharFicha(dlg, linhas, null, true);
        if (!dlg.open) dlg.showModal();
        await carregarCamposRd([dealId]).catch(() => {});
        if (dlg.dataset.deal !== dealId || !dlg.open) return;
      }
      desenharFicha(dlg, linhas, detalhesRd.get(dealId) || {}, false);
      if (!dlg.open) dlg.showModal();
    }

    function desenharFicha(dlg, linhas, det, carregando) {
      const r = linhas[0];
      const q = qualifDoDeal(det && det.campos);
      const contatos = (det && det.contatos) || [];
      const contato = contatos[0] || {};
      const empresa = campoRdFicha(det, "Nome da empresa") || (r.companyName && r.companyName !== "—" ? r.companyName : "");
      const titulo = empresa || r.clientName;
      const cnpjBruto = campoRdFicha(det, "CNPJ");
      const cnpjDig = soDigitosFicha(cnpjBruto);
      const cnpj = cnpjBruto ? formatarCnpjFicha(cnpjBruto) : "";
      const servico = campoRdFicha(det, "Serviço contratado", "Serviço contratado (antigo)");
      const telefones = [...new Set(contatos.flatMap((c) => c.telefones || []).map(formatarTelefoneFicha).filter(Boolean))];
      const emails = [...new Set([
        ...contatos.flatMap((c) => c.emails || []),
        ...((det && det.campos) || []).filter((c) => /e-?mail/i.test(c.label || "")).map((c) => c.value),
      ].map((e) => String(e || "").trim().toLowerCase()).filter((e) => e.includes("@")))];
      const total = linhas.reduce((s, l) => s + (Number(l.value) || 0), 0);
      const produtos = linhas.map((l) => `${l.produto ? esc(l.produto) + (l.quantidade > 1 ? ` × ${l.quantidade}` : "") + " · " : ""}${tipoVendaHtml(l)} <span>${brl(l.value)}</span>`).join("<br>");
      const origem = [det && det.fonte, det && det.campanha].filter(Boolean).join(" · ") || (r.campaign !== "Não informado" ? r.campaign : "");
      const nivel = q.qualidade ? QUALIF_NIVEIS[q.qualidade] : null;

      const selos = [
        clientStatusBadge(r.status),
        nivel ? `<span class="q-badge ${nivel.classe}" title="${esc(nivel.desc)}">Qualidade ${q.qualidade}</span>` : "",
        q.entrada ? `<span class="q-badge ${q.entrada === "Constituição" ? "q-const" : "q-troca"}">${esc(q.entrada)}</span>` : "",
        q.contaAzul ? `<span class="q-badge ${q.contaAzul === "Sim" ? "q-sim" : "q-nao"}">Conta Azul: ${esc(q.contaAzul)}</span>` : "",
      ].join("");

      const cnpjHtml = cnpj
        ? `${esc(cnpj)} <button type="button" class="ficha-copiar" data-copiar="${esc(cnpjDig || cnpj)}">Copiar</button>`
        : (carregando ? "Carregando…" : "");
      const telHtml = telefones.map((t) => {
        const d = soDigitosFicha(t);
        return d.length >= 10 ? `<a href="https://wa.me/55${d}" target="_blank" rel="noopener" title="Abrir no WhatsApp">${esc(t)}</a>` : esc(t);
      }).join(", ");
      const emailHtml = emails.map((e) => `<a href="mailto:${esc(e)}">${esc(e)}</a>`).join(", ");

      let receitaHtml;
      if (carregando) receitaHtml = `<div class="ficha-aviso">Carregando dados do RD Station…</div>`;
      else if (cnpjDig.length === 14) receitaHtml = `<div class="ficha-aviso" id="ficha-receita">Consultando o CNPJ na Receita Federal…</div>`;
      else if (cnpj) receitaHtml = `<div class="ficha-aviso">O CNPJ informado no RD (${esc(cnpj)}) não tem 14 dígitos. Confira o cadastro.</div>`;
      else if (q.entrada === "Constituição") receitaHtml = `<div class="ficha-aviso">Empresa em constituição — o CNPJ ainda não existe ou não foi informado no RD.</div>`;
      else receitaHtml = `<div class="ficha-aviso">CNPJ não informado no RD Station. Preencha o campo "CNPJ" na negociação para ver os dados da Receita aqui.</div>`;

      const rdLink = det && det.rd_deal_id
        ? `<a href="https://crm.rdstation.com/app/deals/${encodeURIComponent(det.rd_deal_id)}" target="_blank" rel="noopener">Abrir negociação no RD Station ↗</a>`
        : `<span></span>`;

      dlg.innerHTML = `
        <div class="ficha-topo">
          <div class="ficha-avatar" aria-hidden="true">${esc(initials(titulo))}</div>
          <div class="ficha-titulo">
            <h2 id="ficha-cliente-titulo">${esc(titulo)}</h2>
            <p>${empresa && r.clientName !== empresa ? `Contato: ${esc(r.clientName)} · ` : ""}Vendedor: ${esc(r.sellerName || "—")}</p>
            <div class="ficha-selos">${selos}</div>
          </div>
          <button type="button" class="ficha-fechar" data-ficha-fechar aria-label="Fechar">×</button>
        </div>
        <div class="ficha-corpo">
          <section class="ficha-secao">
            <h3>Dados do cliente</h3>
            <div class="ficha-grade">
              ${fichaItem("Nome / contato", esc(contato.nome || r.clientName))}
              ${fichaItem("Empresa", esc(empresa))}
              ${fichaItem("CNPJ", cnpjHtml)}
              ${fichaItem("Cargo", esc(contato.cargo || ""))}
              ${fichaItem("Telefone", carregando ? "Carregando…" : telHtml)}
              ${fichaItem("E-mail", carregando ? "Carregando…" : emailHtml)}
            </div>
          </section>
          <section class="ficha-secao">
            <h3>Venda</h3>
            <div class="ficha-grade">
              ${fichaItem("Data da venda", r.enteredAt ? new Date(r.enteredAt).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "")}
              ${fichaItem("Valor total", brl(total))}
              ${fichaItem("Serviço contratado", esc(servico))}
              ${fichaItem("Campanha / origem", esc(origem))}
              ${fichaItem(linhas.length > 1 ? "Produtos" : "Produto / cobrança", produtos, { largo: true })}
              ${nivel ? fichaItem("Qualidade do cliente", `<b>${q.qualidade}</b> — ${esc(nivel.desc)}`, { largo: true }) : ""}
            </div>
          </section>
          <section class="ficha-secao">
            <h3>Receita Federal ${cnpjDig.length === 14 && !carregando ? "<small>fonte: BrasilAPI</small>" : ""}</h3>
            ${receitaHtml}
          </section>
        </div>
        <div class="ficha-rodape">${rdLink}<button type="button" data-ficha-fechar>Fechar</button></div>
      `;

      if (!carregando && cnpjDig.length === 14) {
        const dealId = dlg.dataset.deal;
        consultarCnpjFicha(cnpjDig).then((rf) => {
          const box = dlg.querySelector("#ficha-receita");
          if (!box || dlg.dataset.deal !== dealId) return;
          if (rf.erro) { box.textContent = rf.erro; return; }
          const ativa = /ativa/i.test(rf.situacao);
          const div = document.createElement("div");
          div.className = "ficha-grade";
          div.innerHTML = [
            fichaItem("Razão social", esc(rf.razao), { largo: true }),
            fichaItem("Nome fantasia", esc(rf.fantasia)),
            fichaItem("Situação cadastral", rf.situacao ? `<span class="${ativa ? "ficha-situacao-ativa" : "ficha-situacao-alerta"}">${esc(rf.situacao)}</span>` : ""),
            fichaItem("Abertura", esc(rf.abertura)),
            fichaItem("Cidade / UF", esc(rf.cidadeUf)),
            fichaItem("Porte", esc(rf.porte)),
            fichaItem("Regime", esc(rf.regime)),
            fichaItem("Natureza jurídica", esc(rf.natureza)),
            fichaItem("Sócios", rf.socios ? String(rf.socios) : ""),
            fichaItem("Atividade principal (CNAE)", esc(rf.cnae), { largo: true }),
          ].join("");
          box.replaceWith(div);
        });
      }
    }

    // Um único ouvinte na página: a tabela é redesenhada a cada filtro.
    function linhaDaFicha(e) {
      const tr = e.target.closest("#client-entries tr[data-deal]");
      return tr && tr.dataset.deal ? tr : null;
    }
    document.addEventListener("click", (e) => {
      const tr = linhaDaFicha(e);
      if (tr && !e.target.closest("a, button")) abrirFichaCliente(tr.dataset.deal);
    });
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Enter" && e.key !== " ") return;
      const tr = linhaDaFicha(e);
      if (tr && e.target === tr) { e.preventDefault(); abrirFichaCliente(tr.dataset.deal); }
    });
    function renderClientEntries(store, range, sellerId) {
      const rows = getClientEntries(store, { range, sellerId });
      const chave = `${range.start?.getTime?.()}|${range.end?.getTime?.()}|${sellerId || ""}`;
      if (chave !== clientChave) { clientChave = chave; clientLimite = 20; }
      const visiveis = rows.slice(0, clientLimite);
      clientLinhasAtuais = rows;
      const faltamCampos = visiveis.some((r) => r.dealId && !camposRd.has(r.dealId));
      // Um cliente com produto mensal + único vira 2 linhas (uma por produto),
      // mas continua sendo UM cliente / UMA venda.
      const nClientes = new Set(rows.map((r) => r.saleId)).size;
      const wrap = document.getElementById("client-entries");
      if (!wrap) return;
      wrap.innerHTML = `
        <div class="section-head client-entries-head">
          <div>
            <h2>Clientes das vendas realizadas no período</h2>
            <p>Somente clientes com venda efetivamente registrada no período selecionado.</p>
          </div>
          <span class="client-count-pill">${nClientes} cliente${nClientes === 1 ? "" : "s"}${rows.length !== nClientes ? ` · ${rows.length} produtos` : ""}</span>
        </div>
        <div class="table-scroll client-table-wrap">
          <table class="client-entries-table">
            <thead>
              <tr class="colunas"><th>Cliente</th><th>Data da venda</th><th class="col-valor">Valor / status</th><th class="col-tipo">Tipo</th><th>Campanha / origem</th><th class="q-col q-first">Conta Azul</th><th class="q-col">Constituição / Troca</th><th class="q-col">Qualidade</th></tr>
            </thead>
            <tbody>
              ${rows.length ? visiveis.map((r) => `
                <tr data-deal="${esc(r.dealId || "")}"${r.dealId ? ` tabindex="0" title="Ver ficha de ${esc(r.clientName)}" aria-label="Abrir ficha de ${esc(r.clientName)}"` : ""}>
                  <td><div class="client-cell"><span class="client-avatar">${esc(initials(r.clientName))}</span><div><div class="client-primary" title="${esc(r.clientName)}">${esc(r.clientName)}</div><div class="client-secondary">${esc(r.companyName)}</div></div></div></td>
                  <td class="col-data">${formatDateTimePt(r.enteredAt)}</td>
                  <td class="client-value"><div>${brl(r.value)}</div><div class="client-status-mini">${clientStatusBadge(r.status)}</div></td>
                  <td class="col-tipo">${tipoVendaHtml(r)}</td>
                  <td class="col-campanha" title="${esc(r.campaign)}">${esc(r.campaign)}</td>
                  ${qualifCelulas(r.dealId)}
                </tr>`).join("") : `<tr><td colspan="8" class="text-empty">Nenhuma venda registrada no período selecionado.</td></tr>`}
            </tbody>
          </table>
        </div>
        <div class="q-legenda"><span>Qualidade do cliente:</span><span><b class="q-badge q-a">A</b>${esc(QUALIF_NIVEIS.A.desc)}</span><span><b class="q-badge q-b">B</b>${esc(QUALIF_NIVEIS.B.desc)}</span><span><b class="q-badge q-c">C</b>${esc(QUALIF_NIVEIS.C.desc)}</span></div>
        ${rows.length > visiveis.length ? `<div class="client-mais"><button type="button" class="client-mais-btn" id="client-mais">Mostrar mais ${Math.min(20, rows.length - visiveis.length)}</button><span>Exibindo ${visiveis.length} de ${rows.length}</span></div>` : ""}
      `;
      const mais = document.getElementById("client-mais");
      if (mais) mais.addEventListener("click", () => { clientLimite += 20; renderClientEntries(store, range, sellerId); });
      if (faltamCampos) carregarCamposRd(visiveis.map((r) => r.dealId)).then(() => { const atual = document.getElementById("client-entries"); if (atual) preencherQualif(atual); }).catch((e) => console.warn("Campos do RD indisponíveis:", e.message));
    }

    function render() {
      const { period, sellerId } = currentPeriodFromUrl("this_week");
      const vendedores = store.sellers
        .filter((s) => /^(Uriel Coelho|Gabriel Balbino Soares de Souza)$/i.test(s.name))
        .sort((a, b) => {
          const ordem = { "Uriel Coelho": 0, "Gabriel Balbino Soares de Souza": 1 };
          return (ordem[a.name] ?? 99) - (ordem[b.name] ?? 99);
        });
      const allowedSellerId = sellerId && vendedores.some((s) => s.id === sellerId) ? sellerId : undefined;
      const range = resolvePeriod(period);
      const prevRange = previousRange(range);

      const kpis = getKpis(store, { range, sellerId: allowedSellerId });
      const prevKpis = getKpis(store, { range: prevRange, sellerId: allowedSellerId });

      // Cartão "Ligações de agendamento" removido da Visão geral (pedido do
      // usuário, 04/11/2026) — os números continuam na tela de Ligações.
      // LEADS QUE CHEGARAM (04/11/2026): negociações criadas no RD dentro do
      // período e do vendedor filtrados (deals.created_at = data de criação no RD).
      const leads = getLeads(store, { range, sellerId: allowedSellerId });
      // Chegadas por campanha do RD (deals.campaign), da que trouxe mais leads
      // para a que trouxe menos. Vazio e "Sem Campanha" contam juntos.
      const leadsPorCampanha = (() => {
        const m = new Map();
        for (const d of store.deals || []) {
          if (!d.created_at || !inRange(d.created_at, range)) continue;
          if (allowedSellerId && d.seller_id !== allowedSellerId) continue;
          const c = (d.campaign || "").trim();
          const nome = !c || /^sem campanha$/i.test(c) ? "Sem campanha" : c;
          m.set(nome, (m.get(nome) || 0) + 1);
        }
        return [...m.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], "pt-BR"));
      })();
      // Uma linha por campanha não coube bem no cartão: mostra a MELHOR campanha
      // (a que mais trouxe leads; "Sem campanha" só se não houver outra).
      const melhorCampanha = leadsPorCampanha.find(([nome]) => nome !== "Sem campanha") || leadsPorCampanha[0];
      const leadsSub = melhorCampanha
        ? ["Melhor campanha", melhorCampanha[0], `${melhorCampanha[1]} lead${melhorCampanha[1] === 1 ? "" : "s"} · ${Math.round((melhorCampanha[1] / Math.max(1, leads.chegaram)) * 100)}% do total`]
        : ["Nenhum lead no período"];
      const perf = performanceLabel(kpis);

      const content = document.getElementById("content");
      content.className = "space-y";
      content.innerHTML = `
        <div class="row-between">
          <div>
            <h1 class="page-title">Visão geral</h1>
            <p class="page-sub">Acompanhe seus indicadores e desempenho comercial em tempo real.</p>
          </div>
          <div class="header-actions">
            <button type="button" class="icon-btn" aria-label="Notificações">${ICONS.bell}<span class="dot"></span></button>
            <button type="button" class="icon-btn" aria-label="Calendário">${ICONS.meeting}</button>
          </div>
        </div>

        <div id="period-filter"></div>

        <div class="card card-p perf-banner ${perf.tone}">
          <div class="perf-icon">${ICONS.sales}</div>
          <div class="perf-text">
            <p class="perf-label-small">Performance Comercial do período</p>
            <p class="perf-label-big">${perf.label} <span aria-hidden="true">✨</span></p>
          </div>
          <p class="perf-desc">Calculado a partir da taxa de realização de reuniões e do volume de vendas fechadas no período selecionado.</p>
          <div class="perf-illustration">${ICONS.rocket}</div>
        </div>

        <div id="kpi-grid"></div>

        <div class="vendas-duo"></div>
      `;

      const clientEntriesHost = document.createElement("div");
      clientEntriesHost.id = "client-entries";
      clientEntriesHost.className = "card card-p client-entries-card";
      // O card grande "Valor total de vendas" virou o 1º cartão do topo (04/11/2026).
      const vendasDuo = content.querySelector(".vendas-duo");
      // Resumo financeiro (09/10/2026): vendas únicas, recorrentes e total,
      // logo abaixo do valor total — mesma fonte (tabela sales) e mesmo filtro.
      const vendasColuna = document.createElement("div");
      vendasColuna.className = "vendas-coluna";
      const resumoCard = document.createElement("div");
      resumoCard.id = "resumo-financeiro";
      resumoCard.className = "card card-p resumo-financeiro-card";
      resumoCard.innerHTML = resumoFinanceiroHtml(getSalesSplit(store, { range, sellerId: allowedSellerId }));
      vendasColuna.appendChild(resumoCard);
      vendasDuo.appendChild(vendasColuna);
      vendasDuo.appendChild(clientEntriesHost);

      renderPeriodFilter(document.getElementById("period-filter"), vendedores, render, { defaultPeriod: "this_week", defaultSellerId: allowedSellerId || "" });
      setupCalendarPicker(render);

      // Cartões do topo (04/11/2026): vendas primeiro, no mesmo formato dos
      // outros; saíram "Ligações de agendamento" e "Valor em oportunidades abertas".
      renderKpiGrid(document.getElementById("kpi-grid"), [
        { label: "Vendas realizadas", value: kpis.revenue, format: "currency", sub: `${kpis.salesCount} venda${kpis.salesCount === 1 ? "" : "s"} no período`, change: pctChange(kpis.revenue, prevKpis.revenue), tone: "green", icon: ICONS.dollarSign },
        { label: "Reuniões agendadas × realizadas", value: kpis.meetingsScheduled, sub: [`Realizadas: ${kpis.meetingsDone}`, `Taxa de realização: ${(kpis.meetingRealizationRate ?? 0).toFixed(0)}%`], change: pctChange(kpis.meetingsScheduled, prevKpis.meetingsScheduled), tone: "indigo", icon: ICONS.meeting },
        { label: "No Show", value: kpis.meetingsNoShow, change: pctChange(kpis.meetingsNoShow, prevKpis.meetingsNoShow ?? 0), tone: "red", icon: ICONS.xCircle },
        // Reunião de proposta + Follow-up + Prováveis fechamentos num cartão só (pedido do usuário, 25/09/2026).
        { label: "Oportunidades em acompanhamento", value: kpis.reuniaoPropostaCount + kpis.followUpCount + kpis.probableClosures, sub: [brl(kpis.opportunitiesValue), `Proposta ${kpis.reuniaoPropostaCount} · Follow-up ${kpis.followUpCount} · Fechamento ${kpis.probableClosures}`], tone: "violet", icon: ICONS.handshake },
        // "Leads que chegaram" no lugar de "Clientes que entraram" (04/11/2026): segue os filtros de período e vendedor.
        { label: "Leads que chegaram", value: leads.chegaram, sub: leadsSub, tone: "indigo", icon: ICONS.users },
      ], true);

      renderClientEntries(store, range, allowedSellerId);

    }

    // Mesma janela larga usada na tela de Ligações: os lançamentos são poucos
    // (uma linha por vendedor por dia) e assim não há uma ida ao banco por
    // período comparado.
    const JANELA_LANCAMENTOS = () => {
      const hoje = new Date();
      return { start: new Date(hoje.getFullYear() - 1, 0, 1), end: new Date(hoje.getFullYear() + 1, 0, 1) };
    };

    (async () => {
      try {
        // VELOCIDADE: a busca dos dados COMEÇA JÁ, sem esperar o perfil.
        // Antes era uma fila: perguntava quem é o usuário, esperava a resposta
        // do servidor, e só então começava a carregar os dados — uma ida e
        // volta inteira (~250 ms) parada no caminho. As duas coisas não
        // dependem uma da outra, então agora andam juntas.
        const dados = loadAllInstantaneo((novo) => {
          store = novo;
          render();
        }).catch((e) => e); // guardado para ser relançado depois do login

        const auth = await requireAuth();
        if (!auth) return; // sem sessão: já foi redirecionado para o login
        renderShell(auth.profile);

        const resultado = await dados;
        if (resultado instanceof Error) throw resultado;
        store = resultado;
        render();
        // Sincroniza com RD/Agenda ao abrir a página (não trava a tela: os
        // dados atuais já apareceram acima e a tela se atualiza sozinha
        // quando a sincronização terminar).
        startPageLoadSync(async () => {
          store = await loadAll({ fresh: true });
          render();
        });
      } catch (err) {
        console.error(err);
        showFatalError(err);
      }
    })();
  </script>
</body>
</html>
