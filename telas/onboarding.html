// Regime tributário pela Receita (28/09/2026): Simples/MEI com datas e, fora do Simples,
// a forma de tributação declarada (Lucro Presumido / Real / Arbitrado), comparando com o RD.
const tituloCaso=t=>String(t||'').toLowerCase().replace(/(^|\s)\S/g,m=>m.toUpperCase()).replace(/\bDe\b/g,'de');
function regimeDaReceita(r){
  const ultimo=(r.regimes||[]).slice(-1)[0];
  if(r.optMei===true) return {texto:'MEI (Simples Nacional)', chave:'simples'};
  if(r.optSimples===true) return {texto:'Simples Nacional', chave:'simples'};
  if(ultimo) return {texto:tituloCaso(ultimo.forma)+' ('+ultimo.ano+')', chave:/presumido/i.test(ultimo.forma)?'presumido':/real/i.test(ultimo.forma)?'real':'outro'};
  if(r.optSimples===false) return {texto:'Não optante pelo Simples — Lucro Presumido ou Real (a Receita não informou qual)', chave:'fora'};
  return {texto:'Não informado pela Receita', chave:''};
}
function linhaSimples(opt,desde,excl){
  if(opt===true) return 'Sim'+(desde?', desde '+dataIsoBr(desde):'');
  if(excl) return 'Não — excluído em '+dataIsoBr(excl)+(desde?' (optou em '+dataIsoBr(desde)+')':'');
  if(opt===false) return 'Não';
  return '—';
}
function confereComRd(rdValor, reg){
  const v=String(rdValor||'').toLowerCase(); if(!v) return 'Tributação não informada no RD';
  const rdChave=/simples|mei/.test(v)?'simples':/presumido/.test(v)?'presumido':/real/.test(v)?'real':'';
  if(!rdChave||!reg.chave) return 'No RD: '+rdValor;
  const bate = rdChave===reg.chave || (reg.chave==='fora' && rdChave!=='simples');
  return bate ? 'Confere (RD: '+rdValor+')' : '⚠ Diferente — no RD está "'+rdValor+'", na Receita: '+reg.texto;
}

// Atividades secundárias (05/10/2026): ocupam a linha inteira, uma por linha, e com muitas
// atividades mostram só as primeiras e um "Ver todas" — antes esticavam os quadros vizinhos.
function secundariasHtml(lista){
  const LIM=4;
  if(!lista.length) return `<div class="info cnae-sec"><div class="info-label">Atividades secundárias</div><div class="info-value soft">Nenhuma</div></div>`;
  const item=(t,i)=>{ const m=String(t).match(/^(\S+)\s+—\s+(.*)$/); return `<li${i>=LIM?' class="cnae-extra" hidden':''}>${m?`<span class="cnae-cod">${esc(m[1])}</span><span>${esc(m[2])}</span>`:`<span>${esc(t)}</span>`}</li>`; };
  const botao=lista.length>LIM?`<button type="button" class="cnae-mais" data-cnae-mais data-total="${lista.length}">Ver todas (${lista.length})</button>`:'';
  return `<div class="info cnae-sec"><div class="info-label">Atividades secundárias · ${lista.length}</div><ul class="cnae-lista">${lista.map(item).join('')}</ul>${botao}</div>`;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-cnae-mais]'); if(!b) return;
  e.stopPropagation();
  const box=b.closest('.cnae-sec'); const abrir=b.dataset.aberto!=='1';
  box.querySelectorAll('.cnae-extra').forEach(li=>li.hidden=!abrir);
  b.dataset.aberto=abrir?'1':''; b.textContent=abrir?'Mostrar menos':`Ver todas (${b.dataset.total})`;
});
async function consultarCnpj(s){
  if(processoDaVenda(s)==='constituicao') return; // Constituição: sem consulta automática
  const el=document.getElementById('cnpjInfo'); const d=soDigitos(s.cnpj);
  if(d.length!==14){ el.innerHTML='<div class="cnpj-status">CNPJ não informado no RD. Quando o campo CNPJ da negociação for preenchido no RD, endereço, CEP, sócios e demais dados da Receita aparecem aqui automaticamente.</div>'; return; }
  if(!tentativasCnpj.has(d)) el.innerHTML='<div class="cnpj-status">Consultando o CNPJ '+esc(formatarCnpj(d))+'…</div>'; // nova tentativa: mantém o que já aparece
  const r=await buscarCnpj(d);
  if(selectedId!==s.id) return;
  if(r.erro){ el.innerHTML='<div class="cnpj-status">'+esc(r.erro)+'</div>'; return; }
  const linhas=[['CNPJ',formatarCnpj(d)],['Razão social',r.razao],['Nome fantasia',r.fantasia],['Situação cadastral',r.situacao],['Abertura',r.abertura],['Natureza jurídica',r.natureza],['Porte',r.porte],['Regime tributário (Receita)',regimeDaReceita(r).texto],['Optante pelo Simples Nacional',linhaSimples(r.optSimples,r.dataSimples,r.exclusaoSimples)],['MEI',linhaSimples(r.optMei,r.dataMei,r.exclusaoMei)],['Atividade principal (CNAE)',r.cnae],['Capital social',r.capital],['Endereço',r.endereco],['CEP',r.cep],['Cidade/UF',r.cidadeUf],['Telefone',r.telefone],['Endereço eletrônico (Receita)',r.email],['E-mail informado no RD',emailsDoRd(s.rd)||'Não informado no RD']];
  // Faltou e-mail/telefone/endereço porque o CNPJ.ws não respondeu (limite por minuto): tenta de novo sozinho.
  const n=tentativasCnpj.get(d)||0;
  let aviso='';
  if(r.parcial && n<4){
    tentativasCnpj.set(d,n+1);
    aviso=`<div class="cnpj-status">E-mail, telefone e endereço completo ainda não vieram: a BrasilAPI não mostra esses dados de MEI e o CNPJ.ws está ocupado. Tentando de novo em 20 s…</div>`;
    setTimeout(()=>{ if(selectedId===s.id) consultarCnpj(s); }, 20000);
  } else if(r.parcial) aviso=`<div class="cnpj-status">O CNPJ.ws não respondeu; e-mail, telefone e endereço completo podem estar faltando. Feche e abra o card de novo em alguns minutos.</div>`;
  else tentativasCnpj.delete(d);
  el.innerHTML=linhas.map(([k,v])=>infoHtml(k,v||'—')).join('')+secundariasHtml(r.secundarias||[])+`<div class="cnpj-status">Fonte: ${esc(r.fonte)}.</div>`+aviso;
  renderSocios(s,r);
  if(false){
    document.getElementById('partnersSection').hidden=false;
    document.getElementById('partners').innerHTML=r.socios.map(p=>`<div class="partner"><div class="partner-top"><div class="partner-name">${esc(p.nome)}</div><div class="partner-share">${esc(p.qualificacao||'')}</div></div><div class="partner-grid"><div><div class="mini-label">Entrada na sociedade</div><div class="mini-value">${esc(p.entrada||'—')}</div></div><div><div class="mini-label">Fonte</div><div class="mini-value">Receita Federal</div></div></div></div>`).join('');
  }
  if((s.capital||'Não informado')==='Não informado' && r.capital && r.capital!=='—'){
    const cap=document.querySelector('#capital .info .info-value'); if(cap) cap.textContent=r.capital;
  }
}

    document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('onboardingAlert').classList.contains('open'))closeOnboardingAlert(); else if(document.getElementById('saleModal').classList.contains('open'))closeSaleModal(); else if(document.getElementById('detailScreen').classList.contains('open'))closeDetail();}});
    document.getElementById('saleForm').addEventListener('submit',e=>{
      e.preventDefault();
      registerSale({
        client:document.getElementById('saleClient').value.trim(),
        service:document.getElementById('saleService').value,
        amount:document.getElementById('saleAmount').value,
        date:document.getElementById('saleDate').value,
        status:document.getElementById('saleStatus').value,
        closer:document.getElementById('saleCloser').value.trim() || 'Marlon'
      });
    });
    
    function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.classList.remove('show'),2600)}
    renderSales();
    migrarOnboardingAntigo().catch(e=>console.warn(e));
    // A sincronização em segundo plano redesenha a tela: se um card estava aberto, ele continua aberto.
    if (window.__onbAberto) { const aberto = sales.find((x) => (x.key || String(x.id)) === window.__onbAberto); if (aberto) openSale(aberto.id); }
      
      document.getElementById('mockRefresh').onclick = recarregar;
    }

    
// Filtro por período no calendário do topo (28/09/2026): usa a data da venda.
function periodoOnboarding(){
  const per=new URLSearchParams(location.search).get('period'); if(!per) return null;
  try{ const r=resolvePeriod(per); return r&&r.start&&r.end?r:null; }catch(e){ return null; }
}
function dataBrParaDate(br){ const [d,m,y]=String(br||'').split('/').map(Number); return d&&m&&y?new Date(y,m-1,d):null; }
function ligarCalendarioOnboarding(root){
  const cal=root.querySelector('.onb-cal'); if(cal && typeof ICONS!=='undefined') cal.innerHTML=ICONS.meeting;
  setupCalendarPicker(()=>montar());
  const chip=root.querySelector('#onbPeriodo'); const per=periodoOnboarding(); if(!chip) return;
  if(per){ const fim=new Date(per.end.getTime()-1); chip.hidden=false; chip.innerHTML='Vendas de '+dataBrOnb(per.start)+' a '+dataBrOnb(fim)+' <b aria-hidden="true">×</b>'; chip.onclick=()=>{ history.replaceState(null,'',location.pathname); montar(); }; }
  else chip.hidden=true;
}

let detalhesRd = new Map();
// A cada minuto relê os detalhes do RD (ex.: "Serviço contratado") e redesenha
// o board se algo mudou — sem precisar recarregar a página (28/09/2026).
async function atualizarOnboardingRemoto() {
  try {
    if (!store || document.hidden || etapasPendentes.size) return;
    if (document.querySelector('.alerta-input') || document.querySelector('#anexoJanela.open') || document.querySelector('#onboardingAlert.open') || document.querySelector('#saleModal.open')) return;
    const novo = await carregarDetalhesRd(store);
    if (etapasPendentes.size) return; // alguém salvou enquanto a leitura estava a caminho
    // Inclui as etapas (atualizado_em): mudanças de outros usuários aparecem sem recarregar.
    const assinatura = (m) => JSON.stringify([...m.entries()].map(([k, v]) => [k, v.campos, v.produtos, v.__nota && v.__nota.alerta, v.__etapas && v.__etapas.atualizado_em]));
    if (assinatura(novo) !== assinatura(detalhesRd)) { detalhesRd = novo; montar(); }
  } catch (e) { console.warn(e); }
}
window.__onbAtualizarRemoto = atualizarOnboardingRemoto; // usado pelo teste
setInterval(atualizarOnboardingRemoto, 60000);
function montar() {
      const content = document.getElementById("content");
      content.className = "";
      content.innerHTML = "";
      const root = document.createElement("div");
      root.className = "onb";
      root.appendChild(document.getElementById("onb-template").content.cloneNode(true));
      content.appendChild(root);
      iniciarOnboarding(root, clientesDasVendas(store, detalhesRd), async () => {
        try { store = await loadAll({ fresh: true }); try { detalhesRd = await carregarDetalhesRd(store); } catch (e) {} montar(); } catch (e) { console.error(e); }
      });
  ligarCalendarioOnboarding(root);
    }

    (async () => {
      try {
        const dados = loadAllInstantaneo((novo) => { store = novo; montar(); }).catch((e) => e);
        const auth = await requireAuth();
        if (!auth) return;
        renderShell(auth.profile);
        const resultado = await dados;
        if (resultado instanceof Error) throw resultado;
        store = resultado;
        montar();
        try { detalhesRd = await carregarDetalhesRd(store); montar(); } catch (e) { console.warn(e); }
        startPageLoadSync(async () => { store = await loadAll({ fresh: true }); try { detalhesRd = await carregarDetalhesRd(store); } catch (e) {} montar(); });
      } catch (err) {
        console.error(err);
        showFatalError(err);
      }
    })();
  </script>
