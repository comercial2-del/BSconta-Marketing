<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BSconta + Marketing — Onboarding</title>

  <style>
/* ===== Tela Onboarding — visual do preview "Onboarding" aprovado pelo usuário.
   Todo o CSS fica preso dentro de .onb para não mexer no resto do sistema. ===== */
.onb{color:var(--text)}
.onb button,.onb input,.onb select,.onb textarea{font:inherit}
.onb button{cursor:pointer}
.onb a{color:inherit;text-decoration:none}
.onb .page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1.05rem}
.onb .eyebrow{display:flex;align-items:center;gap:.45rem;font-size:.71rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--indigo-600);margin-bottom:.25rem}
.onb .page-title{font-size:1.58rem;line-height:1.15;font-weight:800;letter-spacing:-.025em;margin:0}
.onb .page-sub{font-size:.88rem;color:var(--text-faint);margin:.28rem 0 0}
.onb .head-actions{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap}
.onb .ghost-btn,.onb .primary-btn{border-radius:10px;padding:.67rem .85rem;border:1px solid var(--border);font-size:.82rem;font-weight:700;background:var(--surface);color:var(--text-soft);display:inline-flex;align-items:center;gap:.45rem;box-shadow:var(--shadow-sm)}
.onb .ghost-btn:hover{background:var(--surface-2);color:var(--text)}
.onb .primary-btn{background:var(--indigo-600);color:#fff;border-color:var(--indigo-600);box-shadow:0 7px 16px rgba(79,70,229,.14)}
.onb .primary-btn:hover{background:var(--indigo-700)}
.onb .ghost-btn svg,.onb .primary-btn svg{width:16px;height:16px}
.onb .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.onb .field{position:relative}
.onb .field input,.onb .field select{width:100%;height:38px;border:1px solid var(--border);border-radius:9px;background:var(--surface);padding:0 .72rem;font-size:.78rem;color:var(--text-soft);outline:none}
.onb .field input:focus,.onb .field select:focus{border-color:var(--indigo-500);box-shadow:0 0 0 3px rgba(99,102,241,.08)}
.onb .field.search:before{content:"⌕";position:absolute;left:.72rem;top:50%;transform:translateY(-52%);font-size:1.05rem;color:var(--text-faint);pointer-events:none}
.onb .field.search input{padding-left:2rem}
.onb table{width:100%;border-collapse:collapse;font-size:.78rem}
.onb th{font-size:.65rem;text-transform:uppercase;letter-spacing:.045em;color:var(--text-faint);font-weight:800;text-align:left;padding:.72rem 1rem;border-bottom:1px solid var(--border);white-space:nowrap}
.onb td{padding:.68rem 1rem;border-bottom:1px solid var(--surface-2);vertical-align:middle}
.onb tbody tr{cursor:pointer;transition:background .12s}
.onb tbody tr:hover{background:#fafafe}
.onb tbody tr.selected{background:linear-gradient(90deg,#f5f6ff,#fff)}
.onb tbody tr.selected td:first-child{box-shadow:inset 3px 0 0 var(--indigo-500)}
.onb .amount{font-weight:800;color:var(--text)}
.onb .badges{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap}
.onb .badge{display:inline-flex;align-items:center;border-radius:999px;padding:.24rem .52rem;font-size:.66rem;font-weight:800;white-space:nowrap}
.onb .b-indigo{background:var(--indigo-100);color:var(--indigo-700)}
.onb .b-green{background:var(--emerald-100);color:var(--emerald-700)}
.onb .b-amber{background:var(--amber-100);color:var(--amber-700)}
.onb .b-red{background:var(--red-100);color:var(--red-700)}
.onb .b-neutral{background:#f2f3f7;color:var(--text-soft)}
.onb .priority{display:inline-flex;align-items:center;gap:.3rem;font-size:.67rem;font-weight:800}
.onb .priority i{width:7px;height:7px;border-radius:50%;display:inline-block;background:#a1a1aa}
.onb .priority.normal i{background:#94a3b8}
.onb .priority.alta i{background:var(--amber-500)}
.onb .priority.urgente i{background:var(--red-500)}
.onb .detail-client{display:flex;gap:.75rem;align-items:center}
.onb .detail-avatar{width:44px;height:44px;border-radius:13px;background:var(--indigo-50);color:var(--indigo-700);display:grid;place-items:center;font-size:.78rem;font-weight:800}
.onb .detail-sub{font-size:.72rem;color:var(--text-faint);margin:.18rem 0 0}
.onb .detail-progress{height:6px;background:#f0f1f6;border-radius:999px;overflow:hidden;margin-top:.78rem}
.onb .detail-progress span{display:block;height:100%;background:linear-gradient(90deg,var(--indigo-500),var(--indigo-700));border-radius:999px;width:42%}
.onb .section{margin-bottom:1rem}
.onb .section:last-child{margin-bottom:0}
.onb .section-title{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-bottom:.55rem}
.onb .section-title h3{font-size:.76rem;text-transform:uppercase;letter-spacing:.055em;color:var(--text-soft);margin:0;font-weight:800}
.onb .section-title span{font-size:.65rem;color:var(--text-faint)}
.onb .info{background:var(--surface-2);border:1px solid #eef0f5;border-radius:10px;padding:.62rem .68rem;min-width:0}
.onb .info-label{font-size:.62rem;text-transform:uppercase;letter-spacing:.04em;color:var(--text-faint);font-weight:800}
.onb .info-value{font-size:.74rem;color:var(--text);font-weight:700;margin-top:.19rem;overflow-wrap:anywhere}
.onb .info-value.soft{font-weight:600;color:var(--text-soft)}
.onb .highlight{border:1px solid var(--indigo-100);background:linear-gradient(180deg,#fafaff,#f6f7ff);padding:.75rem;border-radius:11px}
.onb .highlight + .highlight{margin-top:.5rem}
.onb .highlight-label{font-size:.63rem;text-transform:uppercase;letter-spacing:.05em;color:var(--indigo-600);font-weight:800}
.onb .highlight-text{margin:.25rem 0 0;font-size:.77rem;line-height:1.45;font-weight:650}
.onb .meeting-note{background:#fbfcff;border:1px dashed #dfe2f1;border-radius:11px;padding:.72rem;font-size:.73rem;line-height:1.5;color:var(--text-soft)}
.onb .alerts{border:1px solid var(--amber-100);background:linear-gradient(180deg,#fffdf5,#fffbeb);border-radius:11px;padding:.74rem}
.onb .alert-row{display:flex;align-items:flex-start;gap:.55rem;padding:.28rem 0;font-size:.72rem;color:#7a5810}
.onb .alert-dot{width:7px;height:7px;border-radius:50%;background:var(--amber-500);margin-top:.32rem;flex:0 0 auto}
.onb .docs{display:grid;gap:.42rem}
.onb .doc-row{display:flex;align-items:center;justify-content:space-between;gap:.6rem;border:1px solid #eef0f5;border-radius:9px;padding:.55rem .62rem}
.onb .doc-left{display:flex;align-items:center;gap:.55rem;min-width:0}
.onb .doc-icon{width:29px;height:29px;border-radius:8px;background:#f2f3f8;display:grid;place-items:center;font-size:.67rem;color:var(--text-soft)}
.onb .doc-name{font-size:.7rem;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.onb .doc-status{font-size:.61rem;font-weight:800;border-radius:999px;padding:.2rem .45rem;white-space:nowrap}
.onb .doc-ok{background:var(--emerald-100);color:var(--emerald-700)}
.onb .doc-pending{background:var(--amber-100);color:var(--amber-700)}
.onb .doc-review{background:var(--indigo-100);color:var(--indigo-700)}
.onb .partners{display:grid;gap:.5rem}
.onb .partner{border:1px solid #eef0f5;border-radius:11px;padding:.7rem}
.onb .partner-top{display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.onb .partner-name{font-size:.74rem;font-weight:800}
.onb .partner-share{font-size:.68rem;font-weight:800;color:var(--indigo-700);background:var(--indigo-50);border-radius:999px;padding:.2rem .45rem}
.onb .partner-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.4rem .8rem;margin-top:.55rem}
.onb .mini-label{font-size:.58rem;color:var(--text-faint);text-transform:uppercase;font-weight:800;letter-spacing:.03em}
.onb .mini-value{font-size:.69rem;color:var(--text-soft);font-weight:650;margin-top:.08rem;overflow-wrap:anywhere}
.onb .capital{display:grid;grid-template-columns:1fr 1.2fr;gap:.55rem}
.onb .notes{border:1px solid #eef0f5;border-radius:11px;padding:.75rem;background:#fcfcfe;font-size:.72rem;line-height:1.55;color:var(--text-soft);min-height:92px}
.onb .preview-pill{display:inline-flex;align-items:center;gap:.35rem;font-size:.64rem;font-weight:800;color:var(--text-faint);background:#f2f3f7;border-radius:999px;padding:.22rem .5rem}
.onb .preview-pill:before{content:"";width:6px;height:6px;background:#a1a1aa;border-radius:50%}
.onb .empty-row{padding:1.3rem;text-align:center;color:var(--text-faint);font-size:.8rem}
.onb .toast{position:fixed;right:18px;bottom:18px;background:#18192d;color:white;padding:.68rem .85rem;border-radius:10px;font-size:.75rem;font-weight:700;box-shadow:var(--shadow-lg);opacity:0;transform:translateY(12px);pointer-events:none;transition:.2s;z-index:80}
.onb .toast.show{opacity:1;transform:translateY(0)}
@media(max-width:860px){
.onb .page-title{font-size:1.35rem}
.onb .head-actions{width:100%}
.onb .head-actions>*{flex:1;justify-content:center}
}
@media(max-width:520px){
.onb .page-head{align-items:flex-start}
.onb .head-actions{display:grid;grid-template-columns:1fr 1fr}
.onb .field input,.onb .field select{height:42px}
.onb .partner-grid{grid-template-columns:1fr 1fr}
.onb .capital{grid-template-columns:1fr}
.onb th,.onb td{padding-left:.75rem;padding-right:.75rem}
}
.onb /* ===== Central de Vendas por Cards ===== */
    .sales-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap);margin-bottom:1rem}
.onb .sales-kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.05rem;box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:.8rem}
.onb .sales-kpi-icon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto}
.onb .sales-kpi-icon svg{width:20px;height:20px}
.onb .sales-kpi-icon.indigo{background:var(--indigo-50);color:var(--indigo-700)}
.onb .sales-kpi-icon.green{background:var(--emerald-50);color:var(--emerald-700)}
.onb .sales-kpi-icon.amber{background:var(--amber-50);color:var(--amber-700)}
.onb .sales-kpi-icon.violet{background:var(--violet-50);color:var(--violet-600)}
.onb .sales-kpi-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.055em;font-weight:800;color:var(--text-faint)}
.onb .sales-kpi-value{font-size:1.38rem;font-weight:850;letter-spacing:-.03em;margin:.16rem 0 0}
.onb .sales-kpi-foot{font-size:.68rem;color:var(--text-faint);margin-top:.12rem}
.onb .sales-board{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);overflow:hidden}
.onb .sales-board-head{padding:1rem 1.1rem .85rem;display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;border-bottom:1px solid var(--surface-2)}
.onb .sales-kicker{font-size:.66rem;text-transform:uppercase;letter-spacing:.075em;color:var(--indigo-600);font-weight:850;margin-bottom:.18rem}
.onb .sales-board-head h2{font-size:1rem;margin:0;font-weight:850}
.onb .sales-board-head p{font-size:.74rem;color:var(--text-faint);margin:.2rem 0 0}
.onb .sales-filters{padding:.75rem 1.1rem;display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr;gap:.55rem;border-bottom:1px solid var(--surface-2)}
.onb .sales-filters .field input,.onb .sales-filters .field select{height:40px}
.onb .sales-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.9rem;padding:1rem 1.1rem 1.15rem}
.onb .sale-card{position:relative;background:linear-gradient(180deg,#fff,#fcfcff);border:1px solid var(--border);border-radius:14px;padding:.95rem;box-shadow:0 2px 7px rgba(15,23,42,.035);cursor:pointer;transition:transform .14s,box-shadow .14s,border-color .14s}
.onb .sale-card:hover{transform:translateY(-2px);box-shadow:0 11px 24px rgba(15,23,42,.08);border-color:var(--indigo-100)}
.onb .sale-card:focus{outline:none;box-shadow:0 0 0 3px rgba(99,102,241,.12),0 10px 22px rgba(15,23,42,.07)}
.onb .sale-card-top,.onb .sale-card-bottom{display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.onb .sale-card-top{margin-bottom:.8rem}
.onb .sale-id{font-size:.61rem;color:var(--text-faint);font-weight:850;letter-spacing:.05em}
.onb .sale-date{font-size:.62rem;color:var(--text-faint);font-weight:700}
.onb .sale-client-row{display:flex;align-items:center;gap:.68rem}
.onb .sale-client-avatar{width:40px;height:40px;border-radius:11px;background:var(--indigo-50);color:var(--indigo-700);display:grid;place-items:center;font-size:.72rem;font-weight:850;flex:0 0 auto}
.onb .sale-client-name{font-size:.82rem;font-weight:850;line-height:1.25}
.onb .sale-client-meta{font-size:.64rem;color:var(--text-faint);margin-top:.15rem}
.onb .sale-service{margin:.78rem 0;background:var(--surface-2);border:1px solid #eef0f5;border-radius:10px;padding:.62rem .68rem}
.onb .sale-service-label{font-size:.58rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);font-weight:850}
.onb .sale-service-value{font-size:.76rem;font-weight:800;margin-top:.16rem}
.onb .sale-card-bottom{border-top:1px solid var(--surface-2);padding-top:.7rem;margin-top:.15rem}
.onb .sale-value{font-size:1.02rem;font-weight:900;letter-spacing:-.025em}
.onb .sale-value-label{font-size:.59rem;color:var(--text-faint);margin-top:.06rem}
.onb .sale-closer{font-size:.62rem;color:var(--text-soft);font-weight:750;text-align:right}
.onb .sale-closer strong{display:block;color:var(--text);font-size:.69rem;margin-top:.05rem}
.onb .sale-arrow{display:inline-flex;align-items:center;gap:.3rem;font-size:.64rem;font-weight:850;color:var(--indigo-600);margin-top:.65rem}
.onb .sale-arrow::after{content:"→";font-size:.8rem}
.onb /* ===== Timeline numérica de Onboarding dentro dos Cards ===== */
    .onboarding-box{margin-top:.72rem;padding:.7rem;border:1px solid #e8e9f3;border-radius:12px;background:#fafaff;cursor:default}
.onb .onboarding-box-head{display:flex;align-items:center;justify-content:space-between;gap:.6rem}
.onb .onboarding-eyebrow{font-size:.56rem;text-transform:uppercase;letter-spacing:.06em;color:var(--indigo-600);font-weight:900}
.onb .onboarding-title{font-size:.69rem;font-weight:900;margin-top:.06rem}
.onb .onboarding-progress{height:4px;background:#eceef5;border-radius:999px;overflow:hidden;margin-top:.48rem}
.onb .onboarding-progress span{display:block;height:100%;background:linear-gradient(90deg,var(--indigo-500),var(--indigo-700));border-radius:999px;transition:width .2s}
.onb .onboarding-next{margin-top:.52rem;padding:.48rem .55rem;border:1px solid var(--indigo-100);border-radius:8px;background:#fff}
.onb .onboarding-next-label{font-size:.51rem;text-transform:uppercase;letter-spacing:.05em;color:var(--indigo-600);font-weight:900}
.onb .onboarding-next-main{font-size:.64rem;font-weight:850;margin-top:.06rem}
.onb .onboarding-timeline{margin-top:.68rem;display:flex;align-items:flex-start;gap:0;overflow:visible;padding:.15rem .05rem .18rem;width:100%}
.onb .onboarding-stage{position:relative;min-width:0;flex:1 1 0;display:flex;justify-content:center;background:transparent;border:0;border-radius:0;overflow:visible}
.onb .onboarding-stage::before{content:"";position:absolute;left:0;right:0;top:15px;height:2px;background:#e6e8f0;z-index:0}
.onb .onboarding-stage:first-child::before{left:50%}
.onb .onboarding-stage:last-child::before{right:50%}
.onb .onboarding-stage.done::before{background:linear-gradient(90deg,var(--emerald-500),var(--emerald-500))}
.onb .onboarding-stage.current::before{background:linear-gradient(90deg,var(--emerald-500) 0 50%,#e6e8f0 50%)}
.onb .stage-head{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:.28rem;padding:0 .12rem;cursor:pointer;min-height:62px;background:transparent;border:0;width:100%}
.onb .stage-head:hover .stage-marker{transform:translateY(-1px)}
.onb .stage-marker{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;background:#fff;border:2px solid #dfe2eb;color:var(--text-faint);font-size:.62rem;font-weight:900;box-shadow:0 1px 2px rgba(15,23,42,.04);transition:.15s}
.onb .stage-marker.done{background:var(--emerald-500);border-color:var(--emerald-500);color:#fff}
.onb .stage-marker.in-progress{background:var(--indigo-600);border-color:var(--indigo-600);color:#fff;box-shadow:0 0 0 4px var(--indigo-50)}
.onb .stage-marker.blocked{background:var(--red-500);border-color:var(--red-500);color:#fff}
.onb .stage-copy{display:none}
.onb .stage-title{font-size:.53rem;font-weight:900;line-height:1.2;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.onb .stage-focus{font-size:.51rem;color:var(--text-faint);line-height:1.2;margin-top:.08rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.onb .stage-focus::before{content:none}
.onb .stage-status{font-size:.45rem;font-weight:850;border-radius:999px;padding:.11rem .3rem;white-space:nowrap;display:none}
.onb .stage-body{display:none;border-top:1px solid #f0f1f6;padding:.62rem;background:#fcfcfe;margin-top:.18rem;border-radius:8px}
.onb .onboarding-stage.expanded{min-width:0;display:flex}
.onb .onboarding-stage.expanded .stage-body{display:none}
.onb .stage-controls{display:grid;grid-template-columns:1fr 1fr;gap:.45rem}
.onb .stage-field{display:flex;flex-direction:column;gap:.2rem}
.onb .stage-field.full{grid-column:1/-1}
.onb .stage-field span{font-size:.52rem;color:var(--text-faint);font-weight:850;text-transform:uppercase;letter-spacing:.04em}
.onb .stage-field input,.onb .stage-field select,.onb .stage-field textarea{width:100%;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--text);padding:.38rem .42rem;font-size:.6rem;outline:none}
.onb .stage-field input,.onb .stage-field select{height:31px}
.onb .stage-field textarea{min-height:54px;resize:vertical;line-height:1.35}
.onb .stage-field input:focus,.onb .stage-field select:focus,.onb .stage-field textarea:focus{border-color:var(--indigo-500);box-shadow:0 0 0 3px rgba(99,102,241,.08)}
.onb .stage-checklist{display:grid;gap:.32rem;margin-top:.55rem}
.onb .stage-check{display:flex;align-items:flex-start;gap:.38rem;font-size:.59rem;color:var(--text-soft);line-height:1.3}
.onb .stage-check input{margin-top:.05rem;accent-color:var(--indigo-600)}
.onb .stage-check.done{color:var(--text-faint);text-decoration:line-through}
.onb .stage-dates{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.55rem}
.onb .stage-date-pill{font-size:.51rem;color:var(--text-faint);background:#f2f3f7;border-radius:999px;padding:.2rem .38rem}
.onb .stage-date-pill strong{color:var(--text-soft)}
.onb .onboarding-hint{display:block;margin:.42rem 0 0;font-size:.51rem;color:var(--text-faint);text-align:center}
.onb .onboarding-alert{display:none;position:fixed;inset:0;z-index:95;background:rgba(15,23,42,.26);backdrop-filter:blur(3px);align-items:center;justify-content:center;padding:1rem}
.onb .onboarding-alert.open{display:flex}
.onb .onboarding-alert-card{width:min(560px,calc(100vw - 2rem));max-height:min(88vh,760px);overflow:auto;background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:0 24px 70px rgba(15,23,42,.22);padding:1rem}
.onb .onboarding-alert-head{display:flex;align-items:flex-start;justify-content:space-between;gap:.8rem;padding-bottom:.72rem;border-bottom:1px solid var(--surface-2)}
.onb .onboarding-alert-kicker{font-size:.56rem;text-transform:uppercase;letter-spacing:.06em;color:var(--indigo-600);font-weight:900}
.onb .onboarding-alert-title{font-size:.98rem;font-weight:900;margin-top:.12rem}
.onb .onboarding-alert-sub{font-size:.67rem;color:var(--text-faint);margin-top:.18rem}
.onb .onboarding-alert-close{width:32px;height:32px;border:1px solid var(--border);border-radius:9px;background:#fff;color:var(--text-soft);font-size:1rem;display:grid;place-items:center}
.onb .onboarding-alert-status{display:flex;align-items:center;gap:.5rem;margin:.82rem 0}
.onb .onboarding-alert-main{font-size:.75rem;font-weight:850;padding:.7rem .75rem;border:1px solid var(--indigo-100);background:linear-gradient(180deg,#fafaff,#f5f6ff);border-radius:11px}
.onb .onboarding-alert-section{margin-top:.85rem}

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/config.js?v=20260925"></script>
  <script src="../js/supabaseClient.js?v=20260925"></script>
  <script src="../js/auth.js?v=20260925"></script>
  <script src="../js/data.js?v=20260925"></script>

  <script>
    // ---------------------------------------------------------------------
    // ONBOARDING — board de vendas.
    //
    // Cada venda registrada no sistema (tabela `sales`, que espelha as
    // negociações marcadas como GANHAS no RD Station) vira um Card aqui
    // automaticamente: o Uriel marcou como venda no RD -> na próxima
    // sincronização o Card aparece.
    //
    // O andamento das etapas do onboarding é compartilhado entre a equipe
    // (public.onboarding_etapas, 30/09/2026). Só as vendas lançadas pelo botão
    // "Nova venda" continuam salvas apenas neste navegador (localStorage).
    // ---------------------------------------------------------------------
    let store = null;

    const dataBrOnb = (d) => { const p = (n) => String(n).padStart(2, "0"); return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()}`; };
    const brlOnb = (v) => Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

    // Quadro "Negociação" do RD (deals.rd_details, gravado pelo sync-rd-station
// desde 28/09/2026): qualificação, fonte, campanha, campos personalizados
// (CNPJ, Nome da empresa, Serviço contratado...) e contatos.
async function carregarDetalhesRd(store) {
  const ids = [...new Set((store.sales || []).map((s) => s.deal_id).filter(Boolean))];
  const mapa = new Map();
  for (let i = 0; i < ids.length; i += 100) {
    const { data, error } = await sb.from("deals").select("id, rd_deal_id, rd_details").in("id", ids.slice(i, i + 100));
    if (error) { console.warn("Detalhes do RD indisponíveis:", error.message); break; }
    for (const r of data || []) mapa.set(r.id, { ...(r.rd_details || {}), rd_deal_id: r.rd_deal_id });
  }
  // Alerta editado pelo Uriel (public.onboarding_notas, 28/09/2026).
  const { data: notas, error: errNotas } = await sb.from("onboarding_notas").select("deal_id, alerta, dados_cliente, atualizado_em");
  if (errNotas) console.warn("Alertas do onboarding indisponíveis:", errNotas.message);
  for (const n of notas || []) mapa.set(n.deal_id, { ...(mapa.get(n.deal_id) || {}), __nota: n });
  // Andamento das 10 etapas, compartilhado entre todos (public.onboarding_etapas, 30/09/2026).
  // Antes ficava só no localStorage de cada navegador.
  const { data: etapas, error: errEtapas } = await sb.from("onboarding_etapas").select("deal_id, dados, atualizado_em");
  if (errEtapas) console.warn("Etapas do onboarding indisponíveis:", errEtapas.message);
  else mapa.__etapasOk = true; // só migra o localStorage antigo quando o banco respondeu
  for (const e of etapas || []) mapa.set(e.deal_id, { ...(mapa.get(e.deal_id) || {}), __etapas: e });
  // Configuração do fluxo (SQL 26): quem recebe a etapa seguinte ao Handoff. Sem a tabela, fica 'Gustavo'.
  try {
    const { data: cfg, error: errCfg } = await sb.from("onboarding_config").select("chave, valor");
    if (!errCfg) { const c = {}; for (const r of cfg || []) c[r.chave] = r.valor; window.__onbConfig = c; }
  } catch (e) {}
  return mapa;
}
// Vendas com gravação das etapas ainda a caminho do banco: a atualização de 60 s
// espera, para não trocar o que o usuário acabou de marcar por uma cópia velha.
const etapasPendentes = new Set();
function campoRd(det, rotulo) {
  const alvo = rotulo.toLowerCase();
  const f = (det?.campos || []).find((c) => (c.label || "").trim().toLowerCase() === alvo);
  return f && f.value != null && String(f.value).trim() !== "" ? String(f.value).trim() : "";
}
const soDigitos = (v) => String(v || "").replace(/\D/g, "");
function formatarCnpj(v) {
  const d = soDigitos(v);
  return d.length === 14 ? d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, "$1.$2.$3/$4-$5") : String(v || "");
}
function dataHoraRd(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return Number.isNaN(d.getTime()) ? String(iso) : d.toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
}


// Produtos da negociação no RD (aba "Produtos"): nome + recorrência (28/09/2026).
const RECORRENCIAS={monthly:'Mensal',mensal:'Mensal',yearly:'Anual',annual:'Anual',anual:'Anual',single:'Pagamento único',spare:'Pagamento único',unique:'Pagamento único',recurrent:'Recorrente'};
const recorrenciaTxt=v=>v?(RECORRENCIAS[String(v).toLowerCase()]||String(v)):'';
function produtosDoRd(det){ return (det?.produtos||[]).filter(p=>p&&p.nome); }
function produtosTexto(det){ return produtosDoRd(det).map(p=>p.nome+(recorrenciaTxt(p.recorrencia)?' ('+recorrenciaTxt(p.recorrencia)+')':'')).join(', '); }
function produtosDetalhe(det){ return produtosDoRd(det).map(p=>[p.nome,recorrenciaTxt(p.recorrencia),(p.quantidade!=null?p.quantidade+' × ':'')+(p.preco!=null?Number(p.preco).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}):'')].filter(x=>x&&String(x).trim()).join(' · ')).join('\n'); }


// Processo da venda pelo campo "Serviço contratado" do RD (28/09/2026):
// Constituição, Troca de Contabilidade ou Transformação.
function processoDaVenda(s){
  const v=String((s&&s.service)||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  if(/transforma/.test(v)) return 'transformacao';
  if(/constitui|abertura/.test(v)) return 'constituicao';
  if(/troca/.test(v)) return 'troca';
  return '';
}

// Início do board de Onboarding: 01/09/2026 (mês em que ele passou a ser usado).
const ONB_INICIO = new Date(2026, 8, 1);
// Negociações do RD (rd_deal_id) de agosto/2026 que entram no board mesmo antes do início:
// KM Serviços Médicos (Kleuber), Allan Carlos, Aluap (Ana Paula), Fenix Net (Ewerton) e ABESA (Roberto).
const ONB_EXCECOES_RD = ["6a78937965fd0400011d0439", "6a7f41853d5bed00010b749c", "6a9599267855b20020316fdb", "69c90fd45ef9e60001524532", "69f3b49965cc5700151ce94b"];
function clientesDasVendas(store, detalhesRd = new Map()) {
      const deals = new Map((store.deals || []).map((d) => [d.id, d]));
      const sellers = new Map((store.sellers || []).map((s) => [s.id, s.name]));
      // Ordem de fechamento (mais antiga = #0001): o número do Card não muda
      // quando entra uma venda nova.
      const vendas = (store.sales || []).filter((s) => s.closed_at).slice().sort((a, b) => a.closed_at - b.closed_at);
      const lista = vendas.map((sale, i) => {
        const d = deals.get(sale.deal_id) || {};
        const det = detalhesRd.get(sale.deal_id) || null;
    const cnpjRd = campoRd(det, "CNPJ");
    const empresaRd = campoRd(det, "Nome da empresa");
    const servicoRd = campoRd(det, "Serviço contratado");
    const inicioRd = campoRd(det, "Data de início");
    const contato = (det?.contatos || [])[0] || {};
    const produtoRd = produtosTexto(det);
    const nota = det?.__nota || null;
    const nome = empresaRd || d.company_name || d.client_name || "Cliente sem nome";
        const closer = (sellers.get(sale.seller_id || d.seller_id) || "—").split(" ")[0];
        const data = dataBrOnb(sale.closed_at);
        const valor = brlOnb(sale.value);
        return {
          id: i + 1,
          key: `sale_${sale.id}`,
          name: nome,
          abbr: initials(nome),
          cnpj: cnpjRd ? formatarCnpj(cnpjRd) : "",
      rd: det,
      dealId: sale.deal_id,
          closer,
          sale: data,
          amount: valor,
          monthly: sale.is_recurring ? valor : "—",
          discount: "—",
          // "Produto / serviço" vem do campo "Serviço contratado" do RD (pedido do usuário, 28/09/2026);
      // o produto da aba Produtos do RD aparece embaixo, menor.
      service: servicoRd || "A definir",
      tipoRd: produtoRd ? "Produto no RD: " + produtoRd : "",
      nota,
      onboarding: det?.__etapas?.dados || null,
          type: servicoRd || "A definir",
          status: "Novo",
          priority: "Normal",
          start: inicioRd || data,
          progress: 8,
          saleInfo: { "Vendedor / closer": closer, Fechamento: data, "Valor da venda": valor, "Contato no RD": d.client_name || "—", Recorrente: sale.is_recurring ? "Sim" : "Não", Serviço: servicoRd || "A definir" },
          companyInfo: { Cliente: nome, Contato: d.client_name || "—", Telefone: (contato.telefones || []).join(", ") || "—", "E-mail": (contato.emails || []).join(", ") || "—", Empresa: empresaRd || d.company_name || "—", CNPJ: cnpjRd ? formatarCnpj(cnpjRd) : "Não informado no RD" },
          currentInfo: { "Processo contratado": "A definir", Situação: "Venda recebida do comercial" },
          pain: "A preencher no handoff comercial.",
          expectation: "A preencher no handoff comercial.",
          meeting: "Card criado automaticamente a partir da venda registrada no RD Station.",
          alerts: [(nota && nota.alerta) || "Completar o cadastro do cliente e os próximos passos do handoff."],
          docs: [],
          partners: [],
          capital: "Não informado",
          notes: "Card criado automaticamente a partir da venda registrada no RD Station.",
          history: [{ date: data, title: "Venda registrada no RD Station", text: `Venda de ${valor} fechada por ${closer}.` }],
        };
      });
      // Só vendas de setembro/2026 em diante (pedido do usuário, 30/09/2026): as mais
      // antigas saem do board e dos totais. O número do Card (#0165...) não muda.
      // Exceções (30/09/2026): vendas ganhas no RD em agosto/2026 cujo handoff foi feito em
      // setembro (lista "Clientes 09/2026" do Trello) continuam no board.
      return lista.filter((c, i) => vendas[i].closed_at >= ONB_INICIO || ONB_EXCECOES_RD.includes(c.rd && c.rd.rd_deal_id)).reverse(); // mais recentes primeiro na grade
    }

    function iniciarOnboarding(root, clientesReais, recarregar) {

    const ONB_ICONS = {
      grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
      send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-11 11"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>',
      users:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
      chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 20V10M12 20V4M17 20v-7"/></svg>',
      phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>',
      calendar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>',
      trend:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 6-6 4 4 8-8M15 7h6v6"/></svg>',
      target:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>',
      handoff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12 3 7l3.5-3.5L11 8h3l2.5-2.5L20 9l-5 5"/><path d="M8 12l3 3 2-2M13 15l2 2 3-3"/></svg>',
      refresh:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.9-4L3 10"/><path d="M3 5v5h5"/><path d="M4 13a8 8 0 0 0 14.9 4L21 14"/><path d="M21 19v-5h-5"/></svg>',
      plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>'
    };
    root.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = ONB_ICONS[el.dataset.icon] || ''; });

    const clients = clientesReais;

    const BASE_SALES = clients.map(c => ({...c}));

    const ONBOARDING_STORAGE_KEY = 'bsconta_onboarding_timeline_v1';
    const ONBOARDING_STAGES = [
      {title:'Handoff', items:['Venda concluída','Grupo de WhatsApp','Documentos/Informações']},
      {title:'Início do Onboarding', items:['Primeiro contato realizado','Mensagem de boas-vindas','Apresentação do responsável']},
      {title:'1ª Reunião', items:['Reunião agendada','Reunião realizada','Necessidades do cliente levantadas','Pendências registradas']},
      {title:'Configuração / Implantação', items:['Documentos recebidos','Dados conferidos','Cadastros/configurações realizados','Pendências internas','Pendências com o cliente']},
      {title:'2ª Reunião', items:['Reunião agendada','Reunião realizada','Dúvidas esclarecidas','Próximos passos definidos']},
      {title:'Acompanhamento', items:['Primeiro acompanhamento','Segundo acompanhamento','Verificação das pendências','Confirmação de que o cliente está sendo atendido normalmente']},
      {title:'Onboarding Concluído', items:['Checklist final concluído','Cliente entregue oficialmente para a operação/atendimento','Data de conclusão registrada']},
      {title:'Pesquisa de Satisfação', items:['Pesquisa enviada','Resposta recebida','Nota registrada','Comentários registrados']},
      {title:'Avaliação no Google', items:['Solicitação de avaliação enviada','Avaliação realizada','Registro da avaliação']},
      {title:'Indicação', items:['Solicitação de indicação enviada','Cliente realizou indicação','Novo lead/cliente indicado registrado']}
    ];
    const ONBOARDING_STATUS = {
      done:{label:'Concluído', className:'done', icon:'✓'},
      progress:{label:'Em andamento', className:'in-progress', icon:'●'},
      pending:{label:'Pendente', className:'pending', icon:'○'},
      blocked:{label:'Bloqueado', className:'blocked', icon:'!'}
    };
    let expandedStages = new Set();
    function nowISO(){ return new Date().toISOString(); }
    function formatDateTime(iso){
      if(!iso) return '—';
      const d=new Date(iso); if(Number.isNaN(d.getTime())) return String(iso);
      return d.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
    }
    function dateInputValue(iso){ return iso ? new Date(iso).toISOString().slice(0,10) : ''; }
    function dateLabel(iso){
      if(!iso) return '—';
      const d=new Date(iso); if(Number.isNaN(d.getTime())) return String(iso);
      return d.toLocaleDateString('pt-BR');
    }
    function createStageTemplate(stage, status='pending', baseDate=''){
      return {
        title:stage.title,
        status,
        responsible:'',
        createdAt: status==='pending' ? null : (baseDate ? `${baseDate}T12:00:00` : nowISO()),
        startedAt: status==='progress' || status==='done' ? (baseDate ? `${baseDate}T12:00:00` : nowISO()) : null,
        dueDate:'',
        completedAt: status==='done' ? (baseDate ? `${baseDate}T12:00:00` : nowISO()) : null,
        updatedAt: nowISO(),
        notes:'',
        substeps:stage.items.map(label=>({label,done:status==='done',completedAt:status==='done' ? (baseDate ? `${baseDate}T12:00:00` : nowISO()) : null}))
      };
    }
    function defaultOnboarding(s){
      const baseISO=dateToISO(s.sale || '');
      const status=s.status;
      let statuses=Array(ONBOARDING_STAGES.length).fill('pending');
      if(status==='Concluído') statuses=ONBOARDING_STAGES.map(()=> 'done');
      else if(status==='Em onboarding') statuses=['done','done','done','progress','pending','pending','pending','pending','pending','pending'];
      else if(status==='Documentação pendente') statuses=['done','done','done','blocked','pending','pending','pending','pending','pending','pending'];
      else if(status==='Aguardando informações') statuses=['done','progress','pending','pending','pending','pending','pending','pending','pending','pending'];
      // Vendida = 01 · Handoff vermelha/bloqueada até ser marcada como verde (05/10/2026).
      else statuses=['blocked','pending','pending','pending','pending','pending','pending','pending','pending','pending'];
      const stages=ONBOARDING_STAGES.map((stage,i)=>createStageTemplate(stage,statuses[i],baseISO));
      const currentIndex=Math.max(0,statuses.findIndex(x=>x!=='done'));
      if(currentIndex>=0 && stages[currentIndex] && !stages[currentIndex].startedAt){
        stages[currentIndex].startedAt=nowISO();
        stages[currentIndex].createdAt=stages[currentIndex].createdAt || nowISO();
      }
      return {
        stages,
        nextStep:ONBOARDING_STAGES[currentIndex >= 0 ? currentIndex : ONBOARDING_STAGES.length-1].title,
        auditHistory:[{
          at:baseISO?`${baseISO}T12:00:00`:nowISO(),title:'Timeline de onboarding criada',text:'Acompanhamento operacional adicionado automaticamente ao Card da venda.'
        }]
      };
    }
    function normalizeOnboarding(s){
      if(s.onboarding && Array.isArray(s.onboarding.stages) && s.onboarding.stages.length===ONBOARDING_STAGES.length){
        s.onboarding.stages=s.onboarding.stages.map((st,i)=>({...createStageTemplate(ONBOARDING_STAGES[i]),...st,substeps:Array.isArray(st.substeps)&&st.substeps.length===ONBOARDING_STAGES[i].items.length ? st.substeps.map((x,j)=>({...x,label:ONBOARDING_STAGES[i].items[j]})) : ONBOARDING_STAGES[i].items.map(label=>({label,done:false,completedAt:null}))}));
        s.onboarding.auditHistory=Array.isArray(s.onboarding.auditHistory)?s.onboarding.auditHistory:[];
        // Regra do fluxo (05/10/2026): enquanto a 01 · Handoff não foi marcada como verde,
        // ela fica vermelha/bloqueada — inclusive nos cards que já existiam.
        const h=s.onboarding.stages[0]; if(h && h.status!=='done') h.status='blocked';
        return s.onboarding;
      }
      s.onboarding=defaultOnboarding(s); return s.onboarding;
    }
    function onboardingProgress(s){
      const stages=normalizeOnboarding(s).stages;
      const completed=stages.filter(x=>x.status==='done').length;
      const percent=Math.round(completed/ONBOARDING_STAGES.length*100);
      const currentIndex=stages.findIndex(x=>x.status!=='done');
      return {stages,completed,percent,currentIndex:currentIndex<0?ONBOARDING_STAGES.length-1:currentIndex};
    }
    function stageStatusMeta(status){ return ONBOARDING_STATUS[status] || ONBOARDING_STATUS.pending; }
    // Responsável atual do card (01/10/2026, pedido do Gustavo):
    // etapa 01 (Handoff) é do vendedor (ex.: Uriel), que realiza e confirma;
    // da etapa 02 em diante é do onboarding (Gustavo), a não ser que a etapa
    // atual tenha outro responsável preenchido no detalhe.
    // Responsável da etapa seguinte ao Handoff: CONFIGURAÇÃO do fluxo atual (não regra fixa).
    // Vem de public.onboarding_config (chave 'responsavel_proxima_etapa', SQL 26); sem a
    // tabela, usa 'Gustavo'. Para trocar o responsável no futuro basta mudar essa configuração.
    const RESPONSAVEL_ONBOARDING=(window.__onbConfig&&window.__onbConfig.responsavel_proxima_etapa)||'Gustavo';
    // Fluxo do Handoff (05/10/2026, fase de teste):
    // VENDIDA → 01 vermelha/bloqueada → marcada verde → libera + e-mail → 02 direcionada ao
    // responsável (cinza, aguardando) → responsável inicia (azul, em andamento).
    function fluxoHandoff(s){
      const st=normalizeOnboarding(s).stages;
      if(st[0]?.status!=='done') return {chave:'bloqueado',rotulo:'Bloqueado · aguardando validação',badge:'b-red'};
      const resp=(st[1]?.responsible||'').trim()||RESPONSAVEL_ONBOARDING;
      if(st[1]?.status==='pending') return {chave:'aguardando',rotulo:`Aguardando ${resp}`,badge:'b-gray'};
      if(st[1]?.status==='progress') return {chave:'andamento',rotulo:`Em andamento · ${resp}`,badge:'b-blue'};
      return null; // já passou da etapa 02: segue o fluxo normal
    }
    const handoffLiberado=s=>normalizeOnboarding(s).stages[0]?.status==='done';
    function responsavelAtual(s){
      const p=onboardingProgress(s);
      if(p.stages[0]?.status!=='done') return s.closer && s.closer!=='—' ? s.closer : 'Sem vendedor';
      return (p.stages[p.currentIndex]?.responsible||'').trim() || RESPONSAVEL_ONBOARDING;
    }
    function stageResponsible(st){ return st.responsible ? `Resp.: ${st.responsible}` : 'Responsável não definido'; }
    function stageDue(st){ return st.dueDate ? `Prazo: ${dateLabel(st.dueDate+'T12:00:00')}` : 'Prazo não definido'; }
    function stageFocus(st,index){
      const firstPending = st.substeps.find(x=>!x.done);
      if(st.status==='done') return st.substeps.at(-1)?.label || 'Etapa concluída';
      let label = firstPending?.label || st.title;
      if((index===2 || index===4) && label==='Reunião agendada') label='Reunião de onboarding agendada';
      if(index===3 && label==='Cadastros/configurações realizados') label='Configuração do sistema';
      if(index===7 && label==='Pesquisa enviada') label='Pesquisa de satisfação enviada';
      if(index===8 && label==='Solicitação de avaliação enviada') label='Solicitação de avaliação enviada';
      if(index===9 && label==='Solicitação de indicação enviada') label='Solicitação de indicação enviada';
      return label;
    }
    function renderOnboardingCard(s){
      const p=onboardingProgress(s); const current=p.currentIndex; const stages=p.stages;
      const next=stages[current] || stages[stages.length-1];
      const key=s.id;
      const stageHtml=stages.map((st,i)=>{
        const meta=stageStatusMeta(st.status);
        const expanded=expandedStages.has(`${key}:${i}`);
        const concise=stageFocus(st,i);
        return `<div class="onboarding-stage ${meta.className==='done'?'done':''} ${meta.className==='blocked'?'blocked':''} ${i===current?'current':''}" data-sale-id="${s.id}" data-stage-index="${i}">
          <div class="stage-head onboarding-interactive" data-action="toggle-stage" role="button" tabindex="0" aria-expanded="false" title="${esc(st.title)} — ${esc(meta.label)}">
            <span class="stage-marker ${meta.className} ${i===1&&st.status==='pending'&&stages[0].status==='done'?'aguardando':''}">${String(i+1).padStart(2,'0')}</span>
            <div class="stage-copy"><div class="stage-title">${esc(st.title)}</div><div class="stage-focus">${esc(concise)}</div></div>
          </div>
        </div>`;
      }).join('');
      return `<section class="onboarding-box onboarding-interactive" data-onboarding-box="${s.id}">
        <div class="onboarding-box-head"><div><div class="onboarding-eyebrow">Onboarding do Cliente</div><div class="onboarding-title">${p.completed}/${ONBOARDING_STAGES.length} etapas concluídas · ${p.percent}%</div></div><span class="badge ${p.percent===100?'b-green':'b-indigo'}">${p.percent===100?'Concluído':'Em acompanhamento'}</span></div>
        <div class="onboarding-progress"><span style="width:${p.percent}%"></span></div>
        <div class="onboarding-next"><div class="onboarding-next-label">Próximo passo</div><div class="onboarding-next-main">${current===0&&next?.status==='blocked'?'Venda concluída · Bloqueado — marque a 01 como verde para liberar':esc(stageFocus(next,current) || 'Onboarding finalizado')+(next?.status==='blocked'?' · Bloqueado':'')}</div></div>
        <div class="onboarding-timeline">${stageHtml}</div>
        <div class="onboarding-hint">Clique em um número para ver o status e adicionar informações.</div>
      </section>`;
    }

    const STORAGE_KEY = 'bsconta_sales_cards_v1';
    const storedSales = (() => {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; }
    })();
    const storedOnboarding = (() => {
      try { return JSON.parse(localStorage.getItem(ONBOARDING_STORAGE_KEY) || '{}'); } catch { return {}; }
    })();
    let sales = [];
    let selectedId = null;

    const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
    const statusClass = s => ({'Novo':'b-indigo','Aguardando informações':'b-amber','Documentação pendente':'b-amber','Em onboarding':'b-indigo','Concluído':'b-green'}[s] || 'b-neutral');
    const priorityClass = p => ({'Normal':'normal','Alta':'alta','Urgente':'urgente'}[p] || 'normal');
    const moneyToNumber = s => {
      const clean = String(s || '').replace(/\./g,'').replace(',', '.').replace(/[^\d.-]/g,'');
      const n = Number(clean);
      return Number.isFinite(n) ? n : 0;
    };
    const formatBRL = n => n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
    const isoToBR = iso => iso ? iso.split('-').reverse().join('/') : '';
    const dateToISO = br => {
      const [d,m,y] = String(br || '').split('/');
      return d&&m&&y ? `${y}-${m}-${d}` : '';
    };
    // Prioridade: banco (onboarding_etapas) > localStorage antigo > padrão.
    sales = [...BASE_SALES, ...storedSales].map(s => ({...s, onboarding: s.onboarding || storedOnboarding[s.key || String(s.id)] || defaultOnboarding(s)}));
    function formatInfo(obj){
      return Object.entries(obj || {}).map(([k,v]) =>
        `<div class="info"><div class="info-label">${esc(k)}</div><div class="info-value ${String(v).length>38?'soft':''}">${esc(v)}</div></div>`
      ).join('');
    }
    function saleStatusPercent(s){ return Math.max(0, Math.min(100, Number(s.progress || (s.status==='Concluído'?100:0)))); }
    function generatedHistory(s){
      const base=(Array.isArray(s.history) && s.history.length) ? [...s.history] : [
        {date:s.sale || '—', title:'Venda registrada', text:`Venda de ${s.type || s.service} registrada por ${s.closer || 'responsável comercial'}.`},
        {date:s.start || '—', title:'Início previsto', text:`Previsão de início do serviço para ${s.start || 'a definir'}.`},
        {date:s.status==='Concluído' ? (s.start || s.sale) : 'Atual', title:`Status atual: ${s.status}`, text:'Acompanhamento do processo conforme as informações disponíveis nesta ficha.'}
      ];
      const onboarding=normalizeOnboarding(s);
      const audit=(onboarding.auditHistory||[]).map(h=>({date:formatDateTime(h.at),title:h.title,text:h.text}));
      return [...base,...audit];
    }

    // Vendas do RD (com dealId) gravam as etapas no banco (public.onboarding_etapas),
    // para todos verem. O localStorage fica só para as vendas do botão "Nova venda".
    function persistAll(s, opcoes={}){
      const custom = sales.filter(x => !BASE_SALES.some(b => b.id===x.id));
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(custom)); } catch {}
      const map={...storedOnboarding}; // mantém as marcações antigas até a migração
      sales.forEach(x=>{ if(!x.dealId) map[x.key || String(x.id)]=normalizeOnboarding(x); });
      try { localStorage.setItem(ONBOARDING_STORAGE_KEY, JSON.stringify(map)); } catch {}
      if(s && s.dealId) salvarEtapasNoBanco(s, opcoes.adiar ? 600 : 0);
    }
    const timersEtapas = new Map();
    function salvarEtapasNoBanco(s, atraso=0){
      const id=s.dealId; etapasPendentes.add(id);
      clearTimeout(timersEtapas.get(id));
      timersEtapas.set(id, setTimeout(async ()=>{
        timersEtapas.delete(id);
        const linha={deal_id:id, dados:normalizeOnboarding(s), atualizado_em:nowISO()};
        if(usuarioAtualId) linha.atualizado_por=usuarioAtualId;
        try{
          const {data,error}=await sb.from('onboarding_etapas').upsert(linha,{onConflict:'deal_id'}).select('deal_id, dados, atualizado_em').single();
          if(error) throw error;
          guardarEtapasLocais(id, data || linha);
        }catch(e){
          console.error('Falha ao salvar as etapas do onboarding:', e);
          alert('Não foi possível salvar o andamento do onboarding de '+(s.name||'esta venda')+'. Os outros usuários ainda não veem esta mudança. Verifique a conexão e tente de novo.\n\n'+(e&&e.message?e.message:''));
        }finally{
          if(!timersEtapas.has(id)) etapasPendentes.delete(id);
        }
      }, atraso));
    }
    // Mantém a cópia em memória igual ao banco (evita redesenho à toa na atualização de 60 s).
    function guardarEtapasLocais(id, linha){
      const atual=detalhesRd.get(id) || {};
      detalhesRd.set(id, {...atual, __etapas:{deal_id:id, dados:linha.dados, atualizado_em:linha.atualizado_em}});
    }
    // Migração automática: marcações antigas deste navegador para vendas que ainda
    // não estão no banco são enviadas uma vez, sem sobrescrever o banco.
    const MIGRADO_KEY='bsconta_onboarding_migrado_v1';
    function temMarcacaoAntiga(o){
      if(!o || !Array.isArray(o.stages)) return false;
      if(Array.isArray(o.auditHistory) && o.auditHistory.length>1) return true;
      return o.stages.some(st=>st && ((st.responsible||'').trim() || (st.notes||'').trim() || st.dueDate));
    }
    async function migrarOnboardingAntigo(){
      if(!detalhesRd.__etapasOk) return;
      let migrados={}; try{ migrados=JSON.parse(localStorage.getItem(MIGRADO_KEY)||'{}'); }catch{}
      for(const s of sales){
        if(!s.dealId) continue;
        const k=s.key || String(s.id);
        const antigo=storedOnboarding[k];
        if(migrados[k] || detalhesRd.get(s.dealId)?.__etapas || !temMarcacaoAntiga(antigo)) continue;
        const linha={deal_id:s.dealId, dados:antigo, atualizado_em:nowISO()};
        if(usuarioAtualId) linha.atualizado_por=usuarioAtualId;
        const {data,error}=await sb.from('onboarding_etapas').upsert(linha,{onConflict:'deal_id',ignoreDuplicates:true}).select('deal_id, dados, atualizado_em').maybeSingle();
        if(error){ console.warn('Migração das etapas antigas falhou:', error.message); continue; }
        migrados[k]=nowISO(); try{ localStorage.setItem(MIGRADO_KEY, JSON.stringify(migrados)); }catch{}
        if(data) guardarEtapasLocais(s.dealId, data);
      }
    }
    function addOnboardingAudit(s, title, text){
      const o=normalizeOnboarding(s); o.auditHistory.push({at:nowISO(),title,text});
    }
    function getStage(s,index){ return normalizeOnboarding(s).stages[index]; }
    function updateStageStatus(s,index,nextStatus){
      // Regra de segurança do fluxo (05/10/2026). Atenção: normalizeOnboarding() recria os objetos
      // das etapas, por isso as conferências vêm ANTES de pegar a etapa que será alterada.
      const prev=getStage(s,index).status; if(prev===nextStatus) return;
      if(index>0 && !handoffLiberado(s)){ showToast('Bloqueado: marque a 01 · Handoff como verde para liberar a venda.'); return; }
      if(index===0){
        if(nextStatus!=='done' && nextStatus!=='blocked') nextStatus='blocked'; if(prev===nextStatus) return;
        if(prev==='done' && nextStatus==='blocked'){
          const seg=getStage(s,1);
          if(seg && seg.status!=='pending'){ showToast(`Não dá para bloquear de novo: ${seg.responsible||RESPONSAVEL_ONBOARDING} já iniciou a etapa 02.`); return; }
        }
        if(nextStatus==='done' && !confirm(`Marcar a 01 · Handoff de ${s.name} como VERDE?\n\nIsso libera a venda, dispara o e-mail de Handoff e direciona a etapa 02 para ${RESPONSAVEL_ONBOARDING}.`)) return;
      }
      const st=getStage(s,index);
      const t=nowISO(); st.status=nextStatus; st.updatedAt=t; st.createdAt=st.createdAt||t;
      if(nextStatus==='progress' && !st.startedAt) st.startedAt=t;
      if(nextStatus==='done') { st.startedAt=st.startedAt||t; st.completedAt=t; }
      else if(prev==='done' && nextStatus!=='done') st.completedAt=null;
      const ultima = index===ONBOARDING_STAGES.length-1;
      if(ultima && prev==='done' && nextStatus!=='done') delete normalizeOnboarding(s).situacao; // reabriu a 10: volta para Ativos
      addOnboardingAudit(s, `${st.title} — ${ONBOARDING_STATUS[nextStatus].label}`, `Status alterado de ${ONBOARDING_STATUS[prev]?.label || 'Pendente'} para ${ONBOARDING_STATUS[nextStatus].label}.`);
      let liberou=false;
      if(index===0 && nextStatus==='done'){
        // Verde: libera, e a etapa 02 vai para o responsável configurado (cinza, aguardando início).
        const seg=getStage(s,1);
        if(seg && seg.status!=='done'){
          seg.status='pending'; seg.responsible=(seg.responsible||'').trim()||RESPONSAVEL_ONBOARDING; seg.createdAt=seg.createdAt||t; seg.updatedAt=t;
          addOnboardingAudit(s, 'Venda liberada', `Handoff validado (verde). E-mail de Handoff disparado e etapa 02 direcionada para ${seg.responsible}.`);
        }
        liberou=true;
      }
      if(index===0 && nextStatus==='blocked') addOnboardingAudit(s, 'Venda bloqueada', 'Handoff voltou para vermelho/bloqueado.');
      if(index===1 && nextStatus==='progress' && prev==='pending') addOnboardingAudit(s, 'Etapa 02 iniciada', `${st.responsible||RESPONSAVEL_ONBOARDING} assumiu a venda (azul/em andamento).`);
      const p=onboardingProgress(s); const next=p.stages[p.currentIndex];
      s.onboarding.nextStep=next?.title || 'Onboarding finalizado';
      persistAll(s); renderSales();
      if(liberou) showToast(`${s.name}: liberada (verde). E-mail de Handoff disparado — agora está com ${getStage(s,1)?.responsible||RESPONSAVEL_ONBOARDING} (cinza, aguardando início).`);
      if(ultima && nextStatus==='done') showToast(`${s.name}: onboarding concluído. O card foi para "Concluídos" — lá você pode arquivar ou excluir.`);
    }
    function updateStageField(s,index,field,value){
      if(index>0 && !handoffLiberado(s)) return; // bloqueada: nada avança antes do verde
      const st=getStage(s,index); const t=nowISO();
      if(field==='responsible') st.responsible=value.trim();
      if(field==='dueDate') st.dueDate=value;
      if(field==='notes') st.notes=value;
      if(field==='startedAt') { st.startedAt=value ? `${value}T12:00:00` : null; st.createdAt=st.createdAt||nowISO(); }
      st.updatedAt=t;
      persistAll(s, {adiar: field==='responsible' || field==='notes'}); renderSales();
    }
    function toggleSubstep(s,index,subIndex,done){
      if(index>0 && !handoffLiberado(s)) return; // bloqueada: nada avança antes do verde
      const st=getStage(s,index); const sub=st.substeps[subIndex]; if(!sub) return; const t=nowISO();
      sub.done=done; sub.completedAt=done?t:null; st.updatedAt=t;
      addOnboardingAudit(s, `${st.title} — atividade atualizada`, `${done?'Concluída':'Reaberta'}: ${sub.label}.`);
      persistAll(s); renderSales();
    }
    function toggleStageExpanded(saleId,index,expand=true){
      const key=`${saleId}:${index}`; if(expand) expandedStages.add(key); else expandedStages.delete(key); renderSales();
    }

    // Situação do card (01/10/2026): etapa 10 (Indicação) concluída = onboarding concluído.
    // A partir daí o card pode ser arquivado ou excluído (fica em onboarding.situacao,
    // gravado no banco junto com as etapas — todos veem; "Restaurar" desfaz).
    function etapa10Concluida(s){ const st=normalizeOnboarding(s).stages; return !!(st[st.length-1] && st[st.length-1].status==='done'); }
    function situacaoCard(s){
      const sit=normalizeOnboarding(s).situacao;
      if(sit==='arquivado' || sit==='excluido') return sit;
      return etapa10Concluida(s) ? 'concluido' : 'ativo';
    }
    function vendaConcluida(s){ return s.status==='Concluído' || situacaoCard(s)!=='ativo'; }
    const SITUACAO_ROTULO={ativo:'ativos',concluido:'Concluídos',arquivado:'Arquivados',excluido:'Excluídos'};
    function mudarSituacao(s, nova){
      const o=normalizeOnboarding(s);
      const antes=situacaoCard(s);
      if(nova==='excluido' && !confirm(`Excluir o card de ${s.name}?\n\nEle sai do board e fica no filtro "Excluídos", de onde pode ser restaurado.`)) return;
      if(nova) o.situacao=nova; else delete o.situacao;
      const depois=situacaoCard(s);
      const titulos={arquivado:'Card arquivado',excluido:'Card excluído'};
      addOnboardingAudit(s, titulos[nova] || 'Card restaurado', `Situação alterada de ${SITUACAO_ROTULO[antes]} para ${SITUACAO_ROTULO[depois]}.`);
      persistAll(s); renderSales();
      showToast(nova==='arquivado' ? `${s.name}: card arquivado (veja em "Arquivados").` : nova==='excluido' ? `${s.name}: card excluído (veja em "Excluídos").` : `${s.name}: card restaurado para ${SITUACAO_ROTULO[depois]}.`);
    }
    function acoesCardHtml(s){
      const sit=situacaoCard(s);
      if(sit==='ativo') return '';
      const b=(acao,rotulo,extra='')=>`<button type="button" class="card-acao ${extra}" data-card-acao="${acao}" data-sale-id="${s.id}">${rotulo}</button>`;
      const botoes = sit==='concluido' ? b('arquivar','Arquivar')+b('excluir','Excluir card','perigo')
        : sit==='arquivado' ? b('restaurar','Restaurar')+b('excluir','Excluir card','perigo')
        : b('restaurar','Restaurar');
      const aviso = sit==='concluido' ? '<span class="card-acao-aviso">Onboarding concluído</span>' : sit==='arquivado' ? '<span class="card-acao-aviso">Arquivado</span>' : '<span class="card-acao-aviso">Excluído</span>';
      return `<div class="card-acoes onboarding-interactive">${botoes}${aviso}</div>`;
    }
    function updateKpis(list=sales){
      document.getElementById('kpiSales').textContent = list.length;
      const total = list.reduce((sum,s)=>sum + moneyToNumber(s.amount),0);
      document.getElementById('kpiRevenue').textContent = formatBRL(total);
      // Filtro "Responsável" (01/10/2026): Em andamento mostra quantos processos estão com a pessoa.
      const rfKpi = document.getElementById('respFilter')?.value || '';
      const emAndamento = list.filter(s=>!vendaConcluida(s) && (!rfKpi || responsavelAtual(s)===rfKpi)).length;
      document.getElementById('kpiActive').textContent = emAndamento;
      document.getElementById('kpiActiveFoot').textContent = rfKpi ? `${rfKpi} tem ${emAndamento} processo${emAndamento===1?'':'s'}` : 'Vendas ainda em operação';
      document.getElementById('kpiDone').textContent = list.filter(vendaConcluida).length;
      // Faixa de performance: progresso médio do onboarding das vendas.
      const medio = list.length ? Math.round(list.reduce((soma,s)=>soma+onboardingProgress(s).percent,0)/list.length) : 0;
      const semInicio = list.filter(s=>onboardingProgress(s).completed===0).length;
      document.getElementById('onbBanner').innerHTML = perfBannerHtml({ titulo: 'Performance do Onboarding', nota: list.length ? notaPorTaxa(medio,[70,40,15]) : NOTAS_PERF.boa, desc: `${list.length} venda${list.length===1?'':'s'} · progresso médio de ${medio}% · ${semInicio} sem nenhuma etapa concluída.` });
    }

    function renderSales(){
      sales.forEach(normalizeOnboarding);
      const q = document.getElementById('search').value.trim().toLowerCase();
      const sf = document.getElementById('statusFilter').value;
      const tf = document.getElementById('typeFilter').value;
      const saleDate = document.getElementById('saleDateFilter').value;
      const vista = document.getElementById('situacaoFilter')?.value || '';
      const respSel = document.getElementById('respFilter');
      const rf = respSel?.value || '';
      if(respSel){ // opções = responsáveis atuais das vendas (mantém a escolha)
        const nomes=[...new Set(sales.filter(s=>situacaoCard(s)!=='excluido').map(responsavelAtual))].sort((a,b)=>a.localeCompare(b,'pt-BR'));
        if(rf && !nomes.includes(rf)) nomes.push(rf);
        respSel.innerHTML='<option value="">Todos os responsáveis</option>'+nomes.map(n=>`<option value="${esc(n)}"${n===rf?' selected':''}>${esc(n)}</option>`).join('');
      }
      const perOnb = periodoOnboarding(); // filtro do calendário (data da venda)
      const base = sales.filter(s =>
        (!q || [s.name,s.cnpj,s.closer,responsavelAtual(s),s.service,s.type].join(' ').toLowerCase().includes(q)) &&
        (!rf || responsavelAtual(s)===rf) &&
        (!sf || s.status===sf) &&
        (!tf || s.type===tf) &&
        (!saleDate || s.sale === isoToBR(saleDate)) &&
      (!perOnb || ((dd) => dd && dd >= perOnb.start && dd < perOnb.end)(dataBrParaDate(s.sale)))
      );
      // Filtro de situação (01/10/2026): Ativos (padrão), Concluídos, Arquivados, Excluídos.
      const ativos = base.filter(s => situacaoCard(s) === (vista || 'ativo'));
      document.getElementById('resultCount').textContent = `${ativos.length} venda${ativos.length===1?'':'s'}`;
      // Muitas vendas no histórico: mostra as mais recentes e carrega o resto sob demanda.
      const limiteOnb = root.__limite || 24;
      const cardHtml = s => `
        <article class="sale-card ${situacaoCard(s)} ${fluxoHandoff(s)?'fluxo-'+fluxoHandoff(s).chave:''}" tabindex="0" role="button" data-id="${s.id}" aria-label="Abrir detalhes da venda de ${esc(s.name)}">
          <div class="sale-card-top">
            <span class="sale-id">VENDA #${String(s.id).padStart(4,'0')}</span>
            <span class="sale-date">${esc(s.sale)}</span>
          </div>
          <div class="sale-client-row">
            <div class="sale-client-avatar">${esc(s.abbr || initials(s.name))}</div>
            <div><div class="sale-client-name">${esc(s.name)}</div><div class="sale-client-meta">${esc(s.cnpj || 'CNPJ não informado')}</div></div>
          </div>
          <div class="sale-service">
            <div class="sale-service-label">Produto / serviço</div>
            <div class="sale-service-value">${esc(s.service || s.type)}</div>${s.tipoRd?`<div class="sale-service-tipo">${esc(s.tipoRd)}</div>`:''}
          </div>
          <div class="badges">
            <span class="badge ${statusClass(s.status)}">${esc(s.status)}</span>
            <span class="badge b-neutral" title="Responsável atual · Vendedor: ${esc(s.closer || '—')}">${esc(responsavelAtual(s))}</span>
            ${fluxoHandoff(s)?`<span class="badge ${fluxoHandoff(s).badge}" data-fluxo="${fluxoHandoff(s).chave}">${esc(fluxoHandoff(s).rotulo)}</span>`:''}
          </div>
          <div class="sale-card-bottom">
            <div><div class="sale-value">${esc(s.amount)}</div><div class="sale-value-label">valor da venda</div></div>
            <div class="sale-closer">Mensalidade<strong>${esc(s.monthly || '—')}</strong></div>
          </div>
          ${renderOnboardingCard(s)}
          ${acoesCardHtml(s)}
          <div class="sale-arrow">Ver detalhes</div>
        </article>`;
      document.getElementById('salesGrid').innerHTML = ativos.slice(0, limiteOnb).map(cardHtml).join('');
      document.getElementById('emptyState').hidden = ativos.length > 0;
      let maisOnb = document.getElementById('onbMais');
      if (!maisOnb) { maisOnb = document.createElement('div'); maisOnb.id = 'onbMais'; maisOnb.style.cssText = 'display:flex;justify-content:center;padding:1rem'; document.getElementById('salesGrid').after(maisOnb); }
      maisOnb.innerHTML = ativos.length > limiteOnb ? `<button type="button" class="ghost-btn">Mostrar mais vendas (${ativos.length - limiteOnb} restantes)</button>` : '';
      maisOnb.onclick = (e) => { if (e.target.closest('button')) { root.__limite = limiteOnb + 48; renderSales(); } };
      document.querySelectorAll('.sale-card').forEach(card => {
        card.addEventListener('click', e => {
          if(e.target.closest('.onboarding-interactive')) return;
          openSale(Number(card.dataset.id));
        });
        card.addEventListener('keydown', e => {
          if(e.target.closest('.onboarding-interactive')) return;
          if(e.key==='Enter' || e.key===' ') { e.preventDefault(); openSale(Number(card.dataset.id)); }
        });
      });
      updateKpis((perOnb ? base : sales).filter(s => situacaoCard(s) !== 'excluido'));
    }

    
// ---- E-mail ao Gustavo quando a 1ª etapa é concluída (01/10/2026) ----
// O banco (gatilho do SQL 25) registra a transferência e a Edge Function

const EMAIL_STATUS_TXT={pendente:'Na fila de envio',enviando:'Enviando…',enviado:'Enviado',erro:'Falhou'};
async function renderEmailAviso(dealId, tentativa=0){
  const el=document.getElementById('onbEmailAviso'); if(!el || el.dataset.deal!==String(dealId)) return;
  const {data,error}=await sb.from('onboarding_transferencias').select('id,email_status,email_enviado_em,email_erro,email_destinatarios,email_tentativas,transferido_em').eq('deal_id',dealId).order('transferido_em',{ascending:false}).limit(1).maybeSingle();
  const box=document.getElementById('onbEmailAviso'); if(!box || box.dataset.deal!==String(dealId)) return;
  if(error){ box.innerHTML=''; return; } // tabela ainda não criada: não mostra nada
  if(!data){
    if(tentativa<3){ box.innerHTML='<span class="onb-email-txt">Aviso por e-mail ao Gustavo: registrando…</span>'; setTimeout(()=>renderEmailAviso(dealId,tentativa+1),2500); }
    else box.innerHTML='<span class="onb-email-txt">Aviso por e-mail ao Gustavo: não registrado (etapa concluída antes da automação).</span>';
    return;
  }
  const st=data.email_status; const quando=data.email_enviado_em?formatDateTime(data.email_enviado_em):'';
  const para=(data.email_destinatarios||[]).join(', ');
  const cls=st==='enviado'?'b-green':st==='erro'?'b-red':'b-indigo';
  box.innerHTML='<span class="onb-email-txt">Aviso por e-mail ao Gustavo:</span> <span class="badge '+cls+'">'+esc(EMAIL_STATUS_TXT[st]||st)+'</span>'
    +(st==='enviado'?' <span class="onb-email-txt">'+esc(quando)+(para?' · '+esc(para):'')+'</span>':'')
    +(st==='erro'?'<div class="onb-email-txt onb-email-erro">'+esc(data.email_erro||'Erro desconhecido')+'</div><button type="button" class="card-acao" data-reenviar-email="'+esc(data.id)+'">Tentar de novo</button>':'');
  if((st==='pendente'||st==='enviando') && tentativa<6) setTimeout(()=>renderEmailAviso(dealId,tentativa+1),3000);
}
// O board é remontado na atualização: liga o clique só uma vez (usa as funções da montagem atual).
window.__onbReenviarEmail=async e=>{
  const b=e.target.closest('[data-reenviar-email]'); if(!b) return;
  e.preventDefault(); e.stopPropagation(); b.disabled=true; b.textContent='Enviando…';
  try{
    const {data:ses}=await sb.auth.getSession();
    const r=await fetch(window.SGCMP_CONFIG.SUPABASE_URL+'/functions/v1/notificar-transferencia',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+(ses?.session?.access_token||'')},body:JSON.stringify({id:b.dataset.reenviarEmail,manual:true})});
    const j=await r.json().catch(()=>({}));
    const res=(j.resultados||[])[0];
    if(!r.ok || !res || res.status==='erro') showToast('Não foi possível enviar o e-mail: '+((res&&res.erro)||j.error||('erro '+r.status)));
    else showToast('E-mail enviado ao Gustavo.');
  }catch(err){ showToast('Não foi possível enviar o e-mail: '+(err&&err.message||err)); }
  const box=document.getElementById('onbEmailAviso'); if(box) renderEmailAviso(box.dataset.deal, 6);
};
if(!window.__onbReenvioLigado){ window.__onbReenvioLigado=true; document.addEventListener('click',e=>window.__onbReenviarEmail(e)); }

    const a=porId.get(b.dataset.apagar); if(!a) return;
    const ok=await confirmarAnexo('Apagar anexo','Apagar "'+a.nome+'"? Essa ação não pode ser desfeita.','Apagar'); if(!ok) return;
    if(!/^https?:\/\//i.test(a.caminho)) await sb.storage.from('onboarding-anexos').remove([a.caminho]);
    const {error:e}=await sb.from('onboarding_anexos').delete().eq('id',a.id);
    if(e) showToast('Erro ao apagar: '+e.message); else showToast('Anexo apagado.');
    renderAnexos(s);
  }));
  box.querySelectorAll('[data-adicionar]').forEach(b=>b.addEventListener('click',()=>abrirJanelaAnexos(s, ANEXO_CATS.find(c=>c.id===b.dataset.adicionar))));
}
function janelaBase(){
  let m=document.getElementById('anexoJanela');
  if(!m){ m=document.createElement('div'); m.id='anexoJanela'; m.className='anexo-janela'; (document.querySelector('.onb')||document.body).appendChild(m); }
  return m;
}
function fecharJanela(){ const m=document.getElementById('anexoJanela'); if(m){ m.classList.remove('open'); m.innerHTML=''; } }
function confirmarAnexo(titulo,texto,botao){
  return new Promise(res=>{
    const m=janelaBase();
    m.innerHTML='<div class="anexo-janela-card" role="dialog" aria-modal="true"><div class="anexo-janela-head"><div><div class="anexo-janela-kicker">Anexos</div><div class="anexo-janela-title">'+esc(titulo)+'</div></div></div><p class="anexo-janela-texto">'+esc(texto)+'</p><div class="anexo-janela-acoes"><button type="button" class="ghost-btn" data-r="0">Cancelar</button><button type="button" class="primary-btn perigo" data-r="1">'+esc(botao)+'</button></div></div>';
    m.classList.add('open');
    const fim=v=>{ fecharJanela(); res(v); };
    m.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>fim(b.dataset.r==='1'));
    m.onclick=e=>{ if(e.target===m) fim(false); };
  });
}
function abrirJanelaAnexos(s,cat){

  m.innerHTML='<div class="anexo-janela-card" role="dialog" aria-modal="true" aria-label="Adicionar anexos">'
    +'<div class="anexo-janela-head"><div><div class="anexo-janela-kicker">'+esc(s.name)+'</div><div class="anexo-janela-title">'+esc(cat.titulo)+'</div></div><button type="button" class="anexo-janela-x" data-fechar aria-label="Fechar">×</button></div>'

  m.classList.add('open');
  const fila=m.querySelector('[data-fila]'), boxLinks=m.querySelector('[data-links]'), erro=m.querySelector('[data-erro]'), salvar=m.querySelector('[data-salvar]');
  const contar=()=>{ const n=arquivos.length+links.filter(l=>l.url.trim()).length; salvar.textContent=n?'Salvar '+n+' anexo'+(n>1?'s':''):'Salvar anexos'; salvar.disabled=!n||envioEmAndamento; };
  const desenharFila=()=>{ fila.innerHTML=arquivos.map((a,i)=>'<div class="anexo-fila-item '+(a.estado||'')+'"><span class="anexo-fila-nome">'+esc(a.file.name)+'</span><small>'+esc(a.msg||tamanhoFmt(a.file.size))+'</small>'+(envioEmAndamento?'':'<button type="button" data-tirar="'+i+'" aria-label="Remover">×</button>')+'</div>').join(''); fila.querySelectorAll('[data-tirar]').forEach(b=>b.onclick=()=>{ arquivos.splice(Number(b.dataset.tirar),1); desenharFila(); contar(); }); };
  const desenharLinks=()=>{ boxLinks.innerHTML=links.map((l,i)=>'<div class="anexo-link-linha"><input type="url" placeholder="Cole o link (https://…)" value="'+esc(l.url)+'" data-url="'+i+'"><input type="text" placeholder="Nome (opcional)" value="'+esc(l.nome)+'" data-nome="'+i+'">'+(links.length>1?'<button type="button" data-tirarlink="'+i+'" aria-label="Remover link">×</button>':'')+'</div>').join('');
    boxLinks.querySelectorAll('[data-url]').forEach(inp=>inp.oninput=()=>{ links[Number(inp.dataset.url)].url=inp.value; contar(); });
    boxLinks.querySelectorAll('[data-nome]').forEach(inp=>inp.oninput=()=>{ links[Number(inp.dataset.nome)].nome=inp.value; });
    boxLinks.querySelectorAll('[data-tirarlink]').forEach(b=>b.onclick=()=>{ links.splice(Number(b.dataset.tirarlink),1); desenharLinks(); contar(); }); };
  const adicionarArquivos=lista=>{ for(const f of lista){ if(f.size>LIMITE){ erro.textContent='"'+f.name+'" passa de 50 MB — para vídeo grande, use um link.'; continue; } arquivos.push({file:f}); } desenharFila(); contar(); };
  const inp=m.querySelector('input[type=file]'); inp.onchange=()=>{ adicionarArquivos([...inp.files]); inp.value=''; };
  const drop=m.querySelector('.anexo-drop');

  drop.addEventListener('dragleave',()=>drop.classList.remove('sobre'));
  drop.addEventListener('drop',e=>{ e.preventDefault(); drop.classList.remove('sobre'); adicionarArquivos([...(e.dataTransfer?.files||[])]); });
  m.querySelector('[data-maislink]').onclick=()=>{ links.push({url:'',nome:''}); desenharLinks(); boxLinks.querySelectorAll('[data-url]')[links.length-1]?.focus(); };
  const fechar=()=>{ if(envioEmAndamento) return; fecharJanela(); };
  m.querySelectorAll('[data-fechar]').forEach(b=>b.onclick=fechar);
  m.onclick=e=>{ if(e.target===m) fechar(); };
  salvar.onclick=async()=>{
    erro.textContent='';
    const linksOk=links.filter(l=>l.url.trim());
    const ruim=linksOk.find(l=>!/^https?:\/\/\S+$/i.test(l.url.trim()));
    if(ruim){ erro.textContent='Link inválido: "'+ruim.url+'". Ele precisa começar com http:// ou https://'; return; }
    envioEmAndamento=true; contar(); desenharFila();
    let falhas=0;
    for(const a of arquivos){
      if(a.estado==='ok') continue;
      a.estado='enviando'; a.msg='Enviando…'; desenharFila();
      const nomeSeguro=a.file.name.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w.\-]+/g,'_');
      const caminho=s.dealId+'/'+cat.id+'/'+Date.now()+'_'+Math.random().toString(36).slice(2,7)+'_'+nomeSeguro;
      const {error:e1}=await sb.storage.from('onboarding-anexos').upload(caminho,a.file,{contentType:a.file.type||undefined});
      let e2=null; if(!e1){ ({error:e2}=await sb.from('onboarding_anexos').insert({deal_id:s.dealId,categoria:cat.id,nome:a.file.name,caminho,tamanho:a.file.size,tipo:a.file.type||null})); if(e2) await sb.storage.from('onboarding-anexos').remove([caminho]); }
      if(e1||e2){ a.estado='falhou'; a.msg='Falhou: '+(e1||e2).message; falhas++; } else { a.estado='ok'; a.msg='Enviado ✓'; }
      desenharFila();
    }
    for(const l of linksOk){
      const url=l.url.trim(); const nome=(l.nome||'').trim()||(cat.id==='video'?'Vídeo da reunião':'Link');
      const {error:e}=await sb.from('onboarding_anexos').insert({deal_id:s.dealId,categoria:cat.id,nome,caminho:url,tipo:'link'});
      if(e){ falhas++; erro.textContent='Link não salvo: '+(e.message.includes('duplicate')?'esse link já está anexado.':e.message); }
    }
    envioEmAndamento=false;
    renderAnexos(s);

    else { const pend=arquivos.filter(a=>a.estado!=='ok'); arquivos.length=0; arquivos.push(...pend); links=links.filter(l=>l.url.trim()&&!linksOk.includes(l)).concat(linksOk.length?[]:[]); if(!links.length) links=[{url:'',nome:''}]; desenharFila(); desenharLinks(); contar(); }
  };

}

const cacheCnpj=new Map();
// Cópia das consultas COMPLETAS neste navegador por 7 dias (05/10/2026): o CNPJ.ws público
// aceita poucas consultas por minuto; sem a cópia, abrir vários cards seguidos esgotava o limite
// e MEI ficava sem e-mail/telefone/endereço (a BrasilAPI esconde esses dados de MEI).
const CNPJ_CACHE_KEY='bsconta_cnpj_cache_v1', CNPJ_CACHE_DIAS=7;
function cnpjCacheLer(d){ try{ const c=JSON.parse(localStorage.getItem(CNPJ_CACHE_KEY)||'{}')[d]; return c&&Date.now()-c.em<CNPJ_CACHE_DIAS*864e5?c.r:null; }catch{ return null; } }
function cnpjCacheGravar(d,r){ try{ const c=JSON.parse(localStorage.getItem(CNPJ_CACHE_KEY)||'{}'); c[d]={em:Date.now(),r}; const ks=Object.keys(c); if(ks.length>300) ks.sort((a,b)=>c[a].em-c[b].em).slice(0,ks.length-300).forEach(k=>delete c[k]); localStorage.setItem(CNPJ_CACHE_KEY,JSON.stringify(c)); }catch{} }
function buscarCnpj(d){
  if(cacheCnpj.has(d)) return cacheCnpj.get(d);
  const salvo=cnpjCacheLer(d); if(salvo){ const p0=Promise.resolve(salvo); cacheCnpj.set(d,p0); return p0; }
  const p=(async()=>{
    // BrasilAPI esconde endereço/telefone/e-mail de MEI; o CNPJ.ws traz.
    // Por isso consultamos a BrasilAPI e completamos o que faltar com o CNPJ.ws.
    let base=null, naoExiste=false, wsFalhou=false;
    try{ const r=await fetch(`https://brasilapi.com.br/api/cnpj/v1/${d}`); if(r.ok) base={fonte:'BrasilAPI',...normBrasilApi(await r.json())}; else if(r.status===404) naoExiste=true; }catch(e){}
    const incompleto=!base || !/\d|rua|av|rod|trav|pra/i.test(base.endereco||'') || !base.telefone || !base.email;
    if(incompleto){
      try{ const r=await fetch(`https://publica.cnpj.ws/cnpj/${d}`); if(r.ok){ const ws={fonte:'CNPJ.ws',...normCnpjWs(await r.json())};
        if(!base) base=ws; else { for(const k of Object.keys(ws)){ const v=base[k]; const vazio=v==null||v===''||(Array.isArray(v)&&!v.length); if(k==='endereco'? (String(ws[k]||'').length>String(v||'').length) : vazio) base[k]=ws[k]; } base.fonte='BrasilAPI + CNPJ.ws'; }
      } else if(r.status!==404) wsFalhou=true; }catch(e){ wsFalhou=true; }
    }
    if(base) return {...base, fonte:base.fonte+' (Receita Federal)', parcial:wsFalhou};
    if(naoExiste) return {erro:'CNPJ não encontrado na Receita Federal. Confira o número no RD.'};
    return {erro:'Não foi possível consultar o CNPJ agora. Tente abrir o card de novo em instantes.'};
  })();
  cacheCnpj.set(d,p);
  p.then(x=>{ if(x.erro||x.parcial) cacheCnpj.delete(d); else cnpjCacheGravar(d,x); });
  return p;
}
