<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gráficos — BSconta + Marketing</title>
  <link rel="icon" type="image/png" href="../assets/bsconta-icon.png" />
  <link rel="stylesheet" href="../css/styles.css?v=20260916.5" />
  <style>
    /* Gráficos — refinamento visual alinhado à Visão geral */
    .analytics-shell{display:flex;flex-direction:column;gap:1rem}
    .analytics-header{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:.05rem}
    .analytics-header .page-title{margin-bottom:.2rem}
    .analytics-sub{margin:0;color:var(--text-soft);font-size:.87rem}

    .analytics-filters{
      display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;
      min-height:52px;padding:.45rem .6rem;
      border:1px solid var(--border);
      background:var(--surface);
      border-radius:12px;
      box-shadow:var(--shadow-sm);
    }
    .analytics-filter-label{
      font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;
      font-weight:800;color:var(--text-faint);padding:0 .35rem 0 .15rem
    }
    .analytics-month-select{
      min-width:178px;height:38px;border:1px solid var(--border);
      border-radius:10px;background:#fff;padding:0 .75rem;
      font:inherit;font-size:.84rem;color:var(--text);outline:none;
      transition:border-color .16s ease,box-shadow .16s ease
    }
    .analytics-month-select:hover{border-color:#cfd4e1}
    .analytics-month-select:focus{border-color:var(--indigo-500);box-shadow:0 0 0 3px rgba(99,102,241,.1)}
    .analytics-custom-btn{
      height:38px;display:inline-flex;align-items:center;gap:.45rem;
      padding:0 .8rem;border:1px solid var(--border);border-radius:10px;
      background:#fff;color:var(--text-soft);font:inherit;font-size:.82rem;font-weight:700;
      cursor:pointer;transition:background .16s ease,color .16s ease,border-color .16s ease,box-shadow .16s ease,transform .16s ease
    }
    .analytics-custom-btn svg{width:17px;height:17px}
    .analytics-custom-btn:hover{transform:translateY(-1px);border-color:#cfd4e1;color:var(--text);box-shadow:var(--shadow-sm)}
    .analytics-custom-btn.active{border-color:var(--indigo-100);background:var(--indigo-50);color:var(--indigo-700)}
    .analytics-period-copy{margin-left:auto;color:var(--text-faint);font-size:.78rem;padding:0 .35rem;white-space:nowrap}

    .analytics-tabs-card{display:flex;flex-direction:column;gap:.8rem}
    .analytics-tabs{
      display:flex;gap:.18rem;align-items:center;flex-wrap:wrap;
      width:max-content;max-width:100%;padding:.2rem;
      border:1px solid var(--border);border-radius:12px;background:var(--surface);
      box-shadow:var(--shadow-sm)
    }
    .analytics-tab{
      position:relative;border:0;background:transparent;color:var(--text-soft);
      font:inherit;font-weight:700;font-size:.82rem;padding:.58rem .9rem;
      border-radius:9px;cursor:pointer;transition:background .16s ease,color .16s ease,box-shadow .16s ease,transform .16s ease
    }
    .analytics-tab:hover{color:var(--text);background:var(--surface-2);transform:translateY(-1px)}
    .analytics-tab.active{color:var(--indigo-700);background:var(--indigo-50);box-shadow:none}
    .analytics-tab.active::after{content:"";position:absolute;left:14px;right:14px;bottom:3px;height:2px;border-radius:999px;background:var(--indigo-500)}

    .analytics-empty{
      min-height:245px;display:grid;place-items:center;text-align:center;
      border:1px solid var(--border);background:var(--surface);border-radius:15px;
      box-shadow:var(--shadow-sm);color:var(--text-soft);padding:2rem
    }
    .analytics-empty strong{display:block;color:var(--text);font-size:.98rem;margin-bottom:.3rem;letter-spacing:-.01em}
    .analytics-empty span{font-size:.82rem;color:var(--text-faint)}

    .analytics-panel{display:flex;flex-direction:column;gap:.85rem}
    .analytics-panel-head{
      display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;
      padding:.05rem .15rem .1rem
    }
    .analytics-panel-title{margin:0;font-size:1rem;font-weight:800;color:var(--text);letter-spacing:-.01em}
    .analytics-panel-meta{font-size:.76rem;color:var(--text-faint)}
    .analytics-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr);gap:var(--gap)}

    .analytics-chart-card{
      padding:1.05rem 1.1rem 1rem;border:1px solid var(--border);
      border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow-sm);
      transition:box-shadow .16s ease,border-color .16s ease,transform .16s ease
    }
    .analytics-chart-card:hover{border-color:#dfe2ed;box-shadow:var(--shadow-md);transform:translateY(-1px)}
    .analytics-chart-card h3{margin:0 0 .18rem;font-size:.88rem;font-weight:800;color:var(--text)}
    .analytics-chart-card p{margin:0 0 .7rem;font-size:.75rem;color:var(--text-faint)}
    .analytics-chart-wrap{height:285px;position:relative}
    .analytics-chart-wrap.small{height:215px}
    .analytics-footnote{font-size:.71rem;color:var(--text-faint);margin-top:.3rem}

    @media(max-width:980px){
      .analytics-grid{grid-template-columns:1fr}
      .analytics-period-copy{margin-left:0;width:100%;padding:.2rem .15rem .1rem;white-space:normal}
    }
    @media(max-width:640px){
      .analytics-header{align-items:flex-start;flex-direction:column}
      .analytics-filters{align-items:stretch}
      .analytics-month-select,.analytics-custom-btn{width:100%;justify-content:center}
      .analytics-filter-label{width:100%;padding:.1rem .2rem 0}
      .analytics-tabs{width:100%;overflow-x:auto;flex-wrap:nowrap}
      .analytics-tab{white-space:nowrap}
      .analytics-chart-wrap{height:245px}
      .analytics-chart-wrap.small{height:200px}
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <div id="app-header"></div>
    <div class="app-content">
      <main class="main">
        <div id="content"><div class="loading-wrap"><div class="spinner"></div></div></div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/config.js?v=20260916"></script>
  <script src="../js/supabaseClient.js?v=20260916"></script>
  <script src="../js/auth.js?v=20260916"></script>
  <script src="../js/data.js?v=20260916"></script>
  <script src="../js/calc.js?v=20260916"></script>
  <script src="../js/ui.js?v=20260916.3"></script>
  <script src="../js/lancamentos.js?v=20260916"></script>
  <script src="../js/sync.js?v=20260916"></script>
  <script src="../js/marketingData.js?v=20260916"></script>
  <script src="../js/charts.js?v=20260916.3"></script>
  <script>
    let store = null;
    let lancamentos = [];
    let graphCategory = null;
    let graphChartKeys = [];

    const GRAPH_CATEGORIES = [
      ["sdr", "SDR"],
      ["marketing", "Marketing"],
      ["calls", "Ligações"],
      ["meetings", "Reuniões"],
      ["sales", "Vendas"],
      ["goals", "Metas"],
    ];

    const MONTHS_PT = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

    function monthKey(date){ return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}`; }
    function monthLabel(key){ const [y,m] = key.split("-").map(Number); return `${MONTHS_PT[m-1]}/${String(y).slice(-2)}`; }
    function monthStart(key){ const [y,m] = key.split("-").map(Number); return new Date(y,m-1,1); }
    function monthEnd(key){ const [y,m] = key.split("-").map(Number); return new Date(y,m,0,23,59,59,999); }
    function clampMonthRange(key, fullRange){
      const start = monthStart(key); const end = monthEnd(key);
      return { start: start < fullRange.start ? fullRange.start : start, end: end > fullRange.end ? fullRange.end : end };
    }
    function availableMonthKeys(){
      const all = (typeof MARKETING_SDR_DATA !== "undefined" ? MARKETING_SDR_DATA : []).map(r => r.period);
      const nowKey = monthKey(new Date());
      if (!all.includes(nowKey)) all.push(nowKey);
      return [...new Set(all)].sort().reverse();
    }
    function selectedGraphRange(){
      const p = new URLSearchParams(window.location.search);
      if (p.get("period") === "custom" && customRangeFromUrl()) return customRangeFromUrl();
      const selected = p.get("month") || availableMonthKeys()[0];
      const end = monthEnd(selected);
      const start = new Date(end.getFullYear(),0,1);
      return { start, end };
    }
    function selectedMonth(){
      const p = new URLSearchParams(window.location.search);
      return p.get("month") || availableMonthKeys()[0];
    }
    function clearGraphCharts(){
      graphChartKeys.forEach(id => { try{ destroyIfExists(id); }catch(_){} });
      graphChartKeys = [];
    }
    function monthBuckets(fullRange){
      const out=[];
      const cursor=new Date(fullRange.start.getFullYear(),fullRange.start.getMonth(),1);
      const final=new Date(fullRange.end.getFullYear(),fullRange.end.getMonth(),1);
      while(cursor<=final){
        const key=monthKey(cursor);
        out.push({ key, label: monthLabel(key), range: clampMonthRange(key, fullRange) });
        cursor.setMonth(cursor.getMonth()+1);
      }
      return out;
    }

    function callsFor(range){ return numerosDeLigacoesGeral(store, lancamentos, range); }
    function salesFor(range){
      const rows=(store.sales||[]).filter(s=>s.closed_at && inRange(s.closed_at,range));
      return { count: rows.length, revenue: rows.reduce((a,s)=>a+Number(s.value||0),0) };
    }
    function meetingsFor(range){
      const k=getKpis(store,{range,sellerId:undefined});
      return { scheduled:k.meetingsScheduled, done:k.meetingsDone, noShow:k.meetingsNoShow, rate:k.meetingRealizationRate||0 };
    }
    function leadsFor(range){
      return getLeads(store,{range,sellerId:undefined}).chegaram;
    }
    function qualifiedFor(range){
      // Mantém a mesma origem histórica usada na aba Marketing quando houver
      // dados mensais disponíveis; para períodos operacionais usa o estado
      // do funil, sem criar novos registros.
      const [from,to]=[isoDate(range.start),isoDate(range.end)];
      const matching=(store.deals||[]).filter(d=>d.created_at && isoDate(new Date(d.created_at))>=from && isoDate(new Date(d.created_at))<=to);
      if(!matching.length) return 0;
      const qualifiedNames=new Set(["Qualificado","Reunião Agendada","Reunião de Proposta","Provável Fechamento","Follow-Up","Fechado - Ganho","Ganho"]);
      const names=new Map((store.stages||[]).map(s=>[s.id,s.name]));
      return matching.filter(d=>qualifiedNames.has(names.get(d.stage_id))).length;
    }
    function contractsFor(range){ return salesFor(range).count; }
    function proposalsFor(range){ return getKpis(store,{range,sellerId:undefined}).proposalsSent; }

    function monthSeriesFor(category, fullRange){
      return monthBuckets(fullRange).map(b=>{
        const r=b.range;
        const k=getKpis(store,{range:r,sellerId:undefined});
        const calls=callsFor(r), meetings=meetingsFor(r), sales=salesFor(r);
        const leads=leadsFor(r), qualified=qualifiedFor(r);
        return { ...b, calls, meetings, sales, leads, qualified, k, contracts:sales.count, proposals:proposalsFor(r) };
      });
    }

    function marketingSeries(fullRange){
      const months=monthBuckets(fullRange);
      return months.map(b=>{
        const rows=(MARKETING_SDR_DATA||[]).filter(x=>x.period===b.key);
        if(rows.length){
          const r=rows[0];
          return { ...b, leads:r.leads, qualified:r.qualificados||r.qualificados||r.qualified||r.qualificados, qualified:r.qualificados||r.qualified||r.qualificados||0, meetings:r.reunioes, contracts:r.contratos, investment:r.investimento };
        }
        const leads=leadsFor(b.range), meetings=meetingsFor(b.range), sales=salesFor(b.range);
        return { ...b, leads, qualified:qualifiedFor(b.range), meetings:meetings.scheduled, contracts:sales.count, investment:0 };
      });
    }

    function goalsSeries(fullRange){
      return monthBuckets(fullRange).map(b=>{
        const monthGoals=(store.goals||[]).filter(g=>g.period_start && monthKey(new Date(g.period_start))===b.key && g.period==="MONTH");
        const target=monthGoals.reduce((a,g)=>a+Number(g.target_value||0),0);
        const realized=monthGoals.reduce((a,g)=>a+realizedForMetric(store,g.metric,b.range,g.seller_id,lancamentos),0);
        return { ...b, target, realized };
      });
    }

    function chartConfigFor(category, fullRange){
      if(category==="marketing"){
        const s=marketingSeries(fullRange);
        const conversion=s.map(x=>x.qualified>0?(x.contracts/x.qualified)*100:0);
        return {
          title:"Marketing — evolução mensal", sub:"Leads, qualificados, reuniões e contratos.",
          primary:{id:"marketing-volume", labels:s.map(x=>x.label), datasets:[
            {label:"Leads",data:s.map(x=>x.leads||0),color:"#2563eb"},
            {label:"Qualificados",data:s.map(x=>x.qualified||0),color:"#0f766e"},
            {label:"Reuniões",data:s.map(x=>x.meetings||0),color:"#7c3aed"},
            {label:"Contratos",data:s.map(x=>x.contracts||0),color:"#16a34a"}
          ]},
          secondary:{id:"marketing-investment", title:"Investimento mensal", labels:s.map(x=>x.label), datasets:[{label:"Investimento (R$)",data:s.map(x=>x.investment||0),color:"#7c3aed"}], currency:true},
          tertiary:{id:"marketing-conversion", title:"Conversão para contrato", labels:s.map(x=>x.label), datasets:[{label:"Conversão (%)",data:conversion,color:"#f59e0b"}], percent:true}
        };
      }
      const s=monthSeriesFor(category,fullRange);
      if(category==="sdr") return {
        title:"SDR — evolução mensal", sub:"Leads, conversas, agendamentos e conversões.",
        primary:{id:"sdr-volume",labels:s.map(x=>x.label),datasets:[
          {label:"Leads",data:s.map(x=>x.leads),color:"#2563eb"},
          {label:"Conversas",data:s.map(x=>x.calls.total),color:"#7c3aed"},
          {label:"Agendamentos",data:s.map(x=>x.meetings.scheduled),color:"#f59e0b"},
          {label:"Vendas",data:s.map(x=>x.sales.count),color:"#16a34a"}
        ]},
        secondary:{id:"sdr-conversion",title:"Conversão de leads em reuniões",labels:s.map(x=>x.label),datasets:[{label:"Conversão (%)",data:s.map(x=>x.leads>0?(x.meetings.done/x.leads)*100:0),color:"#059669"}],percent:true}
      };
      if(category==="calls") return {
        title:"Ligações — evolução mensal", sub:"Atendimentos e agendamentos vindos das ligações.",
        primary:{id:"calls-volume",labels:s.map(x=>x.label),datasets:[
          {label:"Ligações realizadas",data:s.map(x=>x.calls.total),color:"#2563eb"},
          {label:"Ligações de vendas",data:s.map(x=>x.calls.vendas),color:"#7c3aed"},
          {label:"Ligações de agendamento",data:s.map(x=>x.calls.agendamento),color:"#16a34a"},
          {label:"Agendamentos",data:s.map(x=>x.calls.agendamentos),color:"#f59e0b"}
        ]},
        secondary:{id:"calls-mix",title:"Participação das ligações de agendamento",labels:s.map(x=>x.label),datasets:[{label:"% de agendamento",data:s.map(x=>x.calls.total>0?(x.calls.agendamento/x.calls.total)*100:0),color:"#0891b2"}],percent:true}
      };
      if(category==="meetings") return {
        title:"Reuniões — evolução mensal", sub:"Agendadas, realizadas e no-show.",
        primary:{id:"meetings-volume",labels:s.map(x=>x.label),datasets:[
          {label:"Agendadas",data:s.map(x=>x.meetings.scheduled),color:"#4f46e5"},
          {label:"Realizadas",data:s.map(x=>x.meetings.done),color:"#16a34a"},
          {label:"No-show",data:s.map(x=>x.meetings.noShow),color:"#f59e0b"}
        ]},
        secondary:{id:"meetings-rate",title:"Taxa de realização",labels:s.map(x=>x.label),datasets:[{label:"Realização (%)",data:s.map(x=>x.meetings.rate),color:"#059669"}],percent:true}
      };
      if(category==="sales") return {
        title:"Vendas — evolução mensal", sub:"Volume de vendas, propostas e faturamento.",
        primary:{id:"sales-volume",labels:s.map(x=>x.label),datasets:[
          {label:"Vendas",data:s.map(x=>x.sales.count),color:"#16a34a"},
          {label:"Propostas",data:s.map(x=>x.proposals),color:"#7c3aed"}
        ]},
        secondary:{id:"sales-revenue",title:"Valor das vendas",labels:s.map(x=>x.label),datasets:[{label:"Faturamento (R$)",data:s.map(x=>x.sales.revenue),color:"#2563eb"}],currency:true}
      };
      const g=goalsSeries(fullRange);
      return {
        title:"Metas — evolução mensal", sub:"Meta definida x resultado realizado.",
        primary:{id:"goals-volume",labels:g.map(x=>x.label),datasets:[
          {label:"Meta",data:g.map(x=>x.target),color:"#94a3b8"},
          {label:"Realizado",data:g.map(x=>x.realized),color:"#4f46e5"}
        ]},
        secondary:{id:"goals-hit",title:"Atingimento da meta",labels:g.map(x=>x.label),datasets:[{label:"Atingimento (%)",data:g.map(x=>x.target>0?(x.realized/x.target)*100:0),color:"#16a34a"}],percent:true}
      };
    }


    function ensureChartJs(){
      if(window.Chart) return Promise.resolve();
      if(window.__chartJsPromise) return window.__chartJsPromise;
      window.__chartJsPromise=new Promise((resolve,reject)=>{
        const script=document.createElement("script");
        script.src="https://cdn.jsdelivr.net/npm/chart.js@4";
        script.onload=resolve;
        script.onerror=()=>reject(new Error("Não foi possível carregar o componente de gráficos."));
        document.head.appendChild(script);
      });
      return window.__chartJsPromise;
    }

    function renderLine(id, cfg){
      const canvas=document.getElementById(id); if(!canvas) return;
      graphChartKeys.push(id);
      renderDashboardLineChart(id,cfg.labels,cfg.datasets);
      const instance=window.chartInstances?.[id];
      if(instance){
        instance.options.scales.y.ticks.callback=(v)=>cfg.percent?`${v}%`:cfg.currency?brl(v):Number(v).toLocaleString("pt-BR");
        instance.options.plugins.tooltip.callbacks.label=(c)=>`${c.dataset.label}: ${cfg.percent?`${Number(c.parsed.y||0).toFixed(1)}%`:cfg.currency?brl(c.parsed.y||0):Number(c.parsed.y||0).toLocaleString("pt-BR")}`;
        instance.update();
      }
    }

    function renderAnalytics(){
      clearGraphCharts();
      const host=document.getElementById("analytics-content"); if(!host) return;
      const range=selectedGraphRange();
      if(!graphCategory){
        host.innerHTML='<div class="analytics-empty"><div><strong>Selecione uma análise</strong><span>Escolha SDR, Marketing, Ligações, Reuniões, Vendas ou Metas acima para visualizar a evolução.</span></div></div>';
        return;
      }
      const config=chartConfigFor(graphCategory,range);
      const activeLabel=GRAPH_CATEGORIES.find(x=>x[0]===graphCategory)?.[1]||graphCategory;
      host.innerHTML=`<section class="analytics-panel">
        <div class="analytics-panel-head"><div><h2 class="analytics-panel-title">${esc(config.title)}</h2><p class="analytics-panel-meta">${esc(config.sub)}</p></div><span class="analytics-panel-meta">${esc(rangeLabel(range))}</span></div>
        <div class="analytics-grid">
          <article class="analytics-chart-card"><h3>${esc(config.title)}</h3><p>Evolução dos indicadores no período.</p><div class="analytics-chart-wrap"><canvas id="${config.primary.id}"></canvas></div><div class="analytics-footnote">Passe o mouse sobre a linha para consultar os valores.</div></article>
          <article class="analytics-chart-card"><h3>${esc(config.secondary.title)}</h3><p>Indicador de conversão, valor ou atingimento.</p><div class="analytics-chart-wrap small"><canvas id="${config.secondary.id}"></canvas></div><div class="analytics-footnote">Linha de tendência mensal.</div></article>
          ${config.tertiary ? `<article class="analytics-chart-card"><h3>${esc(config.tertiary.title)}</h3><p>Indicador complementar da categoria.</p><div class="analytics-chart-wrap small"><canvas id="${config.tertiary.id}"></canvas></div><div class="analytics-footnote">Linha de tendência mensal.</div></article>` : ""}
        </div>
      </section>`;
      ensureChartJs().then(()=>{
        renderLine(config.primary.id,config.primary);
        renderLine(config.secondary.id,config.secondary);
        if(config.tertiary) renderLine(config.tertiary.id,config.tertiary);
      }).catch(err=>{
        host.innerHTML=`<div class="analytics-empty"><div><strong>Não foi possível carregar os gráficos</strong><span>${esc(err.message||"Erro ao carregar o componente de gráficos.")}</span></div></div>`;
      });
    }

    function renderFilters(){
      const box=document.getElementById("analytics-filters"); if(!box) return;
      const months=availableMonthKeys();
      const p=new URLSearchParams(window.location.search);
      const isCustom=p.get("period")==="custom" && customRangeFromUrl();
      const selected=isCustom?"":selectedMonth();
      box.innerHTML=`
        <span class="analytics-filter-label">Filtros</span>
        <select id="analytics-month" class="analytics-month-select" aria-label="Mês"><option value="">Mês de referência</option>${months.map(k=>`<option value="${k}" ${k===selected?"selected":""}>${monthLabel(k)}</option>`).join("")}</select>
        <button type="button" class="analytics-custom-btn ${isCustom?"active":""}" data-open-calendar>${ICONS.meeting}<span>${isCustom?rangeLabel(customRangeFromUrl()):"Período personalizado"}</span></button>
        <span class="analytics-period-copy">${isCustom?`Análise personalizada: ${rangeLabel(customRangeFromUrl())}`:`Evolução acumulada até ${monthLabel(selected)}`}</span>`;
      box.querySelector("#analytics-month")?.addEventListener("change",e=>{
        const p=new URLSearchParams(window.location.search); p.set("month",e.target.value||months[0]); p.delete("period"); p.delete("start"); p.delete("end"); window.history.replaceState(null,"",`?${p.toString()}`); renderPage();
      });
      setupCalendarPicker(renderPage);
    }

    function renderTabs(){
      const host=document.getElementById("analytics-tabs"); if(!host) return;
      host.innerHTML=GRAPH_CATEGORIES.map(([key,label])=>`<button type="button" class="analytics-tab ${graphCategory===key?"active":""}" data-graph-category="${key}">${label}</button>`).join("");
      host.querySelectorAll("[data-graph-category]").forEach(btn=>btn.addEventListener("click",()=>{graphCategory=btn.dataset.graphCategory; renderTabs(); renderAnalytics();}));
    }

    function renderPage(){
      const content=document.getElementById("content");
      content.className="analytics-shell";
      content.innerHTML=`<div class="analytics-header"><div><h1 class="page-title">Gráficos</h1><p class="analytics-sub">Central de análise dos principais indicadores comerciais.</p></div></div><div id="analytics-filters" class="analytics-filters"></div><div class="analytics-tabs-card"><div id="analytics-tabs" class="analytics-tabs" role="tablist" aria-label="Categorias de análise"></div><div id="analytics-content"></div></div>`;
      renderFilters();
      renderTabs();
      renderAnalytics();
    }

    (async()=>{
      try{
        const auth=await requireAuth(); if(!auth) return;
        renderShell(auth.profile);
        const dados=loadAllInstantaneo((novo)=>{ store=novo; if(document.getElementById("analytics-content")) renderPage(); }).catch(e=>e);
        const resultado=await dados; if(resultado instanceof Error) throw resultado; store=resultado;
        const p=new URLSearchParams(window.location.search); if(!p.get("month") && !(p.get("period")==="custom")){ p.set("month",availableMonthKeys()[0]); window.history.replaceState(null,"",`?${p.toString()}`); }
        try{ lancamentos=await carregarLancamentos({start:new Date(2026,0,1),end:new Date()}); }catch(_){ lancamentos=[]; }
        renderPage();
        startPageLoadSync(async()=>{ store=await loadAll({fresh:true}); try{ lancamentos=await carregarLancamentos({start:new Date(2026,0,1),end:new Date()}); }catch(_){ } renderPage(); });
      }catch(err){
        console.error(err);
        document.getElementById("content").innerHTML=`<div class="card card-p"><strong>Não foi possível carregar os gráficos.</strong><p class="muted">${esc(err?.message||"Erro desconhecido")}</p></div>`;
      }
    })();
  </script>
</body>
</html>
