  <script>
    let store = null; // dados do banco (RD Station), usados na origem dos leads

function marketingPerformance(m) {
      const qual = pct(m.qualificados, m.leads);
      const meeting = pct(m.reunioes, m.qualificados);
      const contract = pct(m.contratos, m.reunioes);
      if (m.contratos > 0 && contract >= 20) return { label: "Excelente", tone: "green", desc: "Boa conversão até contratos no período selecionado." };
      if (m.reunioes > 0 && meeting >= 20) return { label: "Boa", tone: "blue", desc: "Fluxo de aquisição com reuniões geradas no período selecionado." };
      if (m.leads > 0 && qual >= 70) return { label: "Atenção", tone: "amber", desc: "Há geração de leads, mas a conversão para as próximas etapas merece acompanhamento." };
      return { label: "Atenção", tone: "amber", desc: "Acompanhe a evolução do funil para identificar gargalos no período selecionado." };
    }

    const pct = (a, b) => b > 0 ? (a / b) * 100 : 0;
    const brl0 = (v) => Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
    const num = (v) => Number(v || 0).toLocaleString("pt-BR");

    function marketingCard(label, value, sub, tone, icon, delta = "") {
      return `
        <div class="kpi-card kpi-card--icon tone-${tone}">
          <div class="kpi-card-top">
            <div class="kpi-icon tone-${tone}">${icon}</div>
            <p class="kpi-label">${label}</p>
          </div>
          <p class="kpi-value">${value}</p>
          <p class="kpi-change neutral">${sub}</p>
          ${delta}
        </div>`;
    }

    const MARKETING_PERIODS = [
      { value: "last_month", label: "Mês passado" },
      { value: "this_month", label: "Mês atual" },
      { value: "last_3_months", label: "Últimos 3 meses" },
      { value: "this_year", label: "Este ano" },
    ];

    function monthRange(period) {
      const range = resolvePeriod(period);
      return { start: new Date(range.start.getFullYear(), range.start.getMonth(), 1), end: new Date(range.end.getFullYear(), range.end.getMonth(), 1) };
    }

    function aggregateMarketing(range) {
      const monthly = MARKETING_SDR_DATA.filter((row) => {
        const d = new Date(`${row.period}-01T00:00:00`);
        return d >= new Date(range.start.getFullYear(), range.start.getMonth(), 1) && d <= new Date(range.end.getFullYear(), range.end.getMonth(), 1);
      });
      return monthly.reduce((acc, row) => {
        for (const k of ["investimento","impressoes","cliques","leads","qualificados","reunioes","contratos"]) acc[k] += Number(row[k] || 0);
        return acc;
      }, { investimento:0, impressoes:0, cliques:0, leads:0, qualificados:0, reunioes:0, contratos:0 });
    }

    // ---- Comparativo de períodos (10/11/2026) ----
    // A planilha é mensal: cada período vira uma lista de meses, e o período de
    // comparação tem o mesmo número de meses.
    const MES_CURTO = ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
    const monthStart = (d) => new Date(d.getFullYear(), d.getMonth(), 1);
    const addMonths = (d, n) => new Date(d.getFullYear(), d.getMonth() + n, 1);
    const monthsBetween = (a, b) => (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth()) + 1;
    const monthLabel = (d) => `${MES_CURTO[d.getMonth()]}/${String(d.getFullYear()).slice(2)}`;
    const keyToDate = (k) => new Date(`${k}-01T00:00:00`);

    function rangeShortLabel(range) {
      const a = monthStart(range.start), b = monthStart(range.end);
      return monthsBetween(a, b) <= 1 ? monthLabel(a) : `${monthLabel(a)} – ${monthLabel(b)}`;
    }

    function compareRange(range, mode, monthKey) {
      const a = monthStart(range.start), b = monthStart(range.end);
      const n = monthsBetween(a, b);
      let start;
      if (mode === "previous") start = addMonths(a, -n);
      else if (mode === "last_year") start = addMonths(a, -12);
      else if (mode === "month" && monthKey) start = keyToDate(monthKey);
      else return null;
      const len = mode === "month" ? 1 : n;
      const endMonth = addMonths(start, len - 1);
      return { start, end: new Date(endMonth.getFullYear(), endMonth.getMonth() + 1, 0, 23, 59, 59, 999) };
    }

    function hasSheetData(range) {
      const a = monthStart(range.start), b = monthStart(range.end);
      return MARKETING_SDR_DATA.some((r) => { const d = keyToDate(r.period); return d >= a && d <= b; });
    }

    function withCosts(m) {
      return {
        ...m,
        cpl: m.leads > 0 ? m.investimento / m.leads : 0,
        cpq: m.qualificados > 0 ? m.investimento / m.qualificados : 0,
        cpr: m.reunioes > 0 ? m.investimento / m.reunioes : 0,
        cpc: m.contratos > 0 ? m.investimento / m.contratos : 0,
      };
    }

    // lowerIsBetter: para custos, cair é bom (verde).
    function deltaPill(a, b, { lowerIsBetter = false, suffix = "" } = {}) {
      if (!(b > 0)) return `<span class="cmp-delta flat">— sem base${suffix ? ` <small>${suffix}</small>` : ""}</span>`;
      const d = ((a - b) / b) * 100;
      if (Math.abs(d) < 0.5) return `<span class="cmp-delta flat">= 0%${suffix ? ` <small>${suffix}</small>` : ""}</span>`;
      const up = d > 0;
      const good = lowerIsBetter ? !up : up;
      return `<span class="cmp-delta ${good ? "good" : "bad"}">${up ? "▲" : "▼"} ${Math.abs(d).toFixed(1).replace(".", ",")}%${suffix ? ` <small>${suffix}</small>` : ""}</span>`;
    }

    const COMPARE_METRICS = [
      { key: "investimento", label: "Valor investido", hint: "Verba da planilha", fmt: (v) => brl0(v) },
      { key: "impressoes", label: "Impressões", hint: "Alcance", fmt: (v) => num(v) },
      { key: "cliques", label: "Cliques no link", hint: "No link do anúncio", fmt: (v) => num(v) },
      { key: "leads", label: "Leads gerados", hint: "Cadastros", fmt: (v) => num(v) },
      { key: "qualificados", label: "Qualificados", hint: "Leads aptos", fmt: (v) => num(v) },
      { key: "reunioes", label: "Reuniões", hint: "Agendadas", fmt: (v) => num(v) },
      { key: "contratos", label: "Contratos", hint: "Fechados", fmt: (v) => num(v) },
      { key: "cpl", label: "Custo por lead", hint: "Investimento ÷ leads", fmt: (v) => brl0(v), lower: true },
      { key: "cpq", label: "Custo por qualificado", hint: "Investimento ÷ qualificados", fmt: (v) => brl0(v), lower: true },
      { key: "cpr", label: "Custo por reunião", hint: "Investimento ÷ reuniões", fmt: (v) => brl0(v), lower: true },
      { key: "cpc", label: "Custo por contrato", hint: "Investimento ÷ contratos", fmt: (v) => brl0(v), lower: true },
    ];

    function compareCardHtml(A, B, labelA, labelB, temDadosB) {
      const rows = COMPARE_METRICS.map((mt) => {
        const a = Number(A[mt.key] || 0), b = Number(B[mt.key] || 0);
        const max = Math.max(a, b, 1);
        return `
          <div class="cmp-row">
            <div class="cmp-metric"><strong>${mt.label}</strong><small>${mt.hint}</small></div>
            <div class="cmp-bars">
              <div class="cmp-bar a"><div class="cmp-bar-track"><span style="width:${(a / max) * 100}%"></span></div><b>${mt.fmt(a)}</b></div>
              <div class="cmp-bar b"><div class="cmp-bar-track"><span style="width:${(b / max) * 100}%"></span></div><b>${mt.fmt(b)}</b></div>
            </div>
            ${deltaPill(a, b, { lowerIsBetter: mt.lower })}
          </div>`;
      }).join("");
      return `
        <div class="card card-p cmp-card">
          <div class="row-between marketing-card-head">
            <div>
              <h2>Comparativo de períodos</h2>
              <p class="card-sub">Cada etapa do funil lado a lado. Verde = melhorou (nos custos, cair é melhorar).</p>
            </div>
            <div class="cmp-head-chips">
              <span class="cmp-chip a"><i></i>${esc(labelA)}</span>
              <span class="cmp-vs">vs</span>
              <span class="cmp-chip b"><i></i>${esc(labelB)}</span>
            </div>
          </div>
          ${temDadosB ? `<div class="cmp-list">${rows}</div>` : `<div class="cmp-empty">A planilha não tem dados para ${esc(labelB)}. Escolha outro período de comparação.</div>`}
          <p class="cmp-note">Meses com reuniões e contratos ainda não preenchidos na planilha aparecem como 0.</p>
        </div>`;
    }

    function compareFilterHtml(mode, monthKey, labelB) {
      const opts = [
        { v: "", l: "Sem comparação" },
        { v: "previous", l: "Período anterior" },
        { v: "last_year", l: "Mesmo período do ano passado" },
        { v: "month", l: "Escolher mês" },
      ];
      const meses = [...MARKETING_SDR_DATA].reverse();
      const sel = monthKey || (meses[1] || meses[0]).period;
      return `
        <div class="cmp-filter">
          <span class="cmp-filter-label">${ICONS.sales}Comparativo</span>
          <div class="period-buttons">${opts.map((o) => `<button type="button" data-compare="${o.v}" class="${o.v === mode ? "active" : ""}">${o.l}</button>`).join("")}</div>
          ${mode === "month" ? `<select class="cmp-month" id="cmp-month">${meses.map((r) => `<option value="${r.period}" ${r.period === sel ? "selected" : ""}>${r.label}</option>`).join("")}</select>` : ""}
          ${mode && labelB ? `<span class="cmp-vs">comparando com <span class="cmp-chip b"><i></i>${esc(labelB)}</span></span>` : ""}
        </div>`;
    }

    function wireCompareFilter() {
      document.querySelectorAll("button[data-compare]").forEach((btn) => btn.addEventListener("click", () => {
        const p = new URLSearchParams(window.location.search);
        if (btn.dataset.compare) p.set("compare", btn.dataset.compare); else p.delete("compare");
        if (btn.dataset.compare !== "month") p.delete("compareMonth");
        history.replaceState(null, "", `${location.pathname}?${p}`);
        render();
      }));
      const s = document.getElementById("cmp-month");
      if (s) s.addEventListener("change", () => {
        const p = new URLSearchParams(window.location.search);
        p.set("compareMonth", s.value);
        history.replaceState(null, "", `${location.pathname}?${p}`);
        render();
      });
    }

    // ---- Tela "Comparativo" (13/11/2026) ----
    // A comparação saiu do painel principal e virou um botão "Comparativo".
    // Estado na URL: ?view=comparativo&cmpA=AAAA-MM&cmpB=AAAA-MM&de=AAAA-MM&ate=AAAA-MM
    function mesesDaPlanilha() { return MARKETING_SDR_DATA.map((r) => r.period); }
    function rotuloMes(k) { return (MARKETING_SDR_DATA.find((r) => r.period === k) || {}).label || k; }
    function mesKey(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; }
    function opcoesMeses(sel) {
      return [...MARKETING_SDR_DATA].reverse().map((r) => `<option value="${r.period}" ${r.period === sel ? "selected" : ""}>${esc(r.label)}</option>`).join("");
    }
    function mesRange(k) { const d = keyToDate(k); return { start: d, end: new Date(d.getFullYear(), d.getMonth() + 1, 0, 23, 59, 59, 999) }; }

    // Tabela mês a mês (pedido do Gabriel, 13/11/2026): cada métrica mostra
    // embaixo o custo em R$ (investimento ÷ métrica). Sem invest./leads
    // acumulados; contratos acumulados ficam. No final, soma e média.
    const MM_METRICAS = [
      { key: "impressoes", label: "Impressões", custo: "Custo por impressão" },
      { key: "cliques", label: "Cliques", custo: "Custo por clique" },
      { key: "leads", label: "Leads", custo: "Custo por lead" },
      { key: "qualificados", label: "Qualificados", custo: "Custo por qualificado" },
      { key: "reunioes", label: "Reuniões", custo: "Custo por reunião" },
      { key: "contratos", label: "Contratos", custo: "Custo por contrato" },
    ];
    const brl2 = (v) => Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL", minimumFractionDigits: 2, maximumFractionDigits: 2 });
    // Custo unitário: centavos quando < R$ 10 (impressão, clique), inteiro no resto.
    const custoFmt = (inv, qtd) => (qtd > 0 ? (inv / qtd < 10 ? brl2(inv / qtd) : brl0(inv / qtd)) : "—");
    // Custo por impressão com 3 casas (ex.: R$ 0,022) — pedido do Gabriel, 13/11/2026.
    const brl3 = (v) => Number(v || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL", minimumFractionDigits: 3, maximumFractionDigits: 3 });
    const custoDe = (key, inv, qtd) => (key === "impressoes" ? (qtd > 0 ? brl3(inv / qtd) : "—") : custoFmt(inv, qtd));
    // % comparativo: (valor ÷ base) − 1. Ex.: 52.451 ÷ 64.697 = 0,81 − 1 = −18,93%.
    function pctComp(v, base) {
      if (!(base > 0)) return `<span class="vt-pct flat">—</span>`;
      const d = (Number(v || 0) / base - 1) * 100;
      const cls = Math.abs(d) < 0.005 ? "flat" : d > 0 ? "up" : "down";
      return `<span class="vt-pct ${cls}">${d > 0 ? "+" : ""}${d.toFixed(2).replace(".", ",")}%</span>`;
    }
    const decFmt = (v) => Number(v || 0).toLocaleString("pt-BR", { maximumFractionDigits: 1 });

    function somaMeses(meses) {
      const campos = ["investimento", ...MM_METRICAS.map((m) => m.key)];
      const soma = Object.fromEntries(campos.map((k) => [k, 0]));
      for (const r of meses) for (const k of campos) soma[k] += Number(r[k] || 0);
      const qtd = meses.length || 1;
      const media = Object.fromEntries(campos.map((k) => [k, soma[k] / qtd]));
      return { soma, media };
    }

    function mesAMesHtml(meses, destaqueA = new Set(), destaqueB = new Set(), ferramentas = "") {
      const { soma, media } = somaMeses(meses);
      const maxInv = Math.max(1, ...meses.map((r) => Number(r.investimento || 0)));
      let acumContratos = 0;
      const cel = (qtd, inv, fmtQtd = num, key = "") => `<td class="cell-num"><b class="mm-q">${fmtQtd(qtd)}</b><span class="mm-c">${custoDe(key, inv, qtd)}</span></td>`;
      const linhas = meses.map((r) => {
        acumContratos += Number(r.contratos || 0);
        return `<tr class="${destaqueA.has(r.period) ? "no-periodo" : destaqueB.has(r.period) ? "mm-b" : ""}">
          <td>${esc(r.label)}</td>
          <td class="cell-num"><div class="mm-inv"><i style="width:${Math.round((r.investimento / maxInv) * 50)}px"></i>${brl0(r.investimento)}</div></td>
          ${MM_METRICAS.map((m) => cel(Number(r[m.key] || 0), Number(r.investimento || 0), num, m.key)).join("")}
          <td class="cell-num mm-acum">${num(acumContratos)}</td>
        </tr>`;
      }).join("");
      return `
        <div class="card card-p">
          <div class="cv-card-head">
            <div>
              <h2>Mês a mês</h2>
              <p>${num(meses.length)} meses · embaixo de cada número, o custo em R$ (investimento ÷ quantidade). Soma e média no final.</p>
            </div>
            ${ferramentas}
          </div>
          <div class="table-scroll" style="margin-top:.6rem">
            <table class="mm-tabela">
              <thead><tr>
                <th>Mês</th><th class="cell-num">Investimento</th>
                ${MM_METRICAS.map((m) => `<th class="cell-num">${m.label}<span class="mm-th-sub">R$ por ${m.label.toLowerCase().replace(/ões$/, "ão").replace(/s$/, "")}</span></th>`).join("")}
                <th class="cell-num">Contratos acumulados</th>
              </tr></thead>
              <tbody>${linhas}</tbody>
              <tfoot>
                <tr>
                  <td>Soma dos meses<small>${num(meses.length)} meses</small></td>
                  <td class="cell-num">${brl0(soma.investimento)}</td>
                  ${MM_METRICAS.map((m) => cel(soma[m.key], soma.investimento, num, m.key)).join("")}
                  <td class="cell-num mm-acum">${num(soma.contratos)}</td>
                </tr>
                <tr class="mm-media">
                  <td>Média mensal<small>soma ÷ ${num(meses.length)}</small></td>
                  <td class="cell-num">${brl0(media.investimento)}</td>
                  ${MM_METRICAS.map((m) => cel(media[m.key], media.investimento, m.key === "impressoes" ? (v) => num(Math.round(v)) : decFmt, m.key)).join("")}
                  <td class="cell-num">—</td>
                </tr>
              </tfoot>
            </table>
          </div>
          <p class="cv-note">Meses sem reuniões/contratos preenchidos na planilha entram como 0 (custo aparece como —). Custo da soma e da média = investimento total ÷ quantidade total.</p>
        </div>`;
    }

    // Mesma informação na vertical: métricas nas linhas, meses nas colunas.
    function mesAMesVerticalHtml(meses, destaqueA = new Set(), destaqueB = new Set()) {
      const { soma, media } = somaMeses(meses);
      const cls = (r) => (destaqueA.has(r.period) ? "va" : destaqueB.has(r.period) ? "vb" : "");
      let acum = 0;
      const acumulados = meses.map((r) => (acum += Number(r.contratos || 0)));
      // Soma e média logo depois da métrica; meses do mais recente para o mais antigo.
      const ordem = meses.map((r, i) => [r, i]).reverse();
      // % Comp Mês Anterior e % Comp Média (pedido do Gabriel, 13/11/2026). O mês
      // anterior vem da planilha inteira, mesmo fora do intervalo De/Até.
      const anteriorDe = (r) => MARKETING_SDR_DATA[MARKETING_SDR_DATA.findIndex((x) => x.period === r.period) - 1];
      const linhasPct = (key) => [
        linha("% Comp Mês Anterior", (r) => { const a = anteriorDe(r); return a ? pctComp(r[key], Number(a[key] || 0)) : `<span class="vt-pct flat">—</span>`; }, "", "", "vt-pctrow"),
        linha("% Comp Média", (r) => pctComp(r[key], media[key]), "", "", "vt-pctrow vt-pctlast"),
      ];
      const linha = (rotulo, porMes, s, m, extra = "") => `<tr class="${extra}"><th scope="row">${rotulo}</th><td class="cell-num vt-soma">${s}</td><td class="cell-num vt-media">${m}</td>${ordem.map(([r, i]) => `<td class="cell-num ${cls(r)}">${porMes(r, i)}</td>`).join("")}</tr>`;
      const corpo = [
        linha("Investimento", (r) => brl0(r.investimento), brl0(soma.investimento), brl0(media.investimento), "vt-inv"),
        ...linhasPct("investimento"),
        ...MM_METRICAS.flatMap((mt) => [
          linha(mt.label, (r) => num(r[mt.key]), num(soma[mt.key]), mt.key === "impressoes" ? num(Math.round(media[mt.key])) : decFmt(media[mt.key])),
          linha(mt.custo, (r) => custoDe(mt.key, Number(r.investimento || 0), Number(r[mt.key] || 0)), custoDe(mt.key, soma.investimento, soma[mt.key]), custoDe(mt.key, soma.investimento, soma[mt.key]), "vt-custo"),
          ...linhasPct(mt.key),
        ]),
        linha("Contratos acumulados", (r, i) => num(acumulados[i]), num(soma.contratos), "—", "vt-acum"),
      ].join("");
      return `
        <div class="card card-p">
          <div class="cv-card-head">
            <div>
              <h2>Comparativo Facebook (Moonflag)</h2>
              <p>Métricas nas linhas e meses nas colunas (do mais recente ao mais antigo), com soma e média logo no início. Mesmo intervalo De/Até da tabela acima.</p>
            </div>
          </div>
          <div class="table-scroll" style="margin-top:.6rem">
            <table class="vt-tabela">
              <thead><tr><th>Métrica</th><th class="cell-num vt-soma">Soma</th><th class="cell-num vt-media">Média</th>${[...meses].reverse().map((r) => `<th class="cell-num ${cls(r)}">${esc(r.label)}</th>`).join("")}</tr></thead>
              <tbody>${corpo}</tbody>
            </table>
          </div>
        </div>`;
    }

    // ---- Outras campanhas e indicações (pedido do Gabriel, 13/11/2026) ----
    // Mesma visão vertical, mas para os canais que não são o Facebook
    // (Moonflag), direto do RD Station: leads (negociações criadas), reuniões
    // realizadas ligadas à negociação e contratos (vendas). Sem investimento,
    // então sem custos e sem qualificados.
    const CANAIS_OUTROS = () => [...CANAIS_LEAD, CANAL_OUTROS].filter((c) => c.id !== "facebook");

    function outrasPorMes(canalId) {
      const vazio = () => ({ leads: 0, reunioes: 0, contratos: 0 });
      const porMes = new Map();
      if (!store) return porMes;
      const dealCanal = new Map((store.deals || []).map((d) => [d.id, canalDaFonte(d.origin).id]));
      const aceita = (id) => id && id !== "facebook" && (!canalId || id === canalId);
      const add = (data, campo, id) => {
        if (!data || !aceita(id)) return;
        const k = mesKey(new Date(data));
        if (!porMes.has(k)) porMes.set(k, vazio());
        porMes.get(k)[campo] += 1;
      };
      for (const d of store.deals || []) add(d.created_at, "leads", dealCanal.get(d.id));
      const { meetings } = classifyActivities(store.activities || [], store.sellers || []);
      for (const a of meetings) if (a.deal_id && isMeetingRealized(a)) add(a.scheduled_at, "reunioes", dealCanal.get(a.deal_id));
      for (const s of store.sales || []) add(s.closed_at, "contratos", dealCanal.get(s.deal_id));
      return porMes;
    }

    function outrasCampanhasHtml(mesesPlanilha, canalId, destaqueA = new Set(), destaqueB = new Set()) {
      const porMes = outrasPorMes(canalId);
      // Meses antes do primeiro lead no RD não têm dado (a integração é mais
      // nova que a planilha): ficam de fora para não virar 0 / −100%.
      const datas = (store?.deals || []).map((d) => d.created_at).filter(Boolean).map((d) => mesKey(new Date(d))).sort();
      const primeiro = datas[0] || "9999-99";
      const meses = mesesPlanilha.filter((r) => r.period >= primeiro);
      const val = (k, campo) => (porMes.get(k) || {})[campo] || 0;
      const campos = [
        { key: "leads", label: "Leads" },
        { key: "reunioes", label: "Reuniões" },
        { key: "contratos", label: "Contratos" },
      ];
      const qtd = meses.length || 1;
      const soma = Object.fromEntries(campos.map((c) => [c.key, meses.reduce((t, r) => t + val(r.period, c.key), 0)]));
      const media = Object.fromEntries(campos.map((c) => [c.key, soma[c.key] / qtd]));
      const cls = (r) => (destaqueA.has(r.period) ? "va" : destaqueB.has(r.period) ? "vb" : "");
      const ordem = [...meses].reverse();
      const anterior = (k) => mesKey(addMonths(keyToDate(k), -1));
      const linha = (rotulo, porMesFn, s, m, extra = "") => `<tr class="${extra}"><th scope="row">${rotulo}</th><td class="cell-num vt-soma">${s}</td><td class="cell-num vt-media">${m}</td>${ordem.map((r) => `<td class="cell-num ${cls(r)}">${porMesFn(r)}</td>`).join("")}</tr>`;
      const pcts = (key) => [
        linha("% Comp Mês Anterior", (r) => pctComp(val(r.period, key), val(anterior(r.period), key)), "", "", "vt-pctrow"),
        linha("% Comp Média", (r) => pctComp(val(r.period, key), media[key]), "", "", "vt-pctrow vt-pctlast"),
      ];
      let acum = 0;
      const acumulado = new Map(meses.map((r) => [r.period, (acum += val(r.period, "contratos"))]));
      const corpo = [
        ...campos.flatMap((c) => [linha(c.label, (r) => num(val(r.period, c.key)), num(soma[c.key]), decFmt(media[c.key]), "vt-main"), ...pcts(c.key)]),
        linha("Contratos acumulados", (r) => num(acumulado.get(r.period)), num(soma.contratos), "—", "vt-acum"),
      ].join("");
      const canais = CANAIS_OUTROS();
      const chip = (id, nome, cor) => `<button type="button" data-oc="${id}" class="${(canalId || "") === id ? "on" : ""}">${cor ? `<i class="oc-dot" style="background:${cor}"></i>` : ""}${esc(nome)}</button>`;
      return `
        <div class="card card-p">
          <div class="cv-card-head">
            <div>
              <h2>Comparativo outras campanhas e indicações</h2>
              <p>Leads, reuniões e contratos dos canais que não são o Facebook (Moonflag) — direto do RD Station. Mesmo intervalo De/Até.</p>
            </div>
            <div class="cv-chips">
              ${chip("", "Todos (sem Facebook)")}
              ${canais.map((c) => chip(c.id, c.nome, c.cor)).join("")}
            </div>
          </div>
          ${store ? `<div class="table-scroll" style="margin-top:.6rem">
            <table class="vt-tabela">
              <thead><tr><th>Métrica</th><th class="cell-num vt-soma">Soma</th><th class="cell-num vt-media">Média</th>${ordem.map((r) => `<th class="cell-num ${cls(r)}">${esc(r.label)}</th>`).join("")}</tr></thead>
              <tbody>${corpo}</tbody>
            </table>
          </div>
          <p class="cv-note">Leads = negociações criadas no RD no mês; reuniões = reuniões realizadas ligadas a uma negociação desse canal; contratos = vendas fechadas no mês. O canal vem do campo Fonte do RD. Meses anteriores ao início da integração com o RD não aparecem.</p>` : `<div class="cmp-empty">Carregando dados do RD Station…</div>`}
        </div>`;
    }

    function cvRowsHtml(metricas, A, B) {
      return metricas.map((mt) => {
        const a = Number(A[mt.key] || 0), b = Number(B[mt.key] || 0);
        const max = Math.max(a, b, 1);
        return `<div class="cv-row">
          <span class="cv-row-name">${mt.label}</span>
          <span class="cv-row-vals"><b>${mt.fmt(a)}</b><em>${mt.fmt(b)}</em></span>
          ${deltaPill(a, b, { lowerIsBetter: mt.lower })}
          <div class="cv-track"><span class="ta" style="width:${(a / max) * 100}%"></span><span class="tb" style="width:${(b / max) * 100}%"></span></div>
        </div>`;
      }).join("");
    }

    function comparativoView(params) {
      const ks = mesesDaPlanilha();
      const ultimo = ks[ks.length - 1];
      const valido = (k) => ks.includes(k);
      const kA = valido(params.get("cmpA")) ? params.get("cmpA") : ultimo;
      const kB = valido(params.get("cmpB")) ? params.get("cmpB") : (ks[ks.indexOf(kA) - 1] || ks[0]);
      let de = valido(params.get("de")) ? params.get("de") : ks[0];
      let ate = valido(params.get("ate")) ? params.get("ate") : ultimo;
      if (de > ate) [de, ate] = [ate, de];

      const A = withCosts(aggregateMarketing(mesRange(kA)));
      const B = withCosts(aggregateMarketing(mesRange(kB)));
      const lA = rotuloMes(kA), lB = rotuloMes(kB);
      const meses = MARKETING_SDR_DATA.filter((r) => r.period >= de && r.period <= ate);
      const anterior = mesKey(addMonths(keyToDate(kA), -1));
      const anoPassado = mesKey(addMonths(keyToDate(kA), -12));
      const doze = ks[Math.max(0, ks.length - 12)];
      const anoIni = ks.find((k) => k.startsWith(ultimo.slice(0, 4)));

      const kpi = (label, key, fmt, lower) => `
        <div class="card cv-kpi">
          <span class="cv-kpi-label">${label}</span>
          <span class="cv-kpi-value">${fmt(A[key])}</span>
          <div class="cv-kpi-foot"><small>${esc(lB)}: ${fmt(B[key])}</small>${deltaPill(A[key], B[key], { lowerIsBetter: lower })}</div>
        </div>`;
      const porKey = Object.fromEntries(COMPARE_METRICS.map((m) => [m.key, m]));
      const funil = ["investimento","impressoes","cliques","leads","qualificados","reunioes","contratos"].map((k) => porKey[k]);
      const custos = ["cpl","cpq","cpr","cpc"].map((k) => porKey[k]);
      const legenda = `<div class="cv-legend"><span><i style="background:var(--indigo-600)"></i>${esc(lA)}</span><span><i style="background:#94a3b8"></i>${esc(lB)}</span></div>`;
      const chip = (attr, val, label, on) => `<button type="button" ${attr}="${val}" class="${on ? "on" : ""}">${label}</button>`;

      return `
        <div class="row-between">
          <div>
            <h1 class="page-title">Comparativo</h1>
            <p class="page-sub">Compare os meses da planilha de marketing lado a lado.</p>
          </div>
          <div class="header-actions"><button type="button" class="cmp-back-btn" id="cmp-voltar">← Voltar ao painel</button></div>
        </div>

        <div class="card cv-bar">
          <div class="cv-pick">
            <label class="cv-sel a"><i></i><span>Mês</span><select id="cmp-a" aria-label="Mês">${opcoesMeses(kA)}</select></label>
            <span class="cv-vs">vs</span>
            <label class="cv-sel b"><i></i><span>Comparar com</span><select id="cmp-b" aria-label="Comparar com">${opcoesMeses(kB)}</select></label>
          </div>
          <div class="cv-chips">
            ${valido(anterior) ? chip("data-cmpb", anterior, "Mês anterior", kB === anterior) : ""}
            ${valido(anoPassado) ? chip("data-cmpb", anoPassado, "Mesmo mês do ano passado", kB === anoPassado) : ""}
          </div>
        </div>

        <div class="cv-kpis">
          ${kpi("Valor investido", "investimento", brl0)}
          ${kpi("Leads gerados", "leads", num)}
          ${kpi("Contratos", "contratos", num)}
          ${kpi("Custo por lead", "cpl", brl0, true)}
        </div>

        <div class="cv-grid">
          <div class="card card-p">
            <div class="cv-card-head"><div><h2>Funil</h2><p>Do investimento ao contrato.</p></div>${legenda}</div>
            <div class="cv-rows">${cvRowsHtml(funil, A, B)}</div>
          </div>
          <div class="card card-p">
            <div class="cv-card-head"><div><h2>Custos</h2><p>Verde = custo caiu.</p></div>${legenda}</div>
            <div class="cv-rows">${cvRowsHtml(custos, A, B)}</div>
          </div>
        </div>

        ${mesAMesHtml(meses, new Set([kA]), new Set([kB]), `
          <div class="cv-mm-tools">
            <label class="cv-sel"><span>De</span><select id="mm-de" aria-label="De">${opcoesMeses(de)}</select></label>
            <label class="cv-sel"><span>Até</span><select id="mm-ate" aria-label="Até">${opcoesMeses(ate)}</select></label>
            <div class="cv-chips">
              ${chip("data-mm", "12", "12 meses", de === doze && ate === ultimo)}
              ${chip("data-mm", "ano", "Este ano", de === anoIni && ate === ultimo)}
              ${chip("data-mm", "tudo", "Tudo", de === ks[0] && ate === ultimo)}
            </div>
          </div>`)}

        ${mesAMesVerticalHtml(meses, new Set([kA]), new Set([kB]))}

        ${outrasCampanhasHtml(meses, params.get("oc") || "", new Set([kA]), new Set([kB]))}`;
    }
    function setParams(changes) {
      const p = new URLSearchParams(window.location.search);
      for (const [k, v] of Object.entries(changes)) { if (v == null || v === "") p.delete(k); else p.set(k, v); }
      history.replaceState(null, "", `${location.pathname}?${p}`);
      render();
    }

    function wireComparativo() {
      document.querySelectorAll("[data-oc]").forEach((b) => b.addEventListener("click", () => setParams({ oc: b.dataset.oc || null })));
      document.getElementById("cmp-voltar")?.addEventListener("click", () => { setParams({ view: null }); window.scrollTo({ top: 0 }); });
      document.getElementById("cmp-a")?.addEventListener("change", (e) => setParams({ cmpA: e.target.value }));
      document.getElementById("cmp-b")?.addEventListener("change", (e) => setParams({ cmpB: e.target.value }));
      document.getElementById("mm-de")?.addEventListener("change", (e) => setParams({ de: e.target.value }));
      document.getElementById("mm-ate")?.addEventListener("change", (e) => setParams({ ate: e.target.value }));
      document.querySelectorAll("[data-cmpb]").forEach((b) => b.addEventListener("click", () => setParams({ cmpB: b.dataset.cmpb })));
      document.querySelectorAll("[data-mm]").forEach((b) => b.addEventListener("click", () => {
        const ks = mesesDaPlanilha(), ultimo = ks[ks.length - 1];
        if (b.dataset.mm === "tudo") setParams({ de: null, ate: null });
        else if (b.dataset.mm === "ano") setParams({ de: ks.find((k) => k.startsWith(ultimo.slice(0, 4))), ate: ultimo });
        else setParams({ de: ks[Math.max(0, ks.length - 12)], ate: ultimo });
      }));
    }

    function formatMarketingRange(range) {
      const f = (d) => d.toLocaleDateString("pt-BR", { day:"2-digit", month:"2-digit", year:"numeric" });
      return `${f(range.start)} até ${f(range.end)}`;
    }

    function periodKey(value) {
      return String(value).slice(0, 7);
    }

    function aggregateCampaignRows(range) {
      const startKey = periodKey(range.start.toISOString());
      const endKey = periodKey(range.end.toISOString());
      let rows = MARKETING_CAMPAIGN_DATA.filter((row) => row.period >= startKey && row.period <= endKey);
      let sourceLabel = "Período selecionado";

      // O detalhamento por campanha começou em jul/2026. Em períodos anteriores,
      // mostramos o último recorte disponível, deixando isso explícito no cabeçalho.
      if (!rows.length) {
        const latestPeriod = [...new Set(MARKETING_CAMPAIGN_DATA.map((r) => r.period))].sort().at(-1);
        rows = MARKETING_CAMPAIGN_DATA.filter((row) => row.period === latestPeriod);
        sourceLabel = `Último recorte disponível (${new Date(`${latestPeriod}-01T00:00:00`).toLocaleDateString("pt-BR", { month:"2-digit", year:"numeric" })})`;
      }

      const byCampaign = new Map();
      for (const row of rows) {
        const current = byCampaign.get(row.campaign) || {
          campaign: row.campaign,
          investimento:0,
          impressoes:0,
          cliques:0,
          leads:0,
          qualificados:0,
          reunioes:0,
          contratos:0,
          vendas:0,
        };
        for (const k of ["investimento","impressoes","cliques","leads","qualificados","reunioes","contratos"]) {
          current[k] += Number(row[k] || 0);
        }
        byCampaign.set(row.campaign, current);
      }

      const list = [...byCampaign.values()].map((row) => {
        const qualRate = pct(row.qualificados, row.leads);
        const meetingRate = pct(row.reunioes, row.qualificados);
        const contractRate = pct(row.contratos, row.reunioes);
        const vendasRate = pct(row.vendas, row.reunioes);
        return {
          ...row,
          valorAtualRodando: Number(row.valorAtualRodando ?? row.valor_atual_rodando ?? 0),
          qualRate,
          meetingRate,
          contractRate,
          vendasRate,
          cpl: row.leads > 0 ? row.investimento / row.leads : 0,
          cpq: row.qualificados > 0 ? row.investimento / row.qualificados : 0,
          cpr: row.reunioes > 0 ? row.investimento / row.reunioes : 0,
          cpc: row.contratos > 0 ? row.investimento / row.contratos : 0,
          hasActivity: [row.investimento,row.leads,row.qualificados,row.reunioes,row.vendas,row.contratos].some((value) => Number(value) > 0),
        };
      });

      // Campanhas com resultado/atividade ficam no topo; em seguida, as sem movimentação.
      list.sort((a, b) =>
        Number(b.hasActivity) - Number(a.hasActivity) ||
        b.contratos - a.contratos ||
        b.reunioes - a.reunioes ||
        b.leads - a.leads ||
        b.investimento - a.investimento ||
        a.campaign.localeCompare(b.campaign, "pt-BR")
      );

      return { list, sourceLabel };
    }

    function aggregateCampaigns(range) {
      const { list, sourceLabel } = aggregateCampaignRows(range);
      const best = list.find((row) => row.reunioes > 0 || row.contratos > 0) || list.find((row) => row.hasActivity) || list[0] || null;
      if (!best) return null;

      const totalMeetings = list.reduce((sum, row) => sum + row.reunioes, 0);
      const totalContracts = list.reduce((sum, row) => sum + row.contratos, 0);
      return {
        ...best,
        sourceLabel,
        meetingShare: totalMeetings > 0 ? (best.reunioes / totalMeetings) * 100 : 0,
        contractShare: totalContracts > 0 ? (best.contratos / totalContracts) * 100 : 0,
      };
    }

    function render() {
      const params = new URLSearchParams(window.location.search);
      if (params.get("view") === "comparativo") {
        const c = document.getElementById("content");
        c.className = "space-y";
        c.innerHTML = comparativoView(params);
        wireComparativo();
        return;
      }
      const period = params.get("period") || "last_month";
      const range = resolvePeriod(period);
      const m = aggregateMarketing(range);
      const cpl = m.leads > 0 ? m.investimento / m.leads : 0;
      const cpq = m.qualificados > 0 ? m.investimento / m.qualificados : 0;
      const cpr = m.reunioes > 0 ? m.investimento / m.reunioes : 0;
      const cpc = m.contratos > 0 ? m.investimento / m.contratos : 0;
      const qualRate = pct(m.qualificados, m.leads);
      const meetingRate = pct(m.reunioes, m.qualificados);
      const contractRate = pct(m.contratos, m.reunioes);
      const campaignData = aggregateCampaignRows(range);
      const campaignRows = campaignData.list;
      const bestCampaign = aggregateCampaigns(range);
      // Origem dos leads por canal e campanha — dados do RD Station (js/origens.js).
      const origens = getOrigensDosLeads(store, { range });

      // O comparativo agora fica na tela própria (botão "Comparativo").
      const dl = () => "";

      document.getElementById("content").className = "space-y";
      document.getElementById("content").innerHTML = `
        <div class="row-between">
          <div>
            <h1 class="page-title">Marketing</h1>
            <p class="page-sub">Aquisição, mídia e eficiência com base no Controle Gestão Marketing.</p>
          </div>
          <div class="header-actions">
            <button type="button" class="cmp-open-btn" id="cmp-abrir" title="Comparar meses">${ICONS.sales}Comparativo</button>
            <button type="button" class="icon-btn" aria-label="Calendário">${ICONS.meeting}</button>
          </div>
        </div>

        <div>
          <div id="period-filter"></div>
        </div>

        <div class="card card-p marketing-performance ${marketingPerformance(m).tone}">
          <div class="marketing-performance-icon">${ICONS.sales}</div>
          <div class="marketing-performance-text">
            <p class="marketing-performance-label">Performance de Marketing do período</p>
            <p class="marketing-performance-title">${marketingPerformance(m).label} <span aria-hidden="true">✨</span></p>
          </div>
          <p class="marketing-performance-desc">${marketingPerformance(m).desc}</p>
          <div class="marketing-performance-illustration">${ICONS.rocket}</div>
        </div>

        <div class="card card-p marketing-source-note">
          <div><strong>Período analisado:</strong> ${formatMarketingRange(range)}<small class="marketing-period-note">A base da planilha é mensal; no período personalizado, são consolidados os meses abrangidos.</small></div>
        </div>

        <div class="kpi-grid cols-4 marketing-kpis">
          ${marketingCard("Investimento", brl0(m.investimento), "Verba registrada na planilha", "blue", ICONS.dollarSign, dl("investimento"))}
          ${marketingCard("Impressões", num(m.impressoes), "Alcance acumulado", "indigo", ICONS.eye, dl("impressoes"))}
          ${marketingCard("Leads gerados", num(m.leads), `${pct(m.leads, m.cliques).toFixed(1)}% dos cliques`, "teal", ICONS.userCheck, dl("leads"))}
          ${marketingCard("Qualificados", num(m.qualificados), `${qualRate.toFixed(1)}% dos leads`, "green", ICONS.users, dl("qualificados"))}
        </div>

        <div class="kpi-grid cols-4 marketing-kpis">
          ${marketingCard("Cliques", num(m.cliques), "Cliques no link", "blue", ICONS.send, dl("cliques"))}
          ${marketingCard("Reuniões", num(m.reunioes), `${meetingRate.toFixed(1)}% dos qualificados`, "violet", ICONS.meeting, dl("reunioes"))}
          ${marketingCard("Contratos", num(m.contratos), `${contractRate.toFixed(1)}% das reuniões`, "green", ICONS.handshake, dl("contratos"))}
          ${marketingCard("Custo por contrato", brl0(cpc), "Investimento ÷ contratos", "orange", ICONS.sales, dl("cpc", true))}
        </div>


        <div class="grid-2 marketing-main-grid">
          <div class="card card-p origem-card">
            <div class="row-between marketing-card-head">
              <div>
                <h2>Origem dos leads</h2>
                <p class="card-sub">Leads que chegaram no período, por canal de origem — direto do RD Station (campo Fonte).</p>
              </div>
              <span class="mini-badge">${num(origens.total)} leads</span>
            </div>
            <div class="origem-lista">
              ${origens.canais.map((c) => `
                <div class="origem-linha">
                  <div class="origem-topo">
                    <span class="origem-nome"><i style="background:${c.cor}"></i>${esc(c.nome)}</span>
                    <span class="origem-num"><strong>${num(c.leads)}</strong> leads · ${pct(c.leads, origens.total).toFixed(0)}%</span>
                  </div>
                  <div class="origem-barra"><span style="width:${pct(c.leads, origens.total)}%;background:${c.cor}"></span></div>
                  <div class="origem-detalhe">
                    <span><strong>${num(c.vendas)}</strong> viraram clientes (${c.conversao.toFixed(1)}%)</span>
                    <span>${brl0(c.valorVendido)} vendidos</span>
                    <span><strong>${num(c.perdidos)}</strong> perdidos</span>
                  </div>
                  ${c.fontes.length ? `<div class="origem-fontes">${c.fontes.map(([nome, n]) => `<span>${esc(nome)}: ${num(n)}</span>`).join("")}</div>` : ""}
                </div>`).join("")}
            </div>
          </div>

          <div class="card card-p">
            <div class="row-between marketing-card-head">
              <div>
                <h2>Eficiência de aquisição</h2>
                <p class="card-sub">Investimento e custo médio em cada etapa do funil.</p>
              </div>
            </div>

            <div class="marketing-efficiency-list">
              <div class="marketing-efficiency-item marketing-efficiency-item--primary">
                <div class="marketing-efficiency-copy">
                  <span>Valor investido</span>
                  <small>Verba aplicada no período selecionado</small>
                </div>
                <strong>${brl0(m.investimento)}</strong>
              </div>

              <div class="marketing-efficiency-item">
                <div class="marketing-efficiency-stage">
                  <span class="marketing-efficiency-label">CPL</span>
                  <span class="marketing-efficiency-stage-name">Custo por Lead</span>
                </div>
                <div class="marketing-efficiency-value">
                  <strong>${brl0(cpl)}</strong>
                  <small>${num(m.leads)} ${m.leads === 1 ? 'lead' : 'leads'}</small>
                </div>
              </div>

              <div class="marketing-efficiency-item">
                <div class="marketing-efficiency-stage">
                  <span class="marketing-efficiency-label">CPQ</span>
                  <span class="marketing-efficiency-stage-name">Custo por Qualificado</span>
                </div>
                <div class="marketing-efficiency-value">
                  <strong>${brl0(cpq)}</strong>
                  <small>${num(m.qualificados)} qualificados · ${qualRate.toFixed(1)}% dos leads</small>
                </div>
              </div>

              <div class="marketing-efficiency-item">
                <div class="marketing-efficiency-stage">
                  <span class="marketing-efficiency-label">CPR</span>
                  <span class="marketing-efficiency-stage-name">Custo por Reunião</span>
                </div>
                <div class="marketing-efficiency-value">
                  <strong>${brl0(cpr)}</strong>
                  <small>${num(m.reunioes)} reuniões · ${meetingRate.toFixed(1)}% dos qualificados</small>
                </div>
              </div>

              <div class="marketing-efficiency-item">
                <div class="marketing-efficiency-stage">
                  <span class="marketing-efficiency-label">CPC</span>
                  <span class="marketing-efficiency-stage-name">Custo por Contrato</span>
                </div>
                <div class="marketing-efficiency-value">
                  <strong>${brl0(cpc)}</strong>
                  <small>${num(m.contratos)} contratos · ${contractRate.toFixed(1)}% das reuniões</small>
                </div>
              </div>
            </div>

            
          </div>
        </div>

        <div class="card card-p">
          <div class="row-between marketing-card-head">
            <div>
              <h2>Leads por campanha</h2>
              <p class="card-sub">Campanha registrada no RD Station para cada lead que chegou no período.</p>
            </div>
            <span class="mini-badge">${num(origens.campanhas.length)} campanhas</span>
          </div>
          <div class="table-scroll">
            <table class="origem-tabela">
              <thead><tr><th>Campanha</th><th>Canal</th><th class="cell-num">Leads</th><th class="cell-num">Clientes</th><th class="cell-num">Conversão</th><th class="cell-num">Valor vendido</th><th class="cell-num">Perdidos</th></tr></thead>
              <tbody>
                ${origens.campanhas.length ? origens.campanhas.map((c) => `<tr>
                  <td>${esc(c.nome)}</td><td>${esc(c.canal)}</td>
                  <td class="cell-num"><strong>${num(c.leads)}</strong></td><td class="cell-num">${num(c.vendas)}</td>
                  <td class="cell-num">${c.conversao.toFixed(1)}%</td><td class="cell-num">${brl0(c.valorVendido)}</td><td class="cell-num">${num(c.perdidos)}</td>
                </tr>`).join("") : `<tr><td colspan="7" class="text-empty">Nenhum lead chegou no período selecionado.</td></tr>`}
              </tbody>
            </table>
          </div>
        </div>


      `;

      renderPeriodFilter(document.getElementById("period-filter"), [], render, { periods: MARKETING_PERIODS, defaultPeriod: "last_month", showSellerFilter: false });
      setupCalendarPicker(render);
      document.getElementById("cmp-abrir").addEventListener("click", () => {
        // Abre já comparando o último mês do período escolhido com o anterior.
        const ks = mesesDaPlanilha();
        const fim = mesKey(range.end);
        const kA = ks.includes(fim) ? fim : ks[ks.length - 1];
        setParams({ view: "comparativo", cmpA: kA, cmpB: ks[ks.indexOf(kA) - 1] || ks[0] });
        window.scrollTo({ top: 0 });
      });
    }

    (async () => {
      try {
        const auth = await requireAuth();
        if (!auth) return;
        renderShell(auth.profile);
        // Os leads por canal/campanha vêm do banco (RD Station); o resto da tela
        // continua vindo da planilha de marketing (js/marketingData.js).
        store = await loadAllInstantaneo((novo) => { store = novo; render(); });
        render();
        startPageLoadSync(async () => { store = await loadAll({ fresh: true }); render(); });
      } catch (err) {
        console.error(err);
        showFatalError(err);
      }
    })();
  </script>
</body>
